<title>Lasik SOP Compliance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">

<style>
  :root{
    --ground:#FBFAF8; --surface:#FFFFFF; --surface-2:#F3F2EE; --surface-3:#E7E5DF;
    --ink:#14151C; --ink-2:#3B3E4C; --muted:#6A6F80;
    --rule:#DEDCD6; --rule-2:#EAE8E3;
    --accent:#2438B8; --accent-soft:#E7E9F8;
    --mark:#E6EE6B; --mark-ink:#2B2C0E;
    --ok:#17795E; --ok-soft:#E2F0EA;
    --warn:#A6690A; --warn-soft:#F7EEDC; --warn-mid:#EFDCBB;
    --bad:#AE2E48; --bad-soft:#F8E6EA;
    --g1:#E8F0EA; --g2:#BFDCCB; --g3:#83BFA0; --g4:#2F9673;
    --inert:#5A6072; --inert-soft:#EBECEF;
    --shadow:0 1px 2px rgba(20,21,28,.05), 0 8px 24px -18px rgba(20,21,28,.25);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0E0F14; --surface:#171922; --surface-2:#1E2029; --surface-3:#2A2D39;
      --ink:#E9EAF0; --ink-2:#BFC3D0; --muted:#8D93A5;
      --rule:#2B2E3A; --rule-2:#23262F;
      --accent:#8D99F7; --accent-soft:#1D2140;
      --mark:#C6CE55; --mark-ink:#14150A;
      --ok:#5FC7A4; --ok-soft:#12291F;
      --warn:#E0A83F; --warn-soft:#2C2211; --warn-mid:#453317;
      --bad:#F0819A; --bad-soft:#2E141B;
      --g1:#14211B; --g2:#1B3A2C; --g3:#255744; --g4:#37836423;
      --g4:#2F7A5E;
      --inert:#98A0B4; --inert-soft:#1F2129;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.85);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0E0F14; --surface:#171922; --surface-2:#1E2029; --surface-3:#2A2D39;
    --ink:#E9EAF0; --ink-2:#BFC3D0; --muted:#8D93A5;
    --rule:#2B2E3A; --rule-2:#23262F;
    --accent:#8D99F7; --accent-soft:#1D2140;
    --mark:#C6CE55; --mark-ink:#14150A;
    --ok:#5FC7A4; --ok-soft:#12291F;
    --warn:#E0A83F; --warn-soft:#2C2211; --warn-mid:#453317;
    --bad:#F0819A; --bad-soft:#2E141B;
    --g1:#14211B; --g2:#1B3A2C; --g3:#255744; --g4:#2F7A5E;
    --inert:#98A0B4; --inert-soft:#1F2129;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.85);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body.lang-zh{font-family:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
  .wrap{max-width:1300px;margin:0 auto;padding:0 24px 90px}

  /* gate */
  #gate{position:fixed;inset:0;z-index:100;background:var(--ground);
    display:flex;align-items:center;justify-content:center;padding:24px}
  #gate.gone{display:none}
  .gatecard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--rule);
    border-radius:6px;box-shadow:var(--shadow);padding:34px 32px}
  .gatecard .brand{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:14px}
  .gatecard h2{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:1.42rem;
    letter-spacing:-.015em;margin:0 0 7px;line-height:1.2}
  .gatecard .lede{font-size:.88rem;color:var(--muted);margin:0 0 24px}
  .field{margin-bottom:15px}
  .field label{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
    letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
  .field input{width:100%;padding:10px 12px;font-family:inherit;font-size:.92rem;
    background:var(--ground);color:var(--ink);border:1px solid var(--rule);border-radius:4px}
  .field input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  .gatebtn{width:100%;padding:11px;background:var(--accent);color:var(--surface);border:0;
    border-radius:4px;font-weight:600;font-size:.92rem;margin-top:6px}
  .gatebtn:disabled{opacity:.55;cursor:default}
  .gateerr{background:var(--bad-soft);color:var(--bad);border-radius:4px;padding:9px 12px;
    font-size:.84rem;margin-bottom:15px;display:none}
  .gateerr.on{display:block}
  .who{display:flex;align-items:center;gap:9px;font-family:"IBM Plex Mono",monospace;
    font-size:10.5px;color:var(--muted)}
  .who button{background:none;border:1px solid var(--rule);border-radius:4px;padding:4px 10px;
    color:var(--muted);font-size:10.5px;font-family:inherit}
  .who button:hover{color:var(--ink);border-color:var(--muted)}

  header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;padding:32px 0 16px}
  .titleblock h1{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:1.7rem;letter-spacing:-.015em;margin:0 0 5px}
  .titleblock .sub{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .seg{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--surface)}
  .seg button{background:none;border:0;padding:7px 12px;color:var(--muted);font-size:12.5px;font-weight:500;border-right:1px solid var(--rule)}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}

  .clinics{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 10px}
  .clinics button{background:var(--surface);border:1px solid var(--rule);border-radius:20px;
    padding:6px 14px;font-size:.85rem;color:var(--ink-2);display:flex;align-items:center;gap:8px}
  .clinics button .cn{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--ok)}
  .clinics button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
  .clinics button[aria-pressed="true"] .cn{color:var(--surface)}
  .scopebar{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin-bottom:20px}
  .scopebar b{color:var(--accent);font-weight:600}

  .herorow{display:grid;grid-template-columns:1fr 300px;gap:16px;margin-bottom:18px;align-items:stretch}
  @media (max-width:940px){.herorow{grid-template-columns:1fr}}
  .hero{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--accent);
    border-radius:4px;box-shadow:var(--shadow);padding:24px 28px;
    display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center}
  @media (max-width:760px){.hero{grid-template-columns:1fr;gap:18px;padding:20px}}
  .hero .bignum{font-size:4.1rem;font-weight:600;letter-spacing:-.045em;line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums}
  .hero .biglab{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:10px}
  .hero .sideline{font-size:.98rem;color:var(--ink-2);margin:0 0 14px;max-width:56ch}
  .hero .sideline b{color:var(--ink);font-weight:600}
  .passbar{display:flex;height:32px;gap:3px;margin:0 0 8px}
  .passbar .sg{border-radius:2px;min-width:3px;display:flex;align-items:center;justify-content:center;
    font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:#fff}
  .barlegend{display:flex;gap:18px;flex-wrap:wrap;font-size:.82rem}
  .barlegend span.i{display:flex;gap:7px;align-items:center}
  .barlegend .sw{width:10px;height:10px;border-radius:2px}

  .flagcard{background:var(--warn-soft);border:1px solid var(--warn);border-left:4px solid var(--warn);
    border-radius:4px;box-shadow:var(--shadow);padding:20px 22px;display:flex;flex-direction:column;
    gap:11px;min-width:0;overflow-wrap:anywhere}
  .flagcard .fnum{font-size:2.5rem;font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--warn);font-variant-numeric:tabular-nums}
  .flagcard .flab{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--warn);font-weight:600}
  .flagcard p{margin:0;font-size:.83rem;color:var(--ink-2)}
  .flist{display:flex;flex-direction:column;min-width:0}
  .flist .fr{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;
    gap:2px 12px;font-size:.81rem;padding:6px 0;border-bottom:1px solid var(--warn-mid);min-width:0}
  .flist .fr:last-child{border-bottom:0}
  .flist .fr > span:first-child{flex:1 1 auto;min-width:0}
  .flist .fv{font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums;
    white-space:normal;overflow-wrap:anywhere;text-align:right;max-width:100%;line-height:1.45}

  .panel{background:var(--surface);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);margin-bottom:18px}
  .panel > h3{margin:0;padding:14px 20px;border-bottom:1px solid var(--rule-2);font-size:.92rem;font-weight:600;
    display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
  .panel > h3 .hint{font-weight:400;font-size:.79rem;color:var(--muted)}
  .pad{padding:18px 20px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  @media (max-width:940px){.grid2{grid-template-columns:1fr}}

  /* funnel */
  .funnel{display:grid;gap:12px}
  .fstep{display:grid;grid-template-columns:76px 1fr 92px;gap:14px;align-items:center}
  @media (max-width:640px){.fstep{grid-template-columns:64px 1fr 72px;gap:9px}}
  .fstep .fd{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.85rem}
  .fstep .ftrack{height:26px;background:var(--surface-3);border-radius:3px;overflow:hidden;position:relative}
  .fstep .ffill{height:100%;border-radius:3px}
  .fstep .fnums{font-family:"IBM Plex Mono",monospace;font-size:.82rem;text-align:right;font-variant-numeric:tabular-nums}
  .fstep .fnums b{font-weight:600}
  .ftask{grid-column:2/-1;font-size:.79rem;color:var(--muted);margin-top:-6px;line-height:1.4}

  .tblwrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:.875rem}
  th,td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--rule-2)}
  thead th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap;border-bottom:1px solid var(--rule)}
  tbody tr:last-child td{border-bottom:0}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  td.n{font-family:"IBM Plex Mono",monospace}
  tbody tr.tot td{background:var(--surface-2);font-weight:600;border-top:1px solid var(--rule)}
  table.heat td.c{text-align:center;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
    font-weight:600;border-left:1px solid var(--rule-2)}
  table.heat th.c{text-align:center}
  table.heat td.v0{background:var(--bad-soft);color:var(--bad)}
  table.heat td.v1{background:var(--g1)}
  table.heat td.v2{background:var(--g2)}
  table.heat td.v3{background:var(--g3)}
  table.heat td.v4{background:var(--g4);color:#fff}
  :root[data-theme="dark"] table.heat td.v4,
  :root:not([data-theme="light"]) table.heat td.v4{color:var(--ink)}
  .heatkey{display:flex;gap:8px;align-items:center;padding:12px 20px;border-top:1px solid var(--rule-2);
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .heatkey i{width:22px;height:11px;border-radius:2px;display:inline-block}

  .bar{display:inline-block;height:7px;border-radius:2px;background:var(--ok);vertical-align:middle;min-width:2px}
  .barn{background:var(--bad)}
  .pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.05em;
    padding:2px 7px;border-radius:3px;font-weight:600;white-space:nowrap}
  .p-ok{background:var(--ok-soft);color:var(--ok)}
  .p-bad{background:var(--bad-soft);color:var(--bad)}
  .p-warn{background:var(--warn-soft);color:var(--warn)}
  .p-inert{background:var(--inert-soft);color:var(--inert)}

  .note{background:var(--surface-2);border:1px solid var(--rule);border-radius:4px;padding:15px 18px;margin-bottom:20px;font-size:.87rem}
  .note p{margin:0}
  .months button .cn{color:var(--accent)}
  .months button[aria-pressed="true"] .cn{color:var(--surface)}
  .mtdtag{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.08em;
    background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:3px;font-weight:600}
  .months button[aria-pressed="true"] .mtdtag{background:rgba(255,255,255,.22);color:var(--surface)}
  .mtdgrid{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
  @media (max-width:520px){.mtdgrid{grid-template-columns:1fr;gap:16px}}
  .mtdnum{font-size:3.1rem;font-weight:600;letter-spacing:-.04em;line-height:.95;
    color:var(--accent);font-variant-numeric:tabular-nums}
  .mtdlab{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);margin-top:8px}
  .mtdside{display:flex;flex-direction:column;gap:0}
  .mtdrow{display:flex;justify-content:space-between;gap:14px;font-size:.85rem;
    padding:6px 0;border-bottom:1px solid var(--rule-2)}
  .mtdrow:last-child{border-bottom:0}
  .mtdrow b{font-family:"IBM Plex Mono",monospace}
  .mtdnote{margin:14px 0 0;font-size:.8rem;color:var(--muted);line-height:1.5}
  .mtrend{display:flex;align-items:flex-end;gap:10px;height:150px}
  .mcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;justify-content:flex-end}
  .mbar{width:100%;max-width:46px;border-radius:2px 2px 0 0}
  .mval{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600}
  .mlab{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--muted)}
  .mn{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--muted);opacity:.75}
  .hidden{display:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media (max-width:640px){
    .wrap{padding:0 16px 60px}
    .titleblock h1{font-size:1.3rem}
    .hero .bignum{font-size:3.2rem}
  }
</style>

<div id="gate">
  <form class="gatecard" id="gateform" autocomplete="on">
    <div class="brand">Bệnh viện Mắt Sài Gòn</div>
    <h2>Lasik SOP Compliance</h2>
    <p class="lede" id="gateLede">Sign in to view the QC audit.</p>
    <div class="gateerr" id="gateErr"></div>
    <div class="field">
      <label for="gp" id="lpass">Password</label>
      <input type="password" id="gp" name="password" autocomplete="current-password" required autofocus>
    </div>
    <button type="submit" class="gatebtn" id="gateBtn">Sign in</button>
  </form>
</div>

<div class="wrap" id="wrap" hidden>
  <header class="top">
    <div class="titleblock">
      <h1 id="pgTitle">Lasik SOP Compliance</h1>
      <div class="sub"><span id="pgSub">QC audit</span> &middot; 26 Aug 2026</div>
    </div>
    <div class="controls">
      <span class="who" id="whoami"></span>
      <div class="seg" id="langseg" role="group" aria-label="Language">
        <button data-l="en" aria-pressed="true">EN</button>
        <button data-l="vi" aria-pressed="false">Tiếng Việt</button>
        <button data-l="zh" aria-pressed="false">中文</button>
      </div>
    </div>
  </header>
  <div class="clinics months" id="monthbar" role="group" aria-label="Month"></div>
  <div class="clinics" id="clinicbar" role="group" aria-label="Clinic"></div>
  <div class="scopebar" id="scopebar"></div>
  <div id="app"></div>
</div>

  function utf8(str){
    var out="",i,c;
    for(i=0;i<str.length;i++){ c=str.charCodeAt(i);

  function sha256sync(ascii){
    function rr(v,a){ return (v>>>a)|(v<<(32-a)); }

    var hash=sha256sync.h, k=sha256sync.k;
    if(!hash){

    }
    ascii+="\x80";
    while(ascii.length%64-56) ascii+="\x00";
    for(i=0;i<ascii.length;i++){ j=ascii.charCodeAt(i); if(j>>8) return null;
      words[i>>2]|=j<<((3-i)%4)*8; }

    for(j=0;j<words.length;){

      for(i=0;i<64;i++){

        var t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^((~e)&h[6]))+k[i]
          +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]
            +(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
        var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));
        h=[(t1+t2)|0].concat(h); h[4]=(h[4]+t1)|0; h.length=8;

    if(window.crypto && crypto.subtle && window.isSecureContext){

        }).catch(function(){ return sha256sync(utf8(txt)); });

    var t=T(), btn=document.getElementById("gateBtn"), err=document.getElementById("gateErr");
    var pass=document.getElementById("gp").value;
    btn.disabled=true; btn.textContent=t.signingin; err.classList.remove("on");
    sha256(pass).then(function(hh){
      btn.disabled=false; btn.textContent=t.signin;
      if(hh !== PW_HASH){
        err.textContent=t.badlogin; err.classList.add("on");
        var gp=document.getElementById("gp"); gp.value=""; gp.focus();
        return;
      }
      saveSession(); enterApp();
    }).catch(function(){
      btn.disabled=false; btn.textContent=t.signin;
      err.textContent=t.badlogin; err.classList.add("on");
    });
  });

  document.getElementById("langseg").querySelectorAll("button").forEach(function(b){
    b.onclick=function(){
      lang=b.dataset.l;
      document.getElementById("langseg").querySelectorAll("button").forEach(function(x){
        x.setAttribute("aria-pressed", String(x===b)); });
      applyGateLang();
      if(session){ buildMonthBar(); buildClinicBar(); render(); }
    };
  });

  applyGateLang();
  if(loadSession()) enterApp();
  else document.getElementById("gp").focus();
})();
</script>
