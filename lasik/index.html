<title>Lasik SOP Compliance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">

<style>
  :root{
    --ground:#FBFAF8; --surface:#FFFFFF; --surface-2:#F3F2EE; --surface-3:#E7E5DF;
    --ink:#14151C; --ink-2:#3B3E4C; --muted:#6A6F80;
    --rule:#DEDCD6; --rule-2:#EAE8E3;
    --accent:#2438B8; --accent-soft:#E7E9F8;
    --mark:#E6EE6B; --mark-ink:#2B2C0E;
    --ok:#17795E; --ok-soft:#E2F0EA;
    --warn:#A6690A; --warn-soft:#F7EEDC; --warn-mid:#EFDCBB;
    --bad:#AE2E48; --bad-soft:#F8E6EA;
    --inert:#5A6072; --inert-soft:#EBECEF;
    --shadow:0 1px 2px rgba(20,21,28,.05), 0 8px 24px -18px rgba(20,21,28,.25);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0E0F14; --surface:#171922; --surface-2:#1E2029; --surface-3:#2A2D39;
      --ink:#E9EAF0; --ink-2:#BFC3D0; --muted:#8D93A5;
      --rule:#2B2E3A; --rule-2:#23262F;
      --accent:#8D99F7; --accent-soft:#1D2140;
      --mark:#C6CE55; --mark-ink:#14150A;
      --ok:#5FC7A4; --ok-soft:#12291F;
      --warn:#E0A83F; --warn-soft:#2C2211; --warn-mid:#453317;
      --bad:#F0819A; --bad-soft:#2E141B;
      --inert:#98A0B4; --inert-soft:#1F2129;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.85);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0E0F14; --surface:#171922; --surface-2:#1E2029; --surface-3:#2A2D39;
    --ink:#E9EAF0; --ink-2:#BFC3D0; --muted:#8D93A5;
    --rule:#2B2E3A; --rule-2:#23262F;
    --accent:#8D99F7; --accent-soft:#1D2140;
    --mark:#C6CE55; --mark-ink:#14150A;
    --ok:#5FC7A4; --ok-soft:#12291F;
    --warn:#E0A83F; --warn-soft:#2C2211; --warn-mid:#453317;
    --bad:#F0819A; --bad-soft:#2E141B;
    --inert:#98A0B4; --inert-soft:#1F2129;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.85);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body.lang-zh{font-family:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
  .wrap{max-width:1400px;margin:0 auto;padding:0 24px 90px}

  #gate{position:fixed;inset:0;z-index:100;background:var(--ground);
    display:flex;align-items:center;justify-content:center;padding:24px}
  #gate.gone{display:none}
  .gatecard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--rule);
    border-radius:6px;box-shadow:var(--shadow);padding:34px 32px}
  .gatecard .brand{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:14px}
  .gatecard h2{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:1.42rem;
    letter-spacing:-.015em;margin:0 0 7px;line-height:1.2}
  .gatecard .lede{font-size:.88rem;color:var(--muted);margin:0 0 24px}
  .field{margin-bottom:15px}
  .field label{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
    letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
  .field input{width:100%;padding:10px 12px;font-family:inherit;font-size:.92rem;
    background:var(--ground);color:var(--ink);border:1px solid var(--rule);border-radius:4px}
  .gatebtn{width:100%;padding:11px;background:var(--accent);color:var(--surface);border:0;
    border-radius:4px;font-weight:600;font-size:.92rem;margin-top:6px}
  .gatebtn:disabled{opacity:.55;cursor:default}
  .gateerr{background:var(--bad-soft);color:var(--bad);border-radius:4px;padding:9px 12px;
    font-size:.84rem;margin-bottom:15px;display:none}
  .gateerr.on{display:block}
  .who{display:flex;align-items:center;gap:9px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted)}
  .who button{background:none;border:1px solid var(--rule);border-radius:4px;padding:4px 10px;
    color:var(--muted);font-size:10.5px;font-family:inherit}
  .who button:hover{color:var(--ink);border-color:var(--muted)}

  header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;padding:32px 0 14px}
  .titleblock h1{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:1.7rem;letter-spacing:-.015em;margin:0 0 5px}
  .titleblock .sub{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .seg{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--surface)}
  .seg button{background:none;border:0;padding:7px 12px;color:var(--muted);font-size:12.5px;font-weight:500;border-right:1px solid var(--rule)}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}

  .filters{display:grid;gap:6px;margin:8px 0 4px}
  .frow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .frow > .flab{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);min-width:58px}
  .frow button{background:var(--surface);border:1px solid var(--rule);border-radius:20px;
    padding:5px 13px;font-size:.83rem;color:var(--ink-2);display:flex;align-items:center;gap:7px}
  .frow button .cn{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;color:var(--accent)}
  .frow button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
  .frow button[aria-pressed="true"] .cn{color:var(--surface)}
  .frow button[disabled]{opacity:.32;cursor:default}
  .frow.sub{padding-left:0}
  .frow.sub button{border-style:dashed}
  .frow.sub button[aria-pressed="true"]{border-style:solid}
  .mtdtag{font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.08em;
    background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:3px;font-weight:600}
  .frow button[aria-pressed="true"] .mtdtag{background:rgba(255,255,255,.22);color:var(--surface)}
  .scopebar{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);margin:10px 0 20px}
  .scopebar b{color:var(--accent);font-weight:600}

  .herorow{display:grid;grid-template-columns:1fr 320px;gap:16px;margin-bottom:18px;align-items:stretch}
  @media (max-width:980px){.herorow{grid-template-columns:1fr}}
  .hero{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--accent);
    border-radius:4px;box-shadow:var(--shadow);padding:24px 28px}
  .heroTop{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center}
  @media (max-width:700px){.heroTop{grid-template-columns:1fr;gap:16px}}
  .bignum{font-size:4rem;font-weight:600;letter-spacing:-.045em;line-height:.9;font-variant-numeric:tabular-nums}
  .biglab{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--muted);margin-top:10px}
  .sideline{font-size:.96rem;color:var(--ink-2);margin:0 0 14px;max-width:60ch}
  .sideline b{color:var(--ink);font-weight:600}
  .gauge{position:relative;height:30px;background:var(--surface-3);border-radius:3px;overflow:visible;margin-bottom:9px}
  .gfill{height:100%;border-radius:3px}
  .gtarget{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);opacity:.75}
  .gtlab{position:absolute;top:-19px;transform:translateX(-50%);font-family:"IBM Plex Mono",monospace;
    font-size:9.5px;letter-spacing:.08em;color:var(--ink-2);white-space:nowrap}
  .glegend{display:flex;gap:18px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
  .glegend b{font-family:"IBM Plex Mono",monospace;color:var(--ink)}

  .flagcard{background:var(--warn-soft);border:1px solid var(--warn);border-left:4px solid var(--warn);
    border-radius:4px;box-shadow:var(--shadow);padding:20px 22px;display:flex;flex-direction:column;
    gap:11px;min-width:0;overflow-wrap:anywhere}
  .flagcard .fnum{font-size:2.5rem;font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--warn);font-variant-numeric:tabular-nums}
  .flagcard .flab{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--warn);font-weight:600}
  .flagcard p{margin:0;font-size:.83rem;color:var(--ink-2)}
  .flist{display:flex;flex-direction:column;min-width:0}
  .flist .fr{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;
    gap:2px 12px;font-size:.81rem;padding:6px 0;border-bottom:1px solid var(--warn-mid);min-width:0}
  .flist .fr:last-child{border-bottom:0}
  .flist .fr > span:first-child{flex:1 1 auto;min-width:0}
  .flist .fv{font-family:"IBM Plex Mono",monospace;font-weight:600;white-space:normal;
    overflow-wrap:anywhere;text-align:right;max-width:100%;line-height:1.45}

  .panel{background:var(--surface);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);margin-bottom:18px}
  .panel > h3{margin:0;padding:14px 20px;border-bottom:1px solid var(--rule-2);font-size:.92rem;font-weight:600;
    display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
  .panel > h3 .hint{font-weight:400;font-size:.79rem;color:var(--muted)}
  .pad{padding:18px 20px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  .grid2 > *,.herorow > *{min-width:0}
  @media (max-width:980px){.grid2{grid-template-columns:1fr}}

  .tp{border-bottom:1px solid var(--rule-2);padding:14px 20px}
  .tp:last-child{border-bottom:0}
  .tphead{display:grid;grid-template-columns:120px 1fr 152px;gap:14px;align-items:center}
  @media (max-width:640px){.tphead{grid-template-columns:80px 1fr 96px;gap:9px}}
  .tpname{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.86rem}
  .tpname .ph{display:block;font-family:"IBM Plex Sans",sans-serif;font-weight:400;
    font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .tptrack{height:24px;background:var(--surface-3);border-radius:3px;overflow:hidden;display:flex}
  .tpseg{height:100%}
  .tpnums{font-family:"IBM Plex Mono",monospace;font-size:.82rem;text-align:right;font-variant-numeric:tabular-nums}
  .cps{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0 134px}
  @media (max-width:640px){.cps{margin-left:0}}
  .cp{font-size:.78rem;display:flex;align-items:center;gap:6px;background:var(--surface-2);
    border:1px solid var(--rule-2);border-radius:3px;padding:3px 9px}
  .cp .pcv{font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums}
  .cp.vip{border-color:var(--accent);background:var(--accent-soft)}
  .cp.ref{border-color:var(--ok);background:var(--ok-soft)}
  .tag{font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}

  .tblwrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:.875rem}
  th,td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--rule-2)}
  thead th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap;border-bottom:1px solid var(--rule)}
  thead th.sortable{cursor:pointer;user-select:none}
  thead th.sortable:hover{color:var(--ink)}
  thead th .arrow{opacity:.55;font-size:9px}
  tbody tr:last-child td{border-bottom:0}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  td.n{font-family:"IBM Plex Mono",monospace}
  tbody tr.tot td{background:var(--surface-2);font-weight:600;border-top:1px solid var(--rule)}
  tbody tr.click{cursor:pointer}
  tbody tr.click:hover{background:var(--surface-2)}
  tbody tr.sel{background:var(--accent-soft)}
  .barw{position:relative;height:8px;background:var(--surface-3);border-radius:2px;min-width:70px}
  .barf{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
  .bart{position:absolute;top:-2px;bottom:-2px;width:1.5px;background:var(--ink);opacity:.55}
  .stack{display:flex;height:9px;border-radius:2px;overflow:hidden;background:var(--surface-3);min-width:80px}
  .stack span{display:block;height:100%}
  .legend3{display:flex;gap:18px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--rule-2);
    font-size:.8rem;color:var(--muted)}
  .legend3 span{display:flex;align-items:center;gap:7px}
  .legend3 i{width:10px;height:10px;border-radius:2px;display:inline-block}

  .pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.05em;
    padding:2px 7px;border-radius:3px;font-weight:600;white-space:nowrap}
  .p-ok{background:var(--ok-soft);color:var(--ok)}
  .p-bad{background:var(--bad-soft);color:var(--bad)}
  .p-warn{background:var(--warn-soft);color:var(--warn)}
  .p-inert{background:var(--inert-soft);color:var(--inert)}
  .p-accent{background:var(--accent-soft);color:var(--accent)}
  .lowN{color:var(--muted);font-style:normal}

  .mtdgrid{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
  @media (max-width:540px){.mtdgrid{grid-template-columns:1fr;gap:16px}}
  .mtdnum{font-size:3rem;font-weight:600;letter-spacing:-.04em;line-height:.95;color:var(--accent);font-variant-numeric:tabular-nums}
  .mtdlab{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}
  .mtdrow{display:flex;justify-content:space-between;gap:14px;font-size:.85rem;padding:6px 0;border-bottom:1px solid var(--rule-2)}
  .mtdrow:last-child{border-bottom:0}
  .mtdrow b{font-family:"IBM Plex Mono",monospace}
  .mtdnote{margin:14px 0 0;font-size:.8rem;color:var(--muted);line-height:1.5}

  .mtrend{display:flex;align-items:flex-end;gap:9px;height:158px;position:relative;overflow-x:auto}
  .mcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:30px;justify-content:flex-end}
  .mbar{width:100%;max-width:46px;border-radius:2px 2px 0 0}
  .mval{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600}
  .mlab{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--muted);white-space:nowrap}
  .mn{font-family:"IBM Plex Mono",monospace;font-size:8.5px;color:var(--muted);opacity:.75}
  .tline{position:absolute;left:0;right:0;border-top:1px dashed var(--ink);opacity:.4}
  .tlineLab{position:absolute;right:0;font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--muted);transform:translateY(-14px)}

  .rulebox{display:grid;gap:9px}
  .rulerow{display:grid;grid-template-columns:26px 1fr auto;gap:11px;align-items:baseline;font-size:.86rem}
  .rulerow .tick{font-family:"IBM Plex Mono",monospace;font-weight:600}
  .rulerow .rn{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600}
  .rulereq{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted)}

  /* worklist */
  .wlbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:13px 20px;border-bottom:1px solid var(--rule-2);background:var(--surface-2)}
  .wlbar input[type=text],.wlbar select,.wlbar input[type=number]{
    font-family:inherit;font-size:.83rem;padding:5px 9px;background:var(--surface);
    color:var(--ink);border:1px solid var(--rule);border-radius:4px}
  .wlbar input[type=text]{min-width:150px}
  .wlbar input[type=number]{width:78px}
  .wlbar label{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
  .wltoggle{display:flex;align-items:center;gap:7px;font-size:.83rem;color:var(--ink-2)}
  .wlclear{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:5px 12px;font-size:.83rem;color:var(--ink-2)}
  .wlclear:hover{border-color:var(--muted);color:var(--ink)}
  .wlcount{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
  .wlpager{display:flex;gap:9px;align-items:center;justify-content:center;padding:13px 20px;border-top:1px solid var(--rule-2)}
  .wlpager button{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:5px 12px;font-size:.83rem;color:var(--ink-2)}
  .wlpager button[disabled]{opacity:.35;cursor:default}
  .wlpager .pinfo{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
  td.det{font-size:.82rem;color:var(--ink-2);max-width:280px}
  .empty{padding:34px 20px;text-align:center;color:var(--muted)}

  .decay{display:flex;align-items:flex-end;gap:10px;height:140px}
  .dcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;justify-content:flex-end}
  .dbar{width:100%;max-width:54px;border-radius:2px 2px 0 0}
  .dval{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600}
  .dlab{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--muted);white-space:nowrap}
  .tpseg{display:flex;align-items:center;justify-content:center;overflow:hidden}
  .tpseg span{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
    color:#fff;opacity:.95;white-space:nowrap}
  :root[data-theme="dark"] .tpseg span,
  :root:not([data-theme="light"]) .tpseg span{color:var(--ground)}
  .probstate{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;
    background:var(--accent-soft);border:1px solid var(--accent);border-radius:4px;
    padding:14px 20px;margin-bottom:18px}
  .probstate .pslab{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--accent);font-weight:600;white-space:nowrap}
  .probstate .pstext{font-size:.95rem;color:var(--ink)}
  .hidden{display:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media (max-width:640px){
    .wrap{padding:0 16px 60px}
    .titleblock h1{font-size:1.3rem}
    .bignum{font-size:3.1rem}
  }

  .feed{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .feed i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
  .feed.live{color:var(--ok)} .feed.live i{background:var(--ok)}
  .feed.loading i{background:var(--warn)}
  .feed.stale{color:var(--warn)} .feed.stale i{background:var(--warn)}
  .feed.failed{color:var(--bad)} .feed.failed i{background:var(--bad)}

  .bigof{font-size:1.3rem;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:3px}
  .gseg{position:absolute;top:0;bottom:0;border-radius:3px}
  .glegend .sw{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:-1px}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule-2)}
  @media (max-width:700px){.kpis{grid-template-columns:1fr 1fr}}
  .kpi .kv{font-family:"IBM Plex Mono",monospace;font-size:1.3rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
  .kpi .kv small{font-size:.72rem;font-weight:500;color:var(--muted);letter-spacing:0}
  .kpi .kl{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-top:4px}
  .kpi .kl small{font-size:9px;letter-spacing:0;text-transform:none}

  /* ---------------- selection ---------------- */
  /* Every cadence touching the selected period, for every case in scope:
     kind "due" once its window has closed, "open" while it is still running.
     Scores are built from the due instances of scoreable cases; filter

  function activity(over){

      if(c[3] === "nozalo") return;                 /* no Zalo: nothing can be sent */
      if(!scored(c) && !inJourney(c)) return;
      if(o.clinic!=="all" && c[0]!==o.clinic) return;
      if(o.da!=="all" && daKey(c)!==o.da) return;
      var age = ageOf(c), cur = TODAY.slice(0,7);
      for(var i=0;i<TOUCH.length;i++){

        var d = dueDate(c,i), open = age <= lastDay(i);

        if(o.month!=="all" && (open ? o.month!==cur : d.slice(0,7)!==o.month)) continue;
        if(o.week!=="all" && mondayOf(d)!==o.week) continue;

  function instances(over){

  function casesOf(list){

    return out;

  /* m: the month whose quality rating applies to every instance (a single

  function agg(inst, m){
    var pts=0, ptsR=0, nR=0, q=0;
    inst.forEach(function(p){
      var v = cadencePoints(p[0], p[1]); pts += v;
      var r = qPtsInst(p, m);
      if(r !== null){ q += r; ptsR += v; nR++; }
    });
    var cs = casesOf(inst), pass=0, rated=0;
    cs.forEach(function(c){ var tt = caseTotal(c, m || qMonthCase(c)); if(tt){ rated++; if(tt.total >= PASS) pass++; } });

  function MONTHS(){
    var s={}, o=[], cur = TODAY.slice(0,7);

  /* ---------------- worklist ---------------- */

  /* ---------------- ratings: storage ---------------- */
  function loadLocalRatings(){
    try{
      var j = JSON.parse(localStorage.getItem("lasik_qa_ratings") || "{}");
      Object.keys(j).forEach(function(k){ RATINGS[k] = j[k]; });
      qaBy = localStorage.getItem("lasik_qa_by") || qaBy;
    }catch(e){}
  }
  function persistLocal(){

  }
  /* Ratings shipped with the payload (the QA's scores for past months) are
     the base layer: anything saved in this browser or brought by a link
     sits on top of them. */
  function loadEmbeddedRatings(){
    (DATA.ratings || []).forEach(function(r){
      if(!(r instanceof Array) || r.length < 4) return;
      RATINGS[rKey(r[0], r[1], r[2])] = {clinic:String(r[0]), da:String(r[1]), month:String(r[2]), band:+r[3],
        remarks:String(r[4]||""), by:String(r[5]||""), at:String(r[6]||""), sync:true};
    });

  /* ---------------- ratings: share by link ----------------

  var qaImported = 0, qaCopied = false;

      list.forEach(function(r){
        if(!(r instanceof Array) || r.length < 4 || !(r[3] >= 1 && r[3] <= 4)) return;
        var rec = {clinic:String(r[0]), da:String(r[1]), month:String(r[2]), band:+r[3],
                   remarks:String(r[4]||""), by:String(r[5]||""), at:String(r[6]||""), sync:false};
        var k = rKey(rec.clinic, rec.da, rec.month), cur = RATINGS[k];
        if(cur && cur.at >= rec.at) return;

    return fetch(url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},

      .then(function(res){ if(!res.ok) throw new Error("HTTP " + res.status); return res.json(); })

  /* ---------------- live feed ---------------- */
  function loadLive(){
    var url = feedUrl();

    return fetch(u).then(function(res){ if(!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
      .then(function(j){
        if(j.error) throw new Error(j.error);
        /* The deployment answered, but with the optometry feed: the version

        if(j.cases && j.cases.length){

          if(j.touch && j.touch.length === TOUCH.length) TOUCH = j.touch;

  /* ---------------- crypto ---------------- */
  function utf8(str){var o="",i,c;for(i=0;i<str.length;i++){c=str.charCodeAt(i);
    if(c<128)o+=String.fromCharCode(c);else if(c<2048)o+=String.fromCharCode(192|c>>6,128|c&63);
    else o+=String.fromCharCode(224|c>>12,128|c>>6&63,128|c&63);}return o;}
  function sha256sync(a){function rr(v,x){return(v>>>x)|(v<<(32-x));}
    var K=[],H=[],i,j,mp=[],mc=[],p=2;
    for(i=0;i<64;p++){for(j=2;j*j<=p;j++)if(p%j===0)break;if(j*j<=p)continue;
      H[i]=(Math.pow(p,.5)*4294967296)|0;K[i++]=(Math.pow(p,1/3)*4294967296)|0;}
    a=utf8(a);var l=a.length*8;a+="\x80";while(a.length%64-56)a+="\x00";
    for(i=0;i<a.length;i++){j=a.charCodeAt(i);mp[i>>2]|=j<<((3-i)%4)*8;}
    mp[mp.length]=(l/4294967296)|0;mp[mp.length]=l;
    for(j=0;j<mp.length;){var w=mp.slice(j,j+=16),o=H;H=H.slice(0,8);
      for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],A=H[0],E=H[4],
        t1=H[7]+(rr(E,6)^rr(E,11)^rr(E,25))+((E&H[5])^((~E)&H[6]))+K[i]+
        (w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0),
        t2=(rr(A,2)^rr(A,13)^rr(A,22))+((A&H[1])^(A&H[2])^(H[1]&H[2]));
        H=[(t1+t2)|0].concat(H);H[4]=(H[4]+t1)|0;}
      for(i=0;i<8;i++)H[i]=(H[i]+o[i])|0;}
    var s="";for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(H[i]>>(j*8))&255;s+=((b>>4).toString(16))+((b&15).toString(16));}
    return s;}
  function sha256(t){if(window.crypto&&crypto.subtle&&window.isSecureContext){try{
      return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){
        return Array.prototype.map.call(new Uint8Array(b),function(x){return("00"+x.toString(16)).slice(-2);}).join("");});
    }catch(e){}}
    return new Promise(function(res){res(sha256sync(t));});}

  /* ---------------- filters ---------------- */
  function bar(id, items, active, onPick){
    var el = document.getElementById(id), h = "";
    items.forEach(function(it){
      h += '<button data-k="'+esc(it.k)+'" aria-pressed="'+(active===it.k)+'"'
        + (it.n===0 && it.k!==active && !it.keep ? " disabled" : "") + '>' + it.label
        + (it.n===null ? "" : ' <span class="cn">'+it.n+'</span>') + '</button>';
    });
    el.innerHTML = h;
    el.querySelectorAll("button").forEach(function(b){
      b.onclick = function(){ onPick(b.dataset.k); };
    });
  }
  function nCases(over){ return casesOf(activity(over)).length; }
  function buildFilters(){
    var t = T();

    /* The live month is always listed even when empty, and always carries the
       MTD tag, so a partial month is never silently compared with a full one. */
    var cur = TODAY.slice(0,7), mlist = MONTHS();
    if(mlist.indexOf(cur) === -1) mlist = mlist.concat([cur]).sort();
    mlist = mlist.slice(-12);          /* older months stay reachable under All months */
    bar("monthbar",
      [{k:"all", label:esc(t.allm), n:nCases({month:"all",week:"all"})}]
        .concat(mlist.map(function(m){
          return {k:m, keep:(m===cur), n:nCases({month:m,week:"all"}),
                  label:esc(monthLabel(m)) + (m===cur
                    ? ' <span class="mtdtag">'+esc(t.mtd)+'</span>' : "")};
        })),
      month,
      function(k){ month = k; week = "all"; wl.page = 0; buildFilters(); render(); });

    var wEl = document.getElementById("weekbar");
    if(month === "all"){ wEl.innerHTML = ""; }
    else {
      bar("weekbar",
        [{k:"all", label:esc(t.allw), n:nCases({week:"all"})}]
          .concat(WEEKS(month).map(function(w){
            return {k:w, label:esc(weekLabel(w)), n:nCases({week:w})};
          })),
        week,
        function(k){ week = k; wl.page = 0; buildFilters(); render(); });
    }

    var clinics = {}; CASES.forEach(function(c){ clinics[c[0]] = 1; });
    bar("clinicbar",
      [{k:"all", label:esc(t.allc), n:nCases({clinic:"all",da:"all"})}]
        .concat(Object.keys(clinics).sort().map(function(cl){
          return {k:cl, label:esc(cl), n:nCases({clinic:cl,da:"all"})};
        })),
      clinic,
      function(k){ clinic = k; da = "all"; wl.page = 0; buildFilters(); render(); });

    var dEl = document.getElementById("dabar");
    if(clinic === "all"){ dEl.innerHTML = ""; }
    else {
      var das = {};
      CASES.forEach(function(c){ if(c[0]===clinic) das[daKey(c)] = 1; });
      bar("dabar",
        [{k:"all", label:esc(t.alld), n:nCases({da:"all"})}]
          .concat(Object.keys(das).sort().map(function(k){
            return {k:k, label:esc(daName(k)), n:nCases({da:k})};
          })),
        da,
        function(k){ da = k; wl.page = 0; buildFilters(); render(); });
    }
  }
  function scopeText(){
    var t = T(), bits = [];
    bits.push(clinic === "all" ? esc(t.allc) : '<b>'+esc(clinic)+'</b>');
    if(da !== "all") bits.push('<b>'+esc(daName(da))+'</b>');
    bits.push(month === "all" ? esc(t.allmLong)
      : '<b>'+esc(monthLabel(month))+'</b> '+esc(t.dueWord2));
    if(week !== "all") bits.push('<b>'+esc(weekLabel(week))+'</b>');
    return esc(t.viewing) + " " + bits.join(" &middot; ");

  /* ================= main render ================= */
  function scoreCell(v, n, colour){

  }
  var Q_COVER = 50;   /* % of cadences that must carry a rating before a total is shown */
  function hasTotal(a){ return a.total !== null && a.qCov >= Q_COVER; }
  function totalCell(a){
    if(a.n < MIN_N) return '<span class="lowN">—</span>';
    if(!hasTotal(a)) return '<span class="lowN" title="'+esc(T().qaNotRated)+'">—</span>';
    return '<span style="color:'+totalColour(a.total)+';font-weight:600">'+Math.round(a.total)+'</span>';
  }
  function qCell(a){
    if(a.q === null) return '<span class="lowN">—</span>';
    return a.q + '<span style="color:var(--muted)">/30</span>';
  }
  function trackCell(a){
    if(!a.rated) return '<span class="lowN">—</span>';
    if(a.rated < MIN_N) return '<span class="lowN">'+a.pass+'/'+a.rated+'</span>';
    return pct(a.pass, a.rated)+'%';
  }

    var sc = casesOf(inst), a = agg(inst), h = "";
    var allActive = casesOf(act).length;
    var pend = casesOf(act.filter(function(p){ return pending(p[0]); }));

        + esc(t.noCases)+'</div><div>'+esc(t.noCasesHint)+'</div></div></div>';

    }

    if(!inst.length){

        + esc(t.notScored)+'</div><div>'+esc(t.notScoredHint)+'</div></div></div>';
      h += pendingNote(pend);
      h += renderWorklist(act);
      h += renderQa(act);

    /* hero: the 100-point total, or the 70-point follow-up score while the

    var showTotal = hasTotal(a), qCov = a.qCov > 0 && a.qCov < 1 ? "<1" : Math.round(a.qCov);
    var qNote = a.q === null ? t.notRated : fmt(t.qCovNote, {p:qCov});
    var big = showTotal
      ? '<div class="bignum" style="color:'+(a.n<MIN_N?'var(--muted)':totalColour(a.total))+'">'

        + '<div class="biglab">'+esc(t.sopScore)+'</div>'

      + '<div class="kpi"><div class="kv">'+(!a.rated ? '—' : a.rated < MIN_N ? a.pass+'<small>/'+a.rated+'</small>' : pct(a.pass,a.rated)+'<small>%</small>')+'</div><div class="kl">'+esc(t.kPass)

    /* cadence breakdown, shared by several panels */

      byCad[ti].forEach(function(c){

      return {label:tp[0], idx:ti, due:due, full:full, part:part, miss:miss,

    /* MTD + by month */

    h += '<div class="legend3">'
      + '<span><i style="background:var(--ok)"></i>'+esc(t.thFull)+'</span>'
      + '<span><i style="background:var(--warn)"></i>'+esc(t.thPartial)+'</span>'
      + '<span><i style="background:var(--bad)"></i>'+esc(t.thMissed)+'</span></div></div>';

    /* ---------- worklist ---------- */
    h += renderWorklist(act);

    /* ---------- response quality ---------- */
    h += renderQa(act);

    /* ---------- content KPIs + by clinic ---------- */
    h += '<div class="grid2">';

    var groups = {care:[0,0], vip:[0,0], ref:[0,0]};
    inst.forEach(function(p){
      var defs = TOUCH[p[1]][1];
      for(var i=0;i<defs.length;i++){
        var g = groups[defs[i][1]]; if(!g) continue;
        g[1]++; if(cpAt(p[0], p[1], i)) g[0]++;
      }
    });
    var past90 = sc.filter(function(c){ return isDue(c, TOUCH.length-1); });
    var full7 = past90.filter(function(c){
      for(var i=0;i<TOUCH.length;i++) if(cadencePoints(c,i) < 1) return false; return true; });
    h += '<div class="panel" style="margin:0"><h3><span>'+esc(t.pContent)+'</span>'
      + '<span class="hint">'+esc(t.pContentH)+'</span></h3><div class="pad"><div class="rulebox">';
    [["care",t.kCare],["vip",t.kVip],["ref",t.kRef]].forEach(function(row){
      var g = groups[row[0]], r = pct(g[0], g[1]);
      h += '<div class="crow"><span>'+esc(row[1])+'</span>'
        + '<div class="barw"><div class="barf" style="width:'+Math.max(r,1)+'%;background:'+scoreColour(r)+'"></div>'
        + '<div class="bart" style="left:'+TARGET+'%"></div></div>'
        + '<span class="rn" style="color:'+(g[1]<MIN_N?'var(--muted)':scoreColour(r))+'">'
        + (g[1]<MIN_N ? '—' : r+'%')+'</span></div>';
    });
    var fr = pct(full7.length, past90.length);
    h += '<div class="crow" style="border-top:1px solid var(--rule);padding-top:10px;margin-top:3px">'
      + '<span>'+esc(t.kFull)+' <span class="rulereq">'+esc(t.kFullH)+' · '+past90.length+'</span></span>'
      + '<div class="barw"><div class="barf" style="width:'+Math.max(fr,1)+'%;background:'+(past90.length?scoreColour(fr):'var(--surface-3)')+'"></div></div>'
      + '<span class="rn" style="color:'+(past90.length<MIN_N?'var(--muted)':scoreColour(fr))+'">'
      + (past90.length<MIN_N ? '— ('+full7.length+')' : fr+'%')+'</span></div>';
    h += '</div></div></div>';

    /* by clinic */
    var byC = {};
    inst.forEach(function(p){ (byC[p[0][0]] = byC[p[0][0]] || []).push(p); });
    var crows = Object.keys(byC).map(function(k){ var g = agg(byC[k]); g.k = k; return g; })
      .sort(function(x,y){ return y.score - x.score; });
    h += '<div class="panel" style="margin:0"><h3><span>'+esc(t.pClinic)+'</span>'
      + '<span class="hint">'+esc(t.pClinicH)+'</span></h3><div class="tblwrap"><table><thead><tr>'
      + '<th>'+esc(t.thClinic)+'</th><th class="n">'+esc(t.thScore)+'</th>'
      + '<th style="width:24%"></th><th class="n">'+esc(t.thQ)+'</th><th class="n">'+esc(t.thTotal)+'</th>'
      + '<th class="n">'+esc(t.thTrack)+'</th><th class="n">'+esc(t.thCases)+'</th></tr></thead><tbody>';
    var med = (function(v){ v=v.slice().sort(function(p,q){return p-q;});
      return v.length ? v[Math.floor(v.length/2)] : 0; })(crows.map(function(x){return x.score;}));
    crows.forEach(function(r){
      var outlier = r.n>=MIN_N && (med - r.score) >= 20;
      h += '<tr class="click'+(clinic===r.k?' sel':'')+'" data-clinic="'+esc(r.k)+'">'
        + '<td><b>'+esc(r.k)+'</b>'+(outlier?' <span class="pill p-bad">'+esc(t.outlier)+'</span>':'')+'</td>'
        + '<td class="n">'+scoreCell(r.score, r.n, scoreColour)+'</td>'
        + '<td><div class="barw"><div class="barf" style="width:'+Math.max(r.score,1)+'%;background:'
        + scoreColour(r.score)+'"></div><div class="bart" style="left:'+TARGET+'%"></div></div></td>'
        + '<td class="n">'+qCell(r)+'</td><td class="n">'+totalCell(r)+'</td>'
        + '<td class="n">'+trackCell(r)+'</td><td class="n">'+r.n+'</td></tr>';
    });
    h += '<tr class="tot"><td>'+esc(t.thTot)+'</td><td class="n">'+a.score+'%</td><td></td>'
      + '<td class="n">'+qCell(a)+'</td><td class="n">'+totalCell(a)+'</td>'
      + '<td class="n">'+trackCell(a)+'</td><td class="n">'+a.n+'</td></tr></tbody></table></div></div></div>';

    /* by DA - keyed on clinic + name, because names repeat across clinics */
    var byD = {};
    inst.forEach(function(p){ var k=daKey(p[0]); (byD[k] = byD[k] || []).push(p); });
    var drows = Object.keys(byD).map(function(k){ var g = agg(byD[k]);
      g.k = k; g.name = daName(k); g.clinic = daClinic(k);
      g.band = month !== "all" ? rating(g.clinic, g.name, month) : null; return g; })
      .sort(function(x,y){ return y.score - x.score || y.n - x.n; });
    h += '<div class="panel"><h3><span>'+esc(t.pReps)+'</span><span class="hint">'+esc(t.pRepsH)+'</span></h3>'
      + '<div class="tblwrap"><table><thead><tr><th>'+esc(t.thRep)+'</th><th>'+esc(t.thClinic)+'</th>'
      + '<th class="n">'+esc(t.thScore)+'</th><th style="width:20%"></th>'
      + '<th class="n">'+esc(t.thQ)+'</th><th class="n">'+esc(t.thTotal)+'</th>'
      + '<th class="n">'+esc(t.thTrack)+'</th><th class="n">'+esc(t.thCases)+'</th></tr></thead><tbody>';
    drows.forEach(function(r){
      h += '<tr class="click'+(da===r.k?' sel':'')+'" data-da="'+esc(r.k)+'">'
        + '<td>'+esc(r.name)+'</td><td style="color:var(--muted)">'+esc(r.clinic)+'</td>'
        + '<td class="n">'+scoreCell(r.score, r.n, scoreColour)+'</td>'
        + '<td><div class="barw"><div class="barf" style="width:'+Math.max(r.score,1)+'%;background:'
        + scoreColour(r.score)+'"></div><div class="bart" style="left:'+TARGET+'%"></div></div></td>'
        + '<td class="n">'+(r.band ? '<span class="pill p-accent">'+esc(fmt(t.bandWord,{b:r.band.band}))+'</span> '+BAND_PTS[r.band.band]+'<span style="color:var(--muted)">/30</span>' : qCell(r))+'</td>'
        + '<td class="n">'+totalCell(r)+'</td>'
        + '<td class="n">'+trackCell(r)+'</td>'
        + '<td class="n">'+r.n+'</td></tr>';
    });
    h += '</tbody></table></div></div>';

    document.getElementById("app").innerHTML = h;
    wireApp();
    renderWho();
  }

  function pendingNote(pend){
    if(!pend.length) return "";
    var t = T(), cl = {}; pend.forEach(function(c){ cl[c[0]] = 1; });
    return '<div class="pendnote"><span class="pslab">'+esc(t.wlNoData)+'</span>'
      + '<span class="pstext">'+esc(fmt(t.pendingNote, {n:pend.length, clinics:Object.keys(cl).sort().join(", ")}))+'</span></div>';
  }

  /* ================= worklist ================= */
  function renderWorklist(act){
    var t = T();
    var all = buildWorklist(act);
    var rows = wlSort(wlFilter(all));
    var pages = Math.max(1, Math.ceil(rows.length / PAGE));
    if(wl.page >= pages) wl.page = pages - 1;
    var view = rows.slice(wl.page*PAGE, wl.page*PAGE + PAGE);

    var clinics = {}, das = {};
    all.forEach(function(r){ clinics[r.clinic]=1; das[r.daK]=r.da; });

    function opt(v, label, cur){
      return '<option value="'+esc(v)+'"'+(cur===v?' selected':'')+'>'+esc(label)+'</option>';
    }
    function sortable(key, label, cls){
      var on = wl.sort===key;
      return '<th class="sortable'+(cls?' '+cls:'')+'" data-sort="'+key+'">'+esc(label)
        + (on ? ' <span class="arrow">'+(wl.dir>0?'▲':'▼')+'</span>' : '')+'</th>';
    }

    var scopeNote = (month === "all")
      ? t.wlDueAll
      : fmt(t.wlDueIn, {m:monthLabel(month) + (week!=="all" ? ", "+weekLabel(week) : "")});
    var h = '<div class="panel"><h3><span>'+esc(t.pWork)+'</span>'
      + '<span class="hint">'+esc(scopeNote)+'</span></h3>';

    h += '<div class="wlbar">'
      + '<input type="text" id="wlq" placeholder="'+esc(t.wlSearch)+'" value="'+esc(wl.q)+'">'
      + '<select id="wlclinic">'+opt("", t.wlAllClinics, wl.clinic)
        + Object.keys(clinics).sort().map(function(k){ return opt(k,k,wl.clinic); }).join("")+'</select>'
      + '<select id="wlda">'+opt("", t.wlAllDA, wl.da)
        + Object.keys(das).sort().map(function(k){ return opt(k, daName(k)+" · "+daClinic(k), wl.da); }).join("")+'</select>'
      + '<select id="wlcad">'+opt("", t.wlAllCad, wl.cad)
        + TOUCH.map(function(tp){ return opt(tp[0], tp[0], wl.cad); }).join("")+'</select>'
      + '<select id="wlstatus">'+opt("", t.wlAllStatus, wl.status)
        + opt("open", t.wlOpen, wl.status) + opt("missed", t.wlMissed, wl.status)
        + opt("incomplete", t.wlIncomplete, wl.status) + opt("nodata", t.wlNoData, wl.status)+'</select>'
      + '<label>'+esc(t.wlOdFrom)+' <input type="number" id="wlmin" value="'+esc(wl.minOd)+'"></label>'
      + '<label>'+esc(t.wlOdTo)+' <input type="number" id="wlmax" value="'+esc(wl.maxOd)+'"></label>'
      + '<button class="wlclear" id="wlclear">'+esc(t.wlClear)+'</button>'
      + '<span class="wlcount">'+esc(fmt(t.wlShowing, {a:rows.length, b:all.length}))+'</span>'
      + '</div>';

    if(!rows.length){
      h += '<div class="empty">'+esc(t.wlEmpty)+'</div></div>';
      return h;
    }

    h += '<div class="tblwrap"><table><thead><tr>'
      + sortable("patient", t.thPatient) + sortable("clinic", t.thClinic)
      + sortable("da", t.thRep) + sortable("cad", t.thCadence)
      + sortable("status", t.thStatus)
      + '<th>'+esc(t.thDetails)+'</th>'
      + sortable("due", t.thDue) + sortable("od", t.thOverdue, "n")
      + '</tr></thead><tbody>';
    view.forEach(function(r){
      h += '<tr><td>'+custCell(r.c)+'</td><td>'+esc(r.clinic)+'</td>'
        + '<td>'+esc(r.da)+'</td><td class="num">'+esc(r.cad)+'</td>'
        + '<td>'+statusPill(r.status)+'</td>'
        + '<td class="det">'+esc(detailText(r))+'</td>'
        + '<td class="num">'+esc(r.due)+'</td>'
        + '<td class="n">'+odCell(r)+'</td></tr>';
    });
    h += '</tbody></table></div>';

    if(pages > 1){
      h += '<div class="wlpager">'
        + '<button id="wlprev"'+(wl.page===0?" disabled":"")+'>'+esc(t.prev)+'</button>'
        + '<span class="pinfo">'+esc(fmt(t.pageOf, {a:wl.page+1, b:pages}))+'</span>'
        + '<button id="wlnext"'+(wl.page>=pages-1?" disabled":"")+'>'+esc(t.next)+'</button></div>';
    }
    return h + '</div>';
  }

  /* ================= response quality ratings ================= */
  function inScopeRating(r){
    return (clinic === "all" || r.clinic === clinic) && (da === "all" || rKey(r.clinic, r.da, "") === rKey(daClinic(da), daName(da), ""));
  }
  function qaStatusCell(key){
    var t = T(), s = qaStatus[key], r = RATINGS[key], d = qaDraft[key];
    if(s === "saving") return '<span class="qastat">'+esc(t.qaSaving)+'</span>';
    if(s === "noband") return '<span class="qastat bad">'+esc(t.qaNoBand)+'</span>';
    if(d && (d.band || d.remarks !== undefined)) return '<span class="qastat warn">'+esc(t.qaUnsaved)+'</span>';
    if(!r) return '<span class="qastat">'+esc(t.qaNotRated)+'</span>';
    var when = esc(t.qaSaved)+' · '+esc(r.by||"")+' · '+esc(fmtWhen(r.at));
    if(s === "failed") return '<span class="qastat bad">'+when+'<br>'+esc(t.qaFailed)+'</span>';
    if(r.sync === false) return '<span class="qastat warn">'+when+'<br>'+esc(feedUrl() ? t.qaFailed : t.qaLocal)+'</span>';
    return '<span class="qastat ok">'+when+'</span>';
  }
  function renderQa(act, inGrid){
    var t = T();
    var h = '<div class="panel" id="qaPanel"'+(inGrid ? ' style="margin:0"' : '')+'><h3><span>'+esc(t.pQa)+'</span>'
      + '<span class="hint">'+esc(t.pQaH)+'</span></h3>';

    if(month === "all"){
      /* One row per DA, one column per month: the saved band, or "pending"
         where the QA has not scored that month yet. A click opens the month. */
      var ms = MONTHS().slice(-12), das = {}, had = {};
      act.forEach(function(p){
        var k = daKey(p[0]); das[k] = 1;
        if(p[2] === "due" && scored(p[0])) (had[k] = had[k] || {})[dueDate(p[0], p[1]).slice(0,7)] = 1;
      });
      Object.keys(RATINGS).forEach(function(k){ var r = RATINGS[k];
        if(inScopeRating(r)) das[rKey(r.clinic, r.da, "").slice(0,-1)] = 1; });
      var keys = Object.keys(das).sort();
      h += '<div class="qabar">' + shareBtn() + '<span class="hint">'+esc(t.qaMatrixH)+'</span></div>';
      if(!keys.length) h += '<div class="empty">'+esc(t.qaNone)+'</div>';
      else {
        h += '<div class="tblwrap"><table class="qamatrix"><thead><tr><th>'+esc(t.thRep)+'</th><th>'+esc(t.thClinic)+'</th>';
        ms.forEach(function(m){ h += '<th class="n"><button type="button" class="mlink" data-month="'+esc(m)+'">'+esc(monthLabel(m))+'</button></th>'; });
        h += '</tr></thead><tbody>';
        keys.forEach(function(k){
          var cl = daClinic(k), d = daName(k);
          h += '<tr><td>'+esc(d)+'</td><td style="color:var(--muted)">'+esc(cl)+'</td>';
          ms.forEach(function(m){
            var r = rating(cl, d, m), active = had[k] && had[k][m];
            var cell = r ? '<span class="pill p-accent">'+esc(fmt(t.bandWord,{b:r.band}))+'</span> <span class="num">'+BAND_PTS[r.band]+'</span>'
                     : active ? '<span class="pill p-warn">'+esc(t.qaPending)+'</span>' : '<span class="lowN">—</span>';
            h += '<td class="n"><button type="button" class="qcell" data-month="'+esc(m)+'" title="'
              + esc(r ? (r.remarks||"") + (r.by ? " — " + r.by + ", " + fmtWhen(r.at) : "") : active ? t.qaPendingScore : "")+'">'+cell+'</button></td>';
          });
          h += '</tr>';
        });
        h += '</tbody></table></div>';
      }
    } else {
      var das = {};
      act.forEach(function(p){ das[daKey(p[0])] = 1; });
      Object.keys(RATINGS).forEach(function(k){ var r = RATINGS[k];
        if(r.month === month && inScopeRating(r)) das[rKey(r.clinic, r.da, "").slice(0,-1)] = 1; });
      var keys = Object.keys(das).sort(), rated = keys.filter(function(k){ return !!rating(daClinic(k), daName(k), month); }).length;
      var done = keys.length && rated === keys.length;
      h += '<div class="qabar"><label>'+esc(t.qaBy)+' <input type="text" id="qaBy" value="'+esc(qaBy)+'"></label>'
        + shareBtn()
        + '<span class="qasum '+(done ? 'ok' : 'warn')+'">'+esc(done ? t.qaDone : t.qaPendingScore)+' · '+esc(fmt(t.qaRatedOf, {a:rated, b:keys.length}))+'</span>'
        + '<span class="hint">'+esc(monthLabel(month))+'</span></div>';
      h += '<div class="tblwrap"><table class="qatbl"><thead><tr><th>'+esc(t.thRep)+'</th><th>'+esc(t.thClinic)+'</th>'
        + '<th>'+esc(t.thBand)+'</th><th class="n">'+esc(t.thPoints)+'</th><th>'+esc(t.qaRemarks)+'</th><th></th><th></th></tr></thead><tbody>';
      Object.keys(das).sort().forEach(function(k){
        var cl = daClinic(k), d = daName(k), key = rKey(cl, d, month);
        var cur = RATINGS[key], dr = qaDraft[key] || {};
        var band = dr.band || (cur ? cur.band : 0);
        var rem = dr.remarks !== undefined ? dr.remarks : (cur ? cur.remarks : "");
        var dirty = !!(dr.band || dr.remarks !== undefined);
        h += '<tr data-qa="'+esc(key)+'"><td>'+esc(d)+'</td><td style="color:var(--muted)">'+esc(cl)+'</td>'
          + '<td><div class="bands">';
        [1,2,3,4].forEach(function(b){
          h += '<button type="button" data-band="'+b+'" aria-pressed="'+(band===b)+'" title="'+esc(t.bands[b][0])+'">'+b+'</button>';
        });
        h += '</div></td><td class="n">'+(band ? BAND_PTS[band]+'<span style="color:var(--muted)">/30</span>' : '<span class="lowN">—</span>')+'</td>'
          + '<td><input type="text" class="qarem" data-rem="'+esc(key)+'" value="'+esc(rem)+'" placeholder="'+esc(t.qaRemarksPh)+'"></td>'
          + '<td>'+qaStatusCell(key)+'</td>'
          + '<td><button type="button" class="qasave" data-save="'+esc(key)+'"'+(dirty || !cur ? '' : ' disabled')+'>'+esc(t.qaSave)+'</button></td></tr>';
      });
      h += '</tbody></table></div>';
    }
    h += '<div class="bandlegend">';
    [1,2,3,4].forEach(function(b){
      h += '<div><b>'+esc(t.bands[b][0])+' · '+BAND_PTS[b]+'</b><span>'+esc(t.bands[b][1])+'</span></div>';
    });
    return h + '</div></div>';
  }

  function wireApp(){
    document.querySelectorAll("tr[data-clinic]").forEach(function(tr){
      tr.onclick = function(){
        var k = tr.dataset.clinic;
        clinic = (clinic === k) ? "all" : k;
        da = "all"; wl.page = 0; buildFilters(); render();
      };
    });
    document.querySelectorAll("tr[data-da]").forEach(function(tr){
      tr.onclick = function(){
        var k = tr.dataset.da;
        if(da === k){ da = "all"; }
        else { clinic = daClinic(k); da = k; }
        wl.page = 0; buildFilters(); render();
      };
    });
    function on(id, ev, fn){ var e = document.getElementById(id); if(e) e[ev] = fn; }
    on("wlq","oninput",function(e){ wl.q = e.target.value; wl.page = 0; render(); });
    on("wlclinic","onchange",function(e){ wl.clinic = e.target.value; wl.page = 0; render(); });
    on("wlda","onchange",function(e){ wl.da = e.target.value; wl.page = 0; render(); });
    on("wlcad","onchange",function(e){ wl.cad = e.target.value; wl.page = 0; render(); });
    on("wlstatus","onchange",function(e){ wl.status = e.target.value; wl.page = 0; render(); });
    on("wlmin","onchange",function(e){ wl.minOd = e.target.value; wl.page = 0; render(); });
    on("wlmax","onchange",function(e){ wl.maxOd = e.target.value; wl.page = 0; render(); });
    on("wlclear","onclick",function(){
      wl.q=""; wl.clinic=""; wl.da=""; wl.cad=""; wl.status="";
      wl.minOd=""; wl.maxOd=""; wl.page=0; render();
    });
    on("wlprev","onclick",function(){ if(wl.page>0){ wl.page--; render(); } });
    on("wlnext","onclick",function(){ wl.page++; render(); });
    document.querySelectorAll("th[data-sort]").forEach(function(th){
      th.onclick = function(){
        var k = th.dataset.sort;
        if(wl.sort === k) wl.dir = -wl.dir; else { wl.sort = k; wl.dir = (k==="od") ? -1 : 1; }
        render();
      };
    });
    var q = document.getElementById("wlq");
    if(q && document.activeElement !== q && wl.q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); }

    /* quality ratings */
    on("qaBy","onchange",function(e){ qaBy = e.target.value.trim() || qaBy; persistLocal(); });
    document.querySelectorAll("#qaPanel button[data-month]").forEach(function(b){
      b.onclick = function(){
        month = b.dataset.month; week = "all"; wl.page = 0; buildFilters(); render();
        var el = document.getElementById("qaPanel"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
      };
    });
    on("qaShare","onclick",function(){
      var link = ratingsLink(), t = T();
      var done = function(){ qaCopied = true; render();
        setTimeout(function(){ qaCopied = false; if(session) render(); }, 2500); };
      var manual = function(){ window.prompt(t.qaShare, link); };
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, manual);
      else manual();
    });
    document.querySelectorAll("tr[data-qa] button[data-band]").forEach(function(b){
      b.onclick = function(){
        var key = b.closest("tr").dataset.qa;
        qaDraft[key] = qaDraft[key] || {}; qaDraft[key].band = +b.dataset.band;
        delete qaStatus[key]; render();
      };
    });
    document.querySelectorAll("input[data-rem]").forEach(function(inp){
      inp.oninput = function(){
        var key = inp.dataset.rem;
        qaDraft[key] = qaDraft[key] || {}; qaDraft[key].remarks = inp.value;
        var tr = inp.closest("tr"), sv = tr.querySelector("button[data-save]");
        if(sv) sv.disabled = false;
      };
      inp.onkeydown = function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); var k = inp.dataset.rem.split("│"); saveRating(k[0], k[1], k[2]); } };
    });
    document.querySelectorAll("button[data-save]").forEach(function(b){
      b.onclick = function(){ var k = b.dataset.save.split("│"); saveRating(k[0], k[1], k[2]); };
    });
  }

  function saveSession(){ session={ok:1}; try{sessionStorage.setItem("lasik_session","1")}catch(e){} }
  function loadSession(){ try{ if(sessionStorage.getItem("lasik_session")==="1"){session={ok:1};return true;} }catch(e){} return false; }
  function signOut(){
    session=null; clinic="all"; da="all"; month=TODAY.slice(0,7); week="all";
    try{sessionStorage.removeItem("lasik_session")}catch(e){}
    document.getElementById("wrap").hidden=true;
    document.getElementById("gate").classList.remove("gone");
    var g=document.getElementById("gp"); g.value=""; g.focus();
  }
  function enterApp(){
    document.getElementById("gate").classList.add("gone");
    document.getElementById("wrap").hidden=false;
    month = TODAY.slice(0,7);          /* open on the live month, not on All */
    loadEmbeddedRatings(); loadLocalRatings();
    qaImported = ratingsFromHash();
    buildFilters(); render();
    loadLive().then(function(changed){
      if(!session) return;
      if(changed){ buildFilters(); render(); } else renderFeed();
    });
  }
  document.getElementById("gateform").addEventListener("submit", function(ev){
    ev.preventDefault();
    var t=T(), btn=document.getElementById("gateBtn"), err=document.getElementById("gateErr");
    btn.disabled=true; btn.textContent=t.signingin; err.classList.remove("on");
    sha256(document.getElementById("gp").value).then(function(hh){
      btn.disabled=false; btn.textContent=t.signin;
      if(hh!==PW_HASH){ err.textContent=t.badlogin; err.classList.add("on");
        var g=document.getElementById("gp"); g.value=""; g.focus(); return; }
      saveSession(); enterApp();
    }).catch(function(){ btn.disabled=false; btn.textContent=t.signin;
      err.textContent=t.badlogin; err.classList.add("on"); });
  });
  document.getElementById("langseg").querySelectorAll("button").forEach(function(b){
    b.onclick=function(){ lang=b.dataset.l;
      document.getElementById("langseg").querySelectorAll("button").forEach(function(x){
        x.setAttribute("aria-pressed", String(x===b)); });
      applyGateLang(); if(session){ buildFilters(); render(); } };
  });


  applyGateLang();
  if(loadSession()) enterApp();
  else document.getElementById("gp").focus();
})();
</script>
