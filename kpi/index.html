<style>

    --warn:#A6690A; --warn-soft:#F7EEDC; --warn-mid:#EFDCBB;
    --bad:#AE2E48; --bad-soft:#F8E6EA;
    --inert:#5A6072; --inert-soft:#EBECEF;
    --c1:#2438B8; --c2:#17795E; --c3:#A6690A;

  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0E0F14; --surface:#171922; --surface-2:#1E2029; --surface-3:#2A2D39;
      --ink:#E9EAF0; --ink-2:#BFC3D0; --muted:#8D93A5;
      --rule:#2B2E3A; --rule-2:#23262F;
      --accent:#8D99F7; --accent-soft:#1D2140;
      --mark:#C6CE55; --mark-ink:#14150A;
      --ok:#5FC7A4; --ok-soft:#12291F;
      --warn:#E0A83F; --warn-soft:#2C2211; --warn-mid:#453317;
      --bad:#F0819A; --bad-soft:#2E141B;
      --inert:#98A0B4; --inert-soft:#1F2129;
      --c1:#8D99F7; --c2:#5FC7A4; --c3:#E0A83F;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.85);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0E0F14; --surface:#171922; --surface-2:#1E2029; --surface-3:#2A2D39;
    --ink:#E9EAF0; --ink-2:#BFC3D0; --muted:#8D93A5;
    --rule:#2B2E3A; --rule-2:#23262F;
    --accent:#8D99F7; --accent-soft:#1D2140;
    --mark:#C6CE55; --mark-ink:#14150A;
    --ok:#5FC7A4; --ok-soft:#12291F;
    --warn:#E0A83F; --warn-soft:#2C2211; --warn-mid:#453317;
    --bad:#F0819A; --bad-soft:#2E141B;
    --inert:#98A0B4; --inert-soft:#1F2129;
    --c1:#8D99F7; --c2:#5FC7A4; --c3:#E0A83F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.85);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  body.lang-zh{font-family:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
  .mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:1200px;margin:0 auto;padding:0 22px 80px}
  @media (max-width:640px){.wrap{padding:0 12px 60px}}

  #gate{position:fixed;inset:0;z-index:100;background:var(--ground);display:flex;align-items:center;justify-content:center;padding:24px}
  #gate.gone{display:none}
  .gatecard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);padding:34px 32px}
  .gatecard .brand{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:14px}
  .gatecard h2{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:1.42rem;letter-spacing:-.015em;margin:0 0 7px;line-height:1.2}
  .gatecard .lede{font-size:.88rem;color:var(--muted);margin:0 0 24px}
  .field{margin-bottom:15px}
  .field label{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
  .field input{width:100%;padding:10px 12px;font-family:inherit;font-size:.92rem;background:var(--ground);color:var(--ink);border:1px solid var(--rule);border-radius:4px}
  .gatebtn{width:100%;padding:11px;background:var(--accent);color:var(--surface);border:0;border-radius:4px;font-weight:600;font-size:.92rem;margin-top:6px}
  .gatebtn:disabled{opacity:.55;cursor:default}
  .gateerr{background:var(--bad-soft);color:var(--bad);border-radius:4px;padding:9px 12px;font-size:.84rem;margin-bottom:15px;display:none}
  .gateerr.on{display:block}

  header.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between;padding:28px 0 14px}
  .titleblock h1{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:1.6rem;letter-spacing:-.015em;margin:0 0 4px}
  .titleblock .sub{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .seg{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--surface)}
  .seg button{background:none;border:0;padding:6px 10px;color:var(--muted);font-size:12px;font-weight:500;border-right:1px solid var(--rule)}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
  .feed{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .feed i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
  .feed.live{color:var(--ok)} .feed.live i{background:var(--ok)}
  .feed.loading i{background:var(--warn)}
  .feed.failed{color:var(--bad)} .feed.failed i{background:var(--bad)}
  .who button{background:none;border:1px solid var(--rule);border-radius:4px;padding:4px 10px;color:var(--muted);font-size:10.5px;font-family:"IBM Plex Mono",monospace}
  .who button:hover{color:var(--ink);border-color:var(--muted)}

  .filters{display:grid;gap:6px;margin:6px 0 4px}
  .frow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .frow button{background:var(--surface);border:1px solid var(--rule);border-radius:20px;padding:5px 13px;font-size:.83rem;color:var(--ink-2);display:flex;align-items:center;gap:7px}
  .frow button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
  .mtdtag{font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.08em;background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:3px;font-weight:600}
  .frow button[aria-pressed="true"] .mtdtag{background:rgba(255,255,255,.22);color:var(--surface)}
  .scopebar{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 0 18px}
  .scopebar b{color:var(--accent);font-weight:600}

  .note{background:var(--surface-2);border:1px solid var(--rule);border-radius:6px;padding:12px 16px;margin-bottom:16px;font-size:.84rem;color:var(--ink-2)}
  .note p{margin:0} .note a{color:var(--accent)}
  .panel{background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);margin-bottom:16px}
  .panel > h3{margin:0;padding:13px 18px;border-bottom:1px solid var(--rule-2);font-size:.95rem;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .panel > h3 .hint{font-weight:400;font-size:.78rem;color:var(--muted)}
  .pad{padding:16px 18px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  @media (max-width:860px){.grid2{grid-template-columns:1fr}}
  .grid2 > *{min-width:0}

  /* headline tiles */
  .heads{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
  @media (max-width:860px){.heads{grid-template-columns:1fr}}
  .head{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:6px;box-shadow:var(--shadow);padding:18px 20px;min-width:0}
  .head.ok{border-left-color:var(--ok)} .head.warn{border-left-color:var(--warn)} .head.bad{border-left-color:var(--bad)}
  .head .hl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .head .hv{font-size:2.5rem;font-weight:600;letter-spacing:-.04em;line-height:1;margin:8px 0 2px;font-variant-numeric:tabular-nums}
  .head .ht{font-size:.84rem;color:var(--muted)}
  .head .ht b{color:var(--ink);font-family:"IBM Plex Mono",monospace;font-weight:600}
  .gauge{position:relative;height:12px;background:var(--surface-3);border-radius:3px;margin:12px 0 6px;overflow:visible}
  .gfill{height:100%;border-radius:3px}
  .gpace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.6}
  .gl{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted)}
  .pace{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.05em;padding:2px 7px;border-radius:3px;font-weight:600;margin-top:8px}
  .p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-warn{background:var(--warn-soft);color:var(--warn)}
  .p-mock{background:var(--mark);color:var(--mark-ink)} .p-accent{background:var(--accent-soft);color:var(--accent)}
  .pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.05em;padding:2px 7px;border-radius:3px;font-weight:600;white-space:nowrap}

  table{border-collapse:collapse;width:100%;font-size:.86rem}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--rule-2)}
  thead th{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
  thead th.grp{text-align:center;border-bottom:1px solid var(--rule);background:var(--surface-3)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr.tot td{background:var(--surface-2);font-weight:600;border-top:1px solid var(--rule)}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",monospace}
  td.sw{width:12px;padding-right:0} td.sw i{display:inline-block;width:10px;height:10px;border-radius:2px}
  .tblwrap{overflow-x:auto}
  .barw{position:relative;height:8px;background:var(--surface-3);border-radius:2px;min-width:70px}
  .barf{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
  .bart{position:absolute;top:-2px;bottom:-2px;width:1.5px;background:var(--ink);opacity:.55}
  .mix{display:flex;height:22px;border-radius:4px;overflow:hidden;background:var(--surface-3);margin:4px 0 10px}
  .mix span{display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:10px;color:#fff;font-weight:600;overflow:hidden;white-space:nowrap}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:6px} .legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

  .wkbars{display:flex;align-items:flex-end;gap:10px;height:150px;position:relative;margin-top:8px}
  .wcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;min-width:0}
  .wbar{width:100%;max-width:58px;border-radius:2px 2px 0 0}
  .wval{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600}
  .wlab{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--muted);white-space:nowrap}
  .tline{position:absolute;left:0;right:0;border-top:1px dashed var(--ink);opacity:.4}
  .tlineLab{position:absolute;right:0;font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--muted);transform:translateY(-14px)}
  .foot{font-size:.8rem;color:var(--muted);line-height:1.5;margin-top:20px} .foot a{color:var(--accent)}
  .links{display:flex;gap:8px;flex-wrap:wrap}
  .links a{font-size:.8rem;color:var(--accent);text-decoration:none;border:1px solid var(--rule);border-radius:4px;padding:4px 10px;background:var(--surface)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="gate">
  <form class="gatecard" id="gateform" autocomplete="on">

<script src="../optom-core.js"></script>
<script>
(function(){
  "use strict";
  var Z = window.ZSOP, DATA = Z.DATA;
  var STAGES = Z.STAGES, OFF = Z.OFF, CAD = Z.CAD;
  var CASES = DATA.cases, SNAPSHOT = DATA.cases;
  var TODAY = Z.todayISO(), START = Z.START, TARGET = Z.TARGET, MS = Z.MS;
  var PW_HASH = "d53942c8e49f95569651edc09e700cc036cc347754caa01dfa482574a51dae6e";
  var lang = "en", clinic = "all", month = TODAY.slice(0,7), session = null;
  var feedState = { mode:"snapshot", at:DATA.generated || "", error:"" };

  /* ================= KPI inputs =================
     ILLUSTRATIVE. Sales and leads have no data source yet: targets below
     are placeholders per clinic per month, and "achieved" is modelled
     from them. Replace TARGETS with the real monthly targets and point
     actuals() at the sales tracker / Salework when those are available.
     Revenue in VND. */
  var STREAMS = ["member","repurchase","referral"];
  var TARGETS = {
    "CTE D5": { rev:{member:600e6, repurchase:220e6, referral:140e6}, cust:{member:110, repurchase:55, referral:28}, leads:380 },
    "NGT":    { rev:{member:900e6, repurchase:340e6, referral:210e6}, cust:{member:170, repurchase:85, referral:42}, leads:560 }
  };
  /* Achieved so far for a clinic-month: a deterministic draw around the
     target, scaled by how much of the month has elapsed. */
  function actuals(cl, m){
    var t = TARGETS[cl], r = Z.prng(Z.hash32("kpi│" + cl + "│" + m));
    var frac = monthFrac(m), out = { rev:{}, cust:{}, leads:0, leadsByWeek:[] };
    /* a clinic with no target block yet shows zeros rather than breaking the page */
    if(!t){ STREAMS.forEach(function(s2){ out.rev[s2] = 0; out.cust[s2] = 0; });
      out.leadsByWeek = weeksOf(m).map(function(w){ return {w:w, n:null}; }); return out; }
    STREAMS.forEach(function(s){
      var k = 0.72 + r()*0.45;                     /* 72% - 117% of pace */
      out.rev[s]  = Math.round(t.rev[s]  * frac * k / 1e6) * 1e6;
      out.cust[s] = Math.round(t.cust[s] * frac * (k*0.9 + r()*0.2));
    });
    var lk = 0.7 + r()*0.5;
    out.leads = Math.round(t.leads * frac * lk);
    /* split leads across the month's weeks (Mon-start), only the elapsed ones */
    var weeks = weeksOf(m), left = out.leads;
    weeks.forEach(function(w, i){
      if(w.start > TODAY){ out.leadsByWeek.push({w:w, n:null}); return; }
      var share = i === weeks.length-1 || weeks[i+1].start > TODAY ? left : Math.round(out.leads * w.frac * (0.8 + r()*0.4));
      share = Math.max(0, Math.min(left, share)); left -= share;
      out.leadsByWeek.push({w:w, n:share});
    });
    return out;
  }
  function daysIn(m){ return new Date(Date.UTC(+m.slice(0,4), +m.slice(5,7), 0)).getUTCDate(); }
  /* share of the month elapsed: 1 for past months, day/days for the live one */
  function monthFrac(m){
    var cur = TODAY.slice(0,7);
    if(m < cur) return 1;
    if(m > cur) return 0;
    return +TODAY.slice(8,10) / daysIn(m);
  }
  function weeksOf(m){
    var n = daysIn(m), out = [], d = m + "-01", i = 1;
    while(d.slice(0,7) === m){
      var wd = (new Date(Date.parse(d)).getUTCDay() + 6) % 7, end = Z.addDays(d, 6 - wd);
      if(end.slice(0,7) !== m) end = m + "-" + String(n).padStart(2,"0");
      var days = Math.round((Date.parse(end) - Date.parse(d)) / MS) + 1;
      out.push({ start:d, end:end, frac: days / n, i:i++ });
      d = Z.addDays(end, 1);
    }
    return out;
  }

  /* ================= helpers ================= */
  function T(){ return L[lang]; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function pct(a,b){ return b ? Math.round(a/b*100) : 0; }
  function fill(s, o){ Object.keys(o).forEach(function(k){ s = s.split("{"+k+"}").join(o[k]); }); return s; }
  function money(v){
    var t = T();
    if(Math.abs(v) >= 1e9) return fill(t.bn, {n:(v/1e9).toFixed(2).replace(/\.?0+$/,"")});
    return fill(t.mn, {n:Math.round(v/1e6).toLocaleString("en-US")});
  }
  function monthLabel(k){ return T().months[+k.slice(5,7)-1] + " " + k.slice(0,4); }
  function fmtWhen(iso){
    if(!iso) return "";
    var t = T(), d = new Date(iso);
    if(isNaN(d)) return iso;
    var day = d.getDate() + " " + t.months[d.getMonth()];
    return iso.length > 10 ? day + " " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0") : day;
  }
  function scoreColour(s){ return s>=TARGET ? "var(--ok)" : s>=70 ? "var(--warn)" : "var(--bad)"; }
  function scoreClass(s){ return s>=TARGET ? "ok" : s>=70 ? "warn" : "bad"; }
  /* pace: achieved vs the share of the month elapsed */
  function paceClass(ach, tgt, frac){
    if(!tgt || !frac) return "";
    var ratio = (ach / tgt) / frac;
    return ratio >= 0.97 ? "ok" : ratio >= 0.85 ? "warn" : "bad";
  }

  /* ---------------- SOP (real, same rules as the head-office page) ---------------- */
  function defs(c, si){ return CAD[c[2]][STAGES[si]] || null; }
  function dueDate(c, si){ var a = OFF[si][0] === 0 ? c[4] : c[5]; return a ? Z.addDays(a, OFF[si][1]) : null; }
  function cadencePoints(c, si){
    var bits = c[8][si], got = 0;
    for(var i=0;i<bits.length;i++) if(bits.charAt(i)==="1") got++;
    return got === 0 ? 0 : got === bits.length ? 1 : 0.5;
  }
  function sop(cl, m){
    var due=0, pts=0, miss=0, cust={};
    CASES.forEach(function(c){
      if(cl !== "all" && c[0] !== cl) return;
      for(var si=0; si<STAGES.length; si++){
        if(!defs(c, si)) continue;
        var d = dueDate(c, si);
        if(!d || d >= TODAY || d < START || d.slice(0,7) !== m) continue;
        var v = cadencePoints(c, si); due++; pts += v; if(v === 0) miss++; cust[c[0]+"│"+c[6]] = 1;
      }
    });
    return { due:due, pts:pts, miss:miss, score:pct(pts, due), n:Object.keys(cust).length };
  }
  function clinics(){ var s = {}; CASES.forEach(function(c){ s[c[0]] = 1; }); return Object.keys(s).sort(); }
  function months(){
    var out = [], m = START.slice(0,7), cur = TODAY.slice(0,7);
    while(m <= cur){ out.push(m); var y = +m.slice(0,4), mo = +m.slice(5,7)+1; if(mo > 12){ mo = 1; y++; } m = y + "-" + String(mo).padStart(2,"0"); }
    return out;
  }
  function sum(cl, m, key, sub){
    var list = cl === "all" ? clinics() : [cl], v = 0;

      var g = sop(c, month);
      h += '<tr><td><b>'+esc(c)+'</b></td><td class="n" style="color:'+scoreColour(g.score)+'">'+(g.due ? g.score+'%' : '—')+'</td>'
        + '<td><div class="barw"><div class="barf" style="width:'+Math.max(g.score,1)+'%;background:'+scoreColour(g.score)+'"></div><div class="bart" style="left:'+TARGET+'%"></div></div></td>'
        + '<td class="n">'+g.due+'</td><td class="n">'+g.miss+'</td><td class="n">'+g.n+'</td></tr>';
    });
    h += '<tr class="tot"><td>'+esc(t.thTot)+'</td><td class="n">'+(s.due ? s.score+'%' : '—')+'</td><td></td><td class="n">'+s.due+'</td><td class="n">'+s.miss+'</td><td class="n">'+s.n+'</td></tr>'
      + '</tbody></table></div><div class="pad" style="border-top:1px solid var(--rule-2)"><div class="links">'
      + '<a href="../">'+esc(t.links.optom)+' →</a><a href="../da/">'+esc(t.links.da)+' →</a></div></div></div>';
    h += '</div>';

    h += '<p class="foot">'+fill(t.foot, {src: feedState.mode === "live" ? fill(t.srcLive, {t:fmtWhen(feedState.at)}) : fill(t.srcSnap, {t:fmtWhen(feedState.at)})})+'</p>';
    document.getElementById("app").innerHTML = h;
    renderWho(); renderFeed();
  }

  /* ================= shell ================= */
  function renderFeed(){
    var t = T(), el = document.getElementById("feed"), m = feedState.mode;
    if(!Z.feedUrl() && m !== "live"){ el.className = "feed"; el.innerHTML = '<i></i>' + esc(t.feedSnap) + ' ' + esc(fmtWhen(feedState.at)); return; }
    el.className = "feed " + m;
    el.innerHTML = '<i></i>' + esc(m === "live" ? t.feedLive + " " + fmtWhen(feedState.at) : m === "loading" ? t.feedLoading : t.feedFailed + " " + fmtWhen(feedState.at));
    if(m === "failed") el.title = feedState.error;
  }
  function renderWho(){
    var el = document.getElementById("whoami");
    el.innerHTML = session ? '<button type="button" id="soBtn">'+esc(T().signout)+'</button>' : "";
    if(session) document.getElementById("soBtn").onclick = signOut;
  }
  function applyGateLang(){
    var t = T();
    document.getElementById("gTitle").textContent = t.title;
    document.getElementById("gateLede").textContent = t.glede;
    document.getElementById("lpass").textContent = t.lpass;
    var b = document.getElementById("gateBtn"); if(!b.disabled) b.textContent = t.signin;
  }
  function saveSession(){ session={ok:1}; try{sessionStorage.setItem("zsop_session","1")}catch(e){} }
  function loadSession(){ try{ if(sessionStorage.getItem("zsop_session")==="1"){session={ok:1};return true;} }catch(e){} return false; }
  function signOut(){
    session=null; clinic="all"; month=TODAY.slice(0,7);
    try{sessionStorage.removeItem("zsop_session")}catch(e){}
    document.getElementById("wrap").hidden=true;
    document.getElementById("gate").classList.remove("gone");
    var g=document.getElementById("gp"); g.value=""; g.focus();
  }
  function enterApp(){
    document.getElementById("gate").classList.add("gone");
    document.getElementById("wrap").hidden=false;
    buildFilters(); render();
    if(Z.feedUrl()){
      feedState = { mode:"loading", at:"", error:"" }; renderFeed();
      Z.loadFeed().then(function(f){ CASES = f.cases; feedState = { mode:"live", at:f.generated, error:"" }; })
        .catch(function(err){ CASES = SNAPSHOT; feedState = { mode:"failed", at:DATA.generated || "", error:String(err && err.message || err) }; })
        .then(function(){ if(session){ buildFilters(); render(); } });
    }
  }
  document.getElementById("gateform").addEventListener("submit", function(ev){
    ev.preventDefault();
    var t=T(), btn=document.getElementById("gateBtn"), err=document.getElementById("gateErr");
    btn.disabled=true; btn.textContent=t.signingin; err.classList.remove("on");
    sha256(document.getElementById("gp").value).then(function(hh){
      btn.disabled=false; btn.textContent=t.signin;
      if(hh!==PW_HASH){ err.textContent=t.badlogin; err.classList.add("on"); var g=document.getElementById("gp"); g.value=""; g.focus(); return; }
      saveSession(); enterApp();
    }).catch(function(){ btn.disabled=false; btn.textContent=t.signin; err.textContent=t.badlogin; err.classList.add("on"); });
  });
  document.getElementById("langseg").querySelectorAll("button").forEach(function(b){
    b.onclick=function(){ lang=b.dataset.l;
      document.getElementById("langseg").querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-pressed", String(x===b)); });
      applyGateLang(); if(session){ buildFilters(); render(); } };
  });
  var ql = /[?&]lang=(en|vi|zh)/.exec(location.search);
  if(ql){ lang = ql[1]; document.getElementById("langseg").querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-pressed", String(x.dataset.l===lang)); }); }
  applyGateLang();
  if(loadSession()) enterApp(); else document.getElementById("gp").focus();
})();
</script>
