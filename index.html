<meta charset="utf-8">
<title>ZALO SOP Compliance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">

<style>
  :root{
    --ground:#FBFAF8; --surface:#FFFFFF; --surface-2:#F3F2EE; --surface-3:#E7E5DF;
    --ink:#14151C; --ink-2:#3B3E4C; --muted:#6A6F80;
    --rule:#DEDCD6; --rule-2:#EAE8E3;
    --accent:#2438B8; --accent-soft:#E7E9F8;
    --mark:#E6EE6B; --mark-ink:#2B2C0E;
    --ok:#17795E; --ok-soft:#E2F0EA;
    --warn:#A6690A; --warn-soft:#F7EEDC; --warn-mid:#EFDCBB;
    --bad:#AE2E48; --bad-soft:#F8E6EA;
    --inert:#5A6072; --inert-soft:#EBECEF;
    --shadow:0 1px 2px rgba(20,21,28,.05), 0 8px 24px -18px rgba(20,21,28,.25);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0E0F14; --surface:#171922; --surface-2:#1E2029; --surface-3:#2A2D39;
      --ink:#E9EAF0; --ink-2:#BFC3D0; --muted:#8D93A5;
      --rule:#2B2E3A; --rule-2:#23262F;
      --accent:#8D99F7; --accent-soft:#1D2140;
      --mark:#C6CE55; --mark-ink:#14150A;
      --ok:#5FC7A4; --ok-soft:#12291F;
      --warn:#E0A83F; --warn-soft:#2C2211; --warn-mid:#453317;
      --bad:#F0819A; --bad-soft:#2E141B;
      --inert:#98A0B4; --inert-soft:#1F2129;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.85);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0E0F14; --surface:#171922; --surface-2:#1E2029; --surface-3:#2A2D39;
    --ink:#E9EAF0; --ink-2:#BFC3D0; --muted:#8D93A5;
    --rule:#2B2E3A; --rule-2:#23262F;
    --accent:#8D99F7; --accent-soft:#1D2140;
    --mark:#C6CE55; --mark-ink:#14150A;
    --ok:#5FC7A4; --ok-soft:#12291F;
    --warn:#E0A83F; --warn-soft:#2C2211; --warn-mid:#453317;
    --bad:#F0819A; --bad-soft:#2E141B;
    --inert:#98A0B4; --inert-soft:#1F2129;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.85);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body.lang-zh{font-family:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
  .wrap{max-width:1400px;margin:0 auto;padding:0 24px 90px}

  #gate{position:fixed;inset:0;z-index:100;background:var(--ground);
    display:flex;align-items:center;justify-content:center;padding:24px}
  #gate.gone{display:none}
  .gatecard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--rule);
    border-radius:6px;box-shadow:var(--shadow);padding:34px 32px}
  .gatecard .brand{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:14px}
  .gatecard h2{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:1.42rem;
    letter-spacing:-.015em;margin:0 0 7px;line-height:1.2}
  .gatecard .lede{font-size:.88rem;color:var(--muted);margin:0 0 24px}
  .field{margin-bottom:15px}
  .field label{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
    letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
  .field input{width:100%;padding:10px 12px;font-family:inherit;font-size:.92rem;
    background:var(--ground);color:var(--ink);border:1px solid var(--rule);border-radius:4px}
  .gatebtn{width:100%;padding:11px;background:var(--accent);color:var(--surface);border:0;
    border-radius:4px;font-weight:600;font-size:.92rem;margin-top:6px}
  .gatebtn:disabled{opacity:.55;cursor:default}
  .gateerr{background:var(--bad-soft);color:var(--bad);border-radius:4px;padding:9px 12px;
    font-size:.84rem;margin-bottom:15px;display:none}
  .gateerr.on{display:block}
  .feed{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .feed i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
  .feed.live{color:var(--ok)} .feed.live i{background:var(--ok)}
  .feed.loading i{background:var(--warn)}
  .feed.failed{color:var(--bad)} .feed.failed i{background:var(--bad)}
  .who{display:flex;align-items:center;gap:9px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted)}
  .who button{background:none;border:1px solid var(--rule);border-radius:4px;padding:4px 10px;
    color:var(--muted);font-size:10.5px;font-family:inherit}
  .who button:hover{color:var(--ink);border-color:var(--muted)}

  header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;padding:32px 0 14px}
  .titleblock h1{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:1.7rem;letter-spacing:-.015em;margin:0 0 5px}
  .titleblock .sub{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .seg{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--surface)}
  .seg button{background:none;border:0;padding:7px 12px;color:var(--muted);font-size:12.5px;font-weight:500;border-right:1px solid var(--rule)}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}

  .filters{display:grid;gap:6px;margin:8px 0 4px}
  .frow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .frow > .flab{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);min-width:58px}
  .frow button{background:var(--surface);border:1px solid var(--rule);border-radius:20px;
    padding:5px 13px;font-size:.83rem;color:var(--ink-2);display:flex;align-items:center;gap:7px}
  .frow button .cn{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;color:var(--accent)}
  .frow button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
  .frow button[aria-pressed="true"] .cn{color:var(--surface)}
  .frow button[disabled]{opacity:.32;cursor:default}
  .frow.sub button{border-style:dashed}
  .frow.sub button[aria-pressed="true"]{border-style:solid}
  .mtdtag{font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.08em;
    background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:3px;font-weight:600}
  .frow button[aria-pressed="true"] .mtdtag{background:rgba(255,255,255,.22);color:var(--surface)}
  .scopebar{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);margin:10px 0 20px}
  .scopebar b{color:var(--accent);font-weight:600}

  .herorow{display:grid;grid-template-columns:1fr 320px;gap:16px;margin-bottom:18px;align-items:stretch}
  @media (max-width:980px){.herorow{grid-template-columns:1fr}}
  .hero{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--accent);
    border-radius:4px;box-shadow:var(--shadow);padding:24px 28px}
  .heroTop{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center}
  @media (max-width:700px){.heroTop{grid-template-columns:1fr;gap:16px}}
  .bignum{font-size:4rem;font-weight:600;letter-spacing:-.045em;line-height:.9;font-variant-numeric:tabular-nums}
  .biglab{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--muted);margin-top:10px}
  .sideline{font-size:.96rem;color:var(--ink-2);margin:0 0 14px;max-width:60ch}
  .sideline b{color:var(--ink);font-weight:600}
  .gauge{position:relative;height:30px;background:var(--surface-3);border-radius:3px;overflow:visible;margin-bottom:9px}
  .gfill{height:100%;border-radius:3px}
  .gtarget{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);opacity:.75}
  .gtlab{position:absolute;top:-19px;transform:translateX(-50%);font-family:"IBM Plex Mono",monospace;
    font-size:9.5px;letter-spacing:.08em;color:var(--ink-2);white-space:nowrap}
  .glegend{display:flex;gap:18px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
  .glegend b{font-family:"IBM Plex Mono",monospace;color:var(--ink)}

  .flagcard{background:var(--bad-soft);border:1px solid var(--bad);border-left:4px solid var(--bad);
    border-radius:4px;box-shadow:var(--shadow);padding:20px 22px;display:flex;flex-direction:column;
    gap:11px;min-width:0;overflow-wrap:anywhere}
  .flagcard .fnum{font-size:2.5rem;font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--bad);font-variant-numeric:tabular-nums}
  .flagcard .flab{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--bad);font-weight:600}
  .flagcard p{margin:0;font-size:.83rem;color:var(--ink-2)}
  .flist{display:flex;flex-direction:column;min-width:0}
  .flist .fr{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;
    gap:2px 12px;font-size:.81rem;padding:6px 0;border-bottom:1px solid var(--rule);min-width:0}
  .flist .fr:last-child{border-bottom:0}
  .flist .fr > span:first-child{flex:1 1 auto;min-width:0}
  .flist .fv{font-family:"IBM Plex Mono",monospace;font-weight:600;white-space:normal;
    overflow-wrap:anywhere;text-align:right;max-width:100%;line-height:1.45}
  .flagcard.warn{background:var(--warn-soft);border-color:var(--warn)}
  .flagcard.warn .fnum,.flagcard.warn .flab{color:var(--warn)}
  .flagcard.warn .flist .fr{border-color:var(--warn-mid)}

  .panel{background:var(--surface);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);margin-bottom:18px}
  .panel > h3{margin:0;padding:14px 20px;border-bottom:1px solid var(--rule-2);font-size:.92rem;font-weight:600;
    display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
  .panel > h3 .hint{font-weight:400;font-size:.79rem;color:var(--muted)}
  .pad{padding:18px 20px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  @media (max-width:980px){.grid2{grid-template-columns:1fr}}
  .grid2 > *{min-width:0}
  .note{background:var(--surface-2);border:1px solid var(--rule);border-radius:4px;padding:14px 18px;margin-bottom:18px;font-size:.86rem}
  .note p{margin:0}

  /* data-flag section */
  .fgrid{display:grid;grid-template-columns:330px 1fr;gap:0}
  @media (max-width:980px){.fgrid{grid-template-columns:1fr}}
  .fleft{padding:18px 20px;border-right:1px solid var(--rule-2);background:var(--warn-soft)}
  @media (max-width:980px){.fleft{border-right:0;border-bottom:1px solid var(--rule-2)}}
  .fleft .fnum{font-size:2.6rem;font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--warn);font-variant-numeric:tabular-nums}
  .fleft .flab{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--warn);font-weight:600;margin-top:6px}
  .fleft p{margin:10px 0 0;font-size:.82rem;color:var(--ink-2)}
  .ftype{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--warn-mid);font-size:.83rem;cursor:pointer}
  .ftype:last-child{border-bottom:0}
  .ftype:hover .fk{color:var(--accent)}
  .ftype.on .fk{color:var(--accent);font-weight:600}
  .ftype .fk{font-weight:600}
  .ftype .fx{grid-column:1/-1;font-size:.77rem;color:var(--muted);line-height:1.45}
  .ftype .fv{font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
  .fright{min-width:0}
  .chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:12px 20px;border-bottom:1px solid var(--rule-2);background:var(--surface-2)}
  .chips button{background:var(--surface);border:1px solid var(--rule);border-radius:20px;padding:4px 12px;font-size:.8rem;color:var(--ink-2);display:flex;gap:6px;align-items:center}
  .chips button .cn{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;color:var(--warn)}
  .chips button[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
  .chips button[aria-pressed="true"] .cn{color:#fff}
  .chips .wlcount{margin-left:auto}
  .blocknote{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--rule-2);font-size:.85rem;color:var(--ink-2)}
  .blocknote b{font-family:"IBM Plex Mono",monospace;color:var(--bad)}
  td.fix{font-size:.8rem;color:var(--muted);max-width:300px}

  .tp{border-bottom:1px solid var(--rule-2);padding:14px 20px}
  .tp:last-child{border-bottom:0}
  .tphead{display:grid;grid-template-columns:120px 1fr 152px;gap:14px;align-items:center}
  @media (max-width:640px){.tphead{grid-template-columns:80px 1fr 96px;gap:9px}}
  .tpname{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.86rem}
  .tpname .ph{display:block;font-family:"IBM Plex Sans",sans-serif;font-weight:400;
    font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .tptrack{height:24px;background:var(--surface-3);border-radius:3px;overflow:hidden;display:flex}
  .tpseg{height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .tpseg span{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;color:#fff;opacity:.95;white-space:nowrap}
  :root[data-theme="dark"] .tpseg span,
  :root:not([data-theme="light"]) .tpseg span{color:var(--ground)}
  .tpnums{font-family:"IBM Plex Mono",monospace;font-size:.82rem;text-align:right;font-variant-numeric:tabular-nums}
  .cps{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0 134px}
  @media (max-width:640px){.cps{margin-left:0}}
  .cp{font-size:.78rem;display:flex;align-items:center;gap:6px;background:var(--surface-2);
    border:1px solid var(--rule-2);border-radius:3px;padding:3px 9px}
  .cp .pcv{font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums}
  .cp .pp{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--muted);letter-spacing:.05em}
  .cp.vip{border-color:var(--accent);background:var(--accent-soft)}
  .cp.ref{border-color:var(--ok);background:var(--ok-soft)}
  .cp.edu{border-color:var(--warn);background:var(--warn-soft)}

  .tblwrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:.875rem}
  th,td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--rule-2)}
  thead th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap;border-bottom:1px solid var(--rule)}
  thead th.sortable{cursor:pointer;user-select:none}
  thead th.sortable:hover{color:var(--ink)}
  thead th .arrow{opacity:.55;font-size:9px}
  tbody tr:last-child td{border-bottom:0}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  td.n{font-family:"IBM Plex Mono",monospace}
  tbody tr.tot td{background:var(--surface-2);font-weight:600;border-top:1px solid var(--rule)}
  tbody tr.click{cursor:pointer}
  tbody tr.click:hover{background:var(--surface-2)}
  tbody tr.sel{background:var(--accent-soft)}
  .barw{position:relative;height:8px;background:var(--surface-3);border-radius:2px;min-width:70px}
  .barf{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
  .bart{position:absolute;top:-2px;bottom:-2px;width:1.5px;background:var(--ink);opacity:.55}
  .stack{display:flex;height:9px;border-radius:2px;overflow:hidden;background:var(--surface-3);min-width:80px}
  .stack span{display:block;height:100%}
  .legend3{display:flex;gap:18px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--rule-2);
    font-size:.8rem;color:var(--muted)}
  .legend3 span{display:flex;align-items:center;gap:7px}
  .legend3 i{width:10px;height:10px;border-radius:2px;display:inline-block}

  .pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.05em;
    padding:2px 7px;border-radius:3px;font-weight:600;white-space:nowrap}
  .p-ok{background:var(--ok-soft);color:var(--ok)}
  .p-bad{background:var(--bad-soft);color:var(--bad)}
  .p-warn{background:var(--warn-soft);color:var(--warn)}
  .p-inert{background:var(--inert-soft);color:var(--inert)}
  .p-accent{background:var(--accent-soft);color:var(--accent)}
  .p-mock{background:var(--mark);color:var(--mark-ink)}
  .lowN{color:var(--muted);font-style:normal}

  .mtdgrid{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
  @media (max-width:540px){.mtdgrid{grid-template-columns:1fr;gap:16px}}
  .mtdnum{font-size:3rem;font-weight:600;letter-spacing:-.04em;line-height:.95;color:var(--accent);font-variant-numeric:tabular-nums}
  .mtdlab{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}
  .mtdrow{display:flex;justify-content:space-between;gap:14px;font-size:.85rem;padding:6px 0;border-bottom:1px solid var(--rule-2)}
  .mtdrow:last-child{border-bottom:0}
  .mtdrow b{font-family:"IBM Plex Mono",monospace}
  .mtdnote{margin:14px 0 0;font-size:.8rem;color:var(--muted);line-height:1.5}

  .mtrend{display:flex;align-items:flex-end;gap:9px;height:158px;position:relative}
  .mcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;justify-content:flex-end}
  .mbar{width:100%;max-width:46px;border-radius:2px 2px 0 0}
  .mval{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600}
  .mlab{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--muted);white-space:nowrap}
  .mn{font-family:"IBM Plex Mono",monospace;font-size:8.5px;color:var(--muted);opacity:.75}
  .tline{position:absolute;left:0;right:0;border-top:1px dashed var(--ink);opacity:.4}
  .tlineLab{position:absolute;right:0;font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--muted);transform:translateY(-14px)}

  .wlbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:13px 20px;border-bottom:1px solid var(--rule-2);background:var(--surface-2)}
  .wlbar input[type=text],.wlbar select,.wlbar input[type=number]{
    font-family:inherit;font-size:.83rem;padding:5px 9px;background:var(--surface);
    color:var(--ink);border:1px solid var(--rule);border-radius:4px}
  .wlbar input[type=text]{min-width:150px}
  .wlbar input[type=number]{width:78px}
  .wlbar label{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
  .wlclear{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:5px 12px;font-size:.83rem;color:var(--ink-2)}
  .wlclear:hover{border-color:var(--muted);color:var(--ink)}
  .wlcount{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
  .wlpager{display:flex;gap:9px;align-items:center;justify-content:center;padding:13px 20px;border-top:1px solid var(--rule-2)}
  .wlpager button{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:5px 12px;font-size:.83rem;color:var(--ink-2)}
  .wlpager button[disabled]{opacity:.35;cursor:default}
  .wlpager .pinfo{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
  td.det{font-size:.82rem;color:var(--ink-2);max-width:280px}
  td.tag{white-space:nowrap;min-width:250px;font-variant-numeric:tabular-nums}
  td.nw{white-space:nowrap}

<script>
(function(){
  "use strict";

  /* Snapshot, feed rules and live-feed settings live in optom-core.js,
     shared with the DA page (da/) and the KPI page (kpi/) so every page
     scores a customer the same way. A case is [clinic, DA, product, Y/N,
     deposit date, collection date, Zalo tag (child's name shortened to
     initials), data flags, marks per stage]. Marks are one bit string per
     stage, one bit per content item. */
  var DATA = ZSOP.DATA;

  var STAGES = DATA.stages, OFF = DATA.offsets, CAD = DATA.cad, CASES = DATA.cases;
  var PRODUCTS = ["MC","Kính","OK","Atropine"];
  var FLAGS = ["twokids","prodmismatch","setY","nstale","missingYN","badtag"];

  var TODAY = ZSOP.todayISO();     /* real calendar; ?asof=YYYY-MM-DD overrides */
  var START = ZSOP.START;          /* trackers went live July 2026; nothing earlier is scored */

  var TARGET = 80, MIN_N = 10, MIN_MISS = 20, PAGE = 10, MS = 86400000;

  /* ---------------- live feed ----------------

     the embedded snapshot with the trackers' current rows, falling back to
     the snapshot if the fetch fails. ?feed=<url> overrides the URL for testing. */
  var SNAPSHOT = DATA.cases;
  var feedState = { mode: "snapshot", at: DATA.generated || "", error: "" };

  var PW_HASH = "d53942c8e49f95569651edc09e700cc036cc347754caa01dfa482574a51dae6e";
  var lang="en", clinic="all", da="all", product="all", month="all", week="all", session=null;
  var wl = {q:"", clinic:"", da:"", prod:"", cad:"", status:"", minOd:"", maxOd:"",
            sort:"od", dir:-1, page:0};
  var fw = {type:"", page:0};

  function T(){ return L[lang]; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function pct(a,b){ return b ? Math.round(a/b*1000)/10 : 0; }

  /* ---------------- dates ---------------- */
  function addDays(iso, n){ return new Date(Date.parse(iso) + n*MS).toISOString().slice(0,10); }
  function mondayOf(iso){
    var d = new Date(Date.parse(iso));
    var wd = (d.getUTCDay() + 6) % 7;               /* Mon = 0 */
    return new Date(d.getTime() - wd*MS).toISOString().slice(0,10);
  }
  function monthLabel(k){ return T().months[+k.slice(5,7)-1] + " " + k.slice(0,4); }
  function weekLabel(k){
    var a = k, b = addDays(k, 6), t = T();
    var am = t.months[+a.slice(5,7)-1], bm = t.months[+b.slice(5,7)-1];
    var ad = +a.slice(8,10), bd = +b.slice(8,10);
    return am === bm ? ad + "–" + bd + " " + bm : ad + " " + am + "–" + bd + " " + bm;
  }

  /* ---------------- cadence per case ---------------- */
  function defs(c, si){ return CAD[c[2]][STAGES[si]] || null; }
  function dueDate(c, si){
    var anchor = OFF[si][0] === 0 ? c[4] : c[5];
    return anchor ? addDays(anchor, OFF[si][1]) : null;
  }
  /* Due dates are the END of each cadence's window (D6-7 closes on day 7,
     CD+3-5 on day 5). A cadence is scored from the day after its window
     closes, so an open window is never counted as missed. */
  function isDue(c, si){
    if(!defs(c, si)) return false;
    var d = dueDate(c, si);
    return !!d && d < TODAY && d >= START;
  }
  function daysOverdue(c, si){ return Math.round((Date.parse(TODAY) - Date.parse(dueDate(c,si))) / MS); }
  function cpAt(c, si, i){ return c[8][si].charAt(i) === "1"; }

  /* ---------------- scoring: 0 / 0.5 / 1 per cadence ---------------- */
  function cadencePoints(c, si){
    var bits = c[8][si], got = 0;
    for(var i=0;i<bits.length;i++) if(bits.charAt(i)==="1") got++;
    if(got === 0) return 0;
    return got === bits.length ? 1 : 0.5;
  }
  function daKey(c){ return c[0] + "│" + c[1]; }   /* clinic-scoped: names repeat across clinics */
  function daName(k){ return k.split("│")[1]; }
  function daClinic(k){ return k.split("│")[0]; }
  function caseKey(c){ return c[0] + "│" + c[6]; }
  function prodLabel(p){ return T().prod[p] || p; }

  /* ---------------- selection ---------------- */
  function inScope(c, o){
    if(o.clinic!=="all" && c[0]!==o.clinic) return false;
    if(o.da!=="all" && daKey(c)!==o.da) return false;
    if(o.product!=="all" && c[2]!==o.product) return false;
    return true;
  }
  function scope(over){
    var o = {clinic:clinic, da:da, product:product, month:month, week:week};
    if(over) Object.keys(over).forEach(function(k){ o[k]=over[k]; });
    return o;
  }
  /* Every cadence instance whose due date falls inside the selected period.
     Returns [case, stageIndex] pairs - the unit the score is built from. */
  function instances(over){
    var o = scope(over), out = [];
    CASES.forEach(function(c){
      if(!inScope(c, o)) return;
      for(var i=0;i<STAGES.length;i++){
        if(!isDue(c,i)) continue;
        var d = dueDate(c,i);
        if(o.month!=="all" && d.slice(0,7)!==o.month) continue;
        if(o.week!=="all" && mondayOf(d)!==o.week) continue;
        out.push([c,i]);
      }
    });
    return out;
  }
  function casesOf(inst){
    var seen = {}, out = [];
    inst.forEach(function(p){ var k=caseKey(p[0]); if(!seen[k]){ seen[k]=1; out.push(p[0]); } });
    return out;
  }
  function agg(inst){
    var pts = 0, full=0, part=0, miss=0;
    inst.forEach(function(p){ var v = cadencePoints(p[0], p[1]); pts += v;
      if(v===1) full++; else if(v===0.5) part++; else miss++; });
    return {n:casesOf(inst).length, pts:pts, due:inst.length, score:pct(pts, inst.length),

  }
  function MONTHS(){
    var s={}, o=[];
    instances({clinic:"all",da:"all",product:"all",month:"all",week:"all"}).forEach(function(p){
      var m = dueDate(p[0],p[1]).slice(0,7); if(!s[m]){ s[m]=1; o.push(m); } });
    return o.sort();
  }
  function WEEKS(m){
    var s={}, o=[];
    instances({clinic:"all",da:"all",product:"all",month:m,week:"all"}).forEach(function(p){
      var k = mondayOf(dueDate(p[0],p[1])); if(!s[k]){ s[k]=1; o.push(k); } });
    return o.sort();
  }
  function scoreColour(s){ return s>=TARGET ? "var(--ok)" : s>=70 ? "var(--warn)" : "var(--bad)"; }

  /* ---------------- data flags ----------------
     Flags are a live snapshot from the trackers, so they follow the
     clinic / DA / product filters but not the period. */
  function flaggedCases(over){
    var o = scope(over);
    return CASES.filter(function(c){ return c[7].length && inScope(c, o); });
  }
  function flagCounts(list){
    var n = {}; FLAGS.forEach(function(f){ n[f]=0; });
    list.forEach(function(c){ c[7].forEach(function(f){ n[f]++; }); });
    return n;
  }
  function flagTotal(n){ return FLAGS.reduce(function(s,f){ return s+n[f]; },0); }

  /* ---------------- worklist ----------------
     Scoped by the period a cadence FELL DUE, not by when the customer
     was tagged: a July customer's CD+30 falls due in August, and August
     is when it was missed. */
  function buildWorklist(inst){
    var rows = [];
    inst.forEach(function(p){
      var c = p[0], si = p[1], v = cadencePoints(c, si);
      if(v === 1) return;
      var d = defs(c, si), missing = [];
      for(var i=0;i<d.length;i++) if(!cpAt(c,si,i)) missing.push(d[i][0]);
      rows.push({
        patient:c[6], clinic:c[0], da:c[1], daK:daKey(c), prod:c[2],
        cadIdx:si, cad:STAGES[si],
        status:v===0 ? "missed" : "incomplete",
        missing:missing, allItems:d.map(function(x){ return x[0]; }),
        due:dueDate(c,si), od:daysOverdue(c,si)
      });
    });
    return rows;
  }
  function detailText(r){
    var t = T(), names = r.missing.map(function(k){ return t.cp[k] || k; });
    if(r.status === "missed")
      return t.allWord + " (" + r.allItems.map(function(k){ return t.cp[k]||k; }).join(", ") + ")";
    return names.join(", ");
  }
  function wlFilter(rows){
    var q = wl.q.trim().toLowerCase();
    return rows.filter(function(r){
      if(q && r.patient.toLowerCase().indexOf(q) === -1) return false;
      if(wl.clinic && r.clinic !== wl.clinic) return false;
      if(wl.da && r.daK !== wl.da) return false;
      if(wl.prod && r.prod !== wl.prod) return false;
      if(wl.cad && r.cad !== wl.cad) return false;
      if(wl.status && r.status !== wl.status) return false;
      if(wl.minOd !== "" && r.od < +wl.minOd) return false;
      if(wl.maxOd !== "" && r.od > +wl.maxOd) return false;
      return true;
    });
  }
  function wlSort(rows){
    var k = wl.sort, d = wl.dir;
    return rows.slice().sort(function(a,b){
      var x,y;
      if(k==="od"){ x=a.od; y=b.od; }
      else if(k==="cad"){ x=a.cadIdx; y=b.cadIdx; }
      else if(k==="due"){ x=Date.parse(a.due); y=Date.parse(b.due); }
      else { x=String(a[k]).toLowerCase(); y=String(b[k]).toLowerCase();
             return x<y ? -d : x>y ? d : 0; }
      return (x-y)*d;
    });
  }

  /* Feed rows -> cases (product from the tag prefix, modelled sent marks
     seeded per tag) is ZSOP.casesFromFeed in optom-core.js. */
  var feedUrl = ZSOP.feedUrl;
  function loadLive(){
    if(!feedUrl()) return Promise.resolve(false);
    feedState = { mode:"loading", at:"", error:"" }; renderFeed();
    return ZSOP.loadFeed()
      .then(function(f){
        CASES = f.cases;
        feedState = { mode:"live", at:f.generated, error:"" };
        return true;
      })
      .catch(function(err){
        CASES = SNAPSHOT;
        feedState = { mode:"failed", at:DATA.generated || "", error:String(err && err.message || err) };
        return false;
      });
  }
  function fmtWhen(iso){
    if(!iso) return "";
    var t = T(), d = new Date(iso);
    if(isNaN(d)) return iso;
    var day = d.getDate() + " " + t.months[d.getMonth()];
    return iso.length > 10 ? day + " " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0") : day;
  }
  function renderFeed(){
    var t = T(), el = document.getElementById("feed"), m = feedState.mode;
    if(!feedUrl() && m !== "live"){ el.className = "feed"; el.innerHTML = '<i></i>' + esc(t.feedSnap) + ' ' + esc(fmtWhen(feedState.at)); return; }
    el.className = "feed " + m;
    el.innerHTML = '<i></i>' + esc(m === "live" ? t.feedLive + " " + fmtWhen(feedState.at)
      : m === "loading" ? t.feedLoading
      : t.feedFailed + " " + fmtWhen(feedState.at));
    if(m === "failed") el.title = feedState.error;
  }

      heroLine:function(p,d,n){return "<b>"+p+"</b> points earned from <b>"+d+"</b> cadences due, across <b>"+n+"</b> customers. Each cadence scores 1 when every item in the CRM form was sent, 0.5 when something went out but not all of it, and 0 when nothing did.";},

  /* ---------------- crypto ---------------- */
  function utf8(str){var o="",i,c;for(i=0;i<str.length;i++){c=str.charCodeAt(i);
    if(c<128)o+=String.fromCharCode(c);else if(c<2048)o+=String.fromCharCode(192|(c>>6),128|(c&63));
    else o+=String.fromCharCode(224|(c>>12),128|((c>>6)&63),128|(c&63));}return o;}
  function sha256sync(a){function rr(v,x){return(v>>>x)|(v<<(32-x));}
    var mm=Math.pow,mp=mm(2,32),i,j,res="",w=[],bl=a.length*8,h=sha256sync.h,k=sha256sync.k;
    if(!h){h=sha256sync.h=[];k=sha256sync.k=[];var n=0,ic={};
      for(var cd=2;n<64;cd++){if(!ic[cd]){for(i=0;i<313;i+=cd)ic[i]=cd;
        h[n]=(mm(cd,.5)*mp)|0;k[n++]=(mm(cd,1/3)*mp)|0;}}h=h.slice(0,8);sha256sync.h=h;}
    a+="\x80";while(a.length%64-56)a+="\x00";
    for(i=0;i<a.length;i++){j=a.charCodeAt(i);if(j>>8)return null;w[i>>2]|=j<<((3-i)%4)*8;}
    w[w.length]=(bl/mp)|0;w[w.length]=bl;var H=h.slice(0);
    for(j=0;j<w.length;){var ww=w.slice(j,j+=16),old=H.slice(0);
      for(i=0;i<64;i++){var w15=ww[i-15],w2=ww[i-2],A=H[0],E=H[4];
        var t1=H[7]+(rr(E,6)^rr(E,11)^rr(E,25))+((E&H[5])^((~E)&H[6]))+k[i]
          +(ww[i]=(i<16)?ww[i]:(ww[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+ww[i-7]
            +(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
        var t2=(rr(A,2)^rr(A,13)^rr(A,22))+((A&H[1])^(A&H[2])^(H[1]&H[2]));
        H=[(t1+t2)|0].concat(H);H[4]=(H[4]+t1)|0;H.length=8;}
      for(i=0;i<8;i++)H[i]=(H[i]+old[i])|0;}
    for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(H[i]>>(j*8))&255;res+=((b<16)?"0":"")+b.toString(16);}
    return res;}
  function sha256(t){if(window.crypto&&crypto.subtle&&window.isSecureContext){try{
      return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){
        return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,"0")}).join("");
      }).catch(function(){return sha256sync(utf8(t))});}catch(e){}}
    return Promise.resolve(sha256sync(utf8(t)));}

  /* ================= filter bars ================= */
  function bar(id, items, active, onPick){
    var el = document.getElementById(id), h = "";
    items.forEach(function(it){
      h += '<button data-k="'+esc(it.k)+'" aria-pressed="'+(active===it.k)+'"'
        + (it.n===0 && it.k!==active && !it.keep ? " disabled" : "") + '>' + it.label
        + (it.n===null ? "" : ' <span class="cn">'+it.n+'</span>') + '</button>';
    });
    el.innerHTML = h;
    el.querySelectorAll("button").forEach(function(b){
      b.onclick = function(){ onPick(b.dataset.k); };
    });
  }
  function buildFilters(){
    var t = T();

    /* The live month is always listed even when empty, and always carries the
       MTD tag, so a partial month is never silently compared with a full one. */
    var cur = TODAY.slice(0,7), mlist = MONTHS();
    if(mlist.indexOf(cur) === -1) mlist = mlist.concat([cur]).sort();
    bar("monthbar",
      [{k:"all", label:esc(t.allm), n:instances({month:"all",week:"all"}).length}]
        .concat(mlist.map(function(m){
          return {k:m, keep:(m===cur), n:instances({month:m,week:"all"}).length,
                  label:esc(monthLabel(m)) + (m===cur
                    ? ' <span class="mtdtag">'+esc(t.mtd)+'</span>' : "")};
        })),
      month,
      function(k){ month = k; week = "all"; wl.page = 0; buildFilters(); render(); });

    var wEl = document.getElementById("weekbar");
    if(month === "all"){ wEl.innerHTML = ""; }
    else {
      bar("weekbar",
        [{k:"all", label:esc(t.allw), n:instances({week:"all"}).length}]
          .concat(WEEKS(month).map(function(w){
            return {k:w, label:esc(weekLabel(w)), n:instances({week:w}).length};
          })),
        week,
        function(k){ week = k; wl.page = 0; buildFilters(); render(); });
    }

    var clinics = {}; CASES.forEach(function(c){ clinics[c[0]] = 1; });
    bar("clinicbar",
      [{k:"all", label:esc(t.allc), n:instances({clinic:"all",da:"all"}).length}]
        .concat(Object.keys(clinics).sort().map(function(cl){
          return {k:cl, label:esc(cl), n:instances({clinic:cl,da:"all"}).length};
        })),
      clinic,
      function(k){ clinic = k; da = "all"; wl.page = 0; fw.page = 0; buildFilters(); render(); });

    var dEl = document.getElementById("dabar");
    if(clinic === "all"){ dEl.innerHTML = ""; }
    else {
      var das = {};
      CASES.forEach(function(c){ if(c[0]===clinic) das[daKey(c)] = 1; });
      bar("dabar",
        [{k:"all", label:esc(t.alld), n:instances({da:"all"}).length}]
          .concat(Object.keys(das).sort().map(function(k){
            return {k:k, label:esc(daName(k)), n:instances({da:k}).length};
          })),
        da,
        function(k){ da = k; wl.page = 0; fw.page = 0; buildFilters(); render(); });
    }

    bar("prodbar",
      [{k:"all", label:esc(t.allp), n:instances({product:"all"}).length}]
        .concat(PRODUCTS.map(function(p){
          return {k:p, label:esc(prodLabel(p)), n:instances({product:p}).length};
        })),
      product,
      function(k){ product = k; wl.page = 0; fw.page = 0; buildFilters(); render(); });
  }
  function scopeText(){
    var t = T(), bits = [];
    bits.push(clinic === "all" ? esc(t.allc) : '<b>'+esc(clinic)+'</b>');
    if(da !== "all") bits.push('<b>'+esc(daName(da))+'</b>');
    if(product !== "all") bits.push('<b>'+esc(prodLabel(product))+'</b>');
    bits.push(month === "all" ? esc(t.allmLong)
      : '<b>'+esc(monthLabel(month))+'</b> '+esc(t.dueWord2));
    if(week !== "all") bits.push('<b>'+esc(weekLabel(week))+'</b>');
    return esc(t.viewing) + " " + bits.join(" &middot; ");
  }

  function render(){
    var t = T();
    document.getElementById("pgTitle").textContent = t.title;
    document.getElementById("pgSub").textContent = t.sub;
    document.getElementById("asOf").textContent = t.asOf + " " + TODAY;
    document.body.className = lang === "zh" ? "lang-zh" : "";
    document.getElementById("scopebar").innerHTML = scopeText();

    var inst = instances(), a = agg(inst), h = "";
    var tracked = CASES.filter(function(c){ return inScope(c, scope()); }).length;
    /* Flags are a live snapshot, so they only belong on the live month. */
    var live = (month === TODAY.slice(0,7));

    /* No cadences at all in the selected period - say so plainly rather than
       rendering a screen of zeros and dashes. Flags still show: they are
       not period-scoped. */
    if(!inst.length){
      document.getElementById("app").innerHTML =
        '<div class="panel"><div class="empty"><div style="font-size:1.05rem;color:var(--ink-2);margin-bottom:8px">'
        + esc(t.noCases)+'</div><div>'+esc(t.noCasesHint)+'</div></div></div>'
        + (live ? renderFlags(inst) : "");
      wireApp();
      renderWho();
      return;
    }

    /* hero */
    h += '<div class="herorow"><div class="hero"><div class="heroTop"><div>'
      + '<div class="bignum" style="color:'+(a.due<MIN_N?'var(--muted)':scoreColour(a.score))+'">'
      + (a.due<MIN_N ? '—' : a.score+'<span style="font-size:1.35rem">%</span>')+'</div>'
      + '<div class="biglab">'+esc(t.sopScore)+'</div></div><div>'
      + '<p class="sideline">'+t.heroLine(Math.round(a.pts*10)/10, a.due, a.n)+'</p>'
      + '<div class="gauge"><div class="gfill" style="width:'+(a.due<MIN_N?0:Math.max(a.score,1))
      + '%;background:'+scoreColour(a.score)+'"></div>'
      + '<div class="gtarget" style="left:'+TARGET+'%"></div>'
      + '<div class="gtlab" style="left:'+TARGET+'%">'+esc(t.target)+' '+TARGET+'%</div></div>'
      + '<div class="glegend"><span>'+esc(t.coverage
            .split("{a}").join(a.n).split("{b}").join(tracked))+'</span>'
      + '<span>'+esc(t.lDue)+' <b>'+a.due+'</b></span>'
      + '</div></div></div></div>';

    /* cadence breakdown, shared by several panels */
    var byCad = STAGES.map(function(){ return []; });
    inst.forEach(function(p){ byCad[p[1]].push(p[0]); });
    var cad = STAGES.map(function(label, si){
      var due=0, full=0, part=0, miss=0, perCp = {}, cpOrder = [];
      byCad[si].forEach(function(c){
        due++;
        var d = defs(c, si), got = 0;
        for(var i=0;i<d.length;i++){
          var k = d[i][0];
          if(perCp[k] === undefined){ perCp[k] = {n:0, got:0, tag:d[i][1]}; cpOrder.push(k); }
          perCp[k].n++;
          if(cpAt(c,si,i)){ got++; perCp[k].got++; }
        }
        if(got === d.length) full++; else if(got > 0) part++; else miss++;
      });
      return {label:label, idx:si, due:due, full:full, part:part, miss:miss,
              perCp:perCp, cpOrder:cpOrder,
              score: due ? pct(full + part*0.5, due) : 0,
              rate: pct(miss, due)};
    });
    var missTot=0, dueTot=0;
    cad.forEach(function(x){ missTot += x.miss; dueTot += x.due; });
    /* Why a stage shows no score: not in any selected product's cadence,
       nothing has reached it yet, or nothing fell due in this period. */
    var everDue = STAGES.map(function(){ return 0; });
    instances({month:"all",week:"all"}).forEach(function(p){ everDue[p[1]]++; });
    var applicable = STAGES.map(function(st){
      return PRODUCTS.some(function(p){ return (product==="all" || product===p) && !!CAD[p][st]; }); });
    function emptyWhy(si){
      return !applicable[si] ? t.notInCad : (!everDue[si] ? t.notDue : t.noneInPeriod);
    }

    var worst = cad.filter(function(x){ return x.miss>0; })
                   .slice().sort(function(p,q){ return q.miss-p.miss; }).slice(0,3);
    h += '<div class="flagcard"><div><div class="fnum">'+missTot+'</div>'
      + '<div class="flab">'+esc(t.missTitle)+'</div></div><p>'+esc(t.missDesc)+'</p><div class="flist">'
      + '<div class="fr"><span>'+esc(t.missOfDue)+'</span><span class="fv">'
      + pct(missTot,dueTot)+'% ('+missTot+' / '+dueTot+')</span></div>';
    if(missTot >= MIN_MISS){
      h += '<div class="fr" style="border-bottom:0;padding-bottom:0"><span style="opacity:.75">'
        + esc(t.worstBy)+'</span><span></span></div>';
      worst.forEach(function(x){
        h += '<div class="fr"><span>'+esc(x.label)+'</span><span class="fv">'
          + x.miss+' &middot; '+pct(x.miss, missTot)+'%</span></div>';
      });
    }
    h += '</div></div></div>';

    /* Where the misses actually are - stated, not left to be inferred. */
    if(missTot >= MIN_MISS){
      var ranked = cad.filter(function(x){ return x.miss>0; })
                      .slice().sort(function(p,q){ return q.miss-p.miss; });
      var top2 = ranked.slice(0,2);
      var share = pct(top2.reduce(function(s,x){ return s+x.miss; },0), missTot);
      h += '<div class="probstate"><span class="pslab">'+esc(t.problem)+'</span>'
        + '<span class="pstext">'+esc(t.problemTxt
            .split("{s}").join(share)
            .split("{c}").join(top2.map(function(x){ return x.label; }).join(" + "))
            .split("{d}").join(top2.map(function(x){
              return x.label+" "+pct(x.miss,missTot)+"%"; }).join(", ")))+'</span></div>';
    }

    /* provenance */
    h += '<div class="note"><p>'+t.note.split("{src}").join(feedState.mode === "live"
      ? t.srcLive.split("{t}").join(fmtWhen(feedState.at))
      : t.srcSnap.split("{t}").join(fmtWhen(feedState.at)))+'</p></div>';

    /* data flags */
    if(live) h += renderFlags(inst);

    /* MTD + by month */
    var curM = TODAY.slice(0,7), curDay = +TODAY.slice(8,10), ms = MONTHS();
    var i0 = ms.indexOf(curM), prevM = i0 > 0 ? ms[i0-1] : (i0 === -1 && ms.length ? ms[ms.length-1] : null);
    var mtdA = agg(instances({month:curM, week:"all"}));
    var prevFullA = prevM ? agg(instances({month:prevM, week:"all"})) : null;
    var prevSameA = prevM ? agg(instances({month:prevM, week:"all"})
                    .filter(function(p){ return +dueDate(p[0],p[1]).slice(8,10) <= curDay; })) : null;
    /* A delta needs a real score on both sides. With too few cadences in
       either period the comparison is noise, so suppress it. */
    var delta = (prevSameA && prevSameA.due >= MIN_N && mtdA.due >= MIN_N)
      ? Math.round((mtdA.score - prevSameA.score)*10)/10 : null;

    h += '<div class="grid2" style="margin-bottom:18px">';
    h += '<div class="panel" style="margin:0"><h3><span>'+esc(t.pMtd)+'</span>'
      + '<span class="hint">'+esc(monthLabel(curM))+' &middot; 1–'+curDay+'</span></h3>'
      + '<div class="pad"><div class="mtdgrid"><div>'
      + '<div class="mtdnum" style="color:'+(mtdA.due<MIN_N?'var(--muted)':scoreColour(mtdA.score))+'">'
      + (mtdA.due>=MIN_N ? mtdA.score+'<span style="font-size:1.15rem">%</span>' : '—')+'</div>'
      + '<div class="mtdlab">'+esc(t.sopScore)+'</div></div><div>'
      + '<div class="mtdrow"><span>'+esc(t.lDue)+'</span><b>'+mtdA.due+'</b></div>'
      + '<div class="mtdrow"><span>'+esc(t.thCases)+'</span><b>'+mtdA.n+'</b></div>';
    if(delta !== null)
      h += '<div class="mtdrow"><span>'+esc(t.vsPrev)+'</span><b style="color:'
        + (delta>=0?'var(--ok)':'var(--bad)')+'">'+(delta>=0?'▲ +':'▼ ')+delta+'%</b></div>';
    if(prevFullA && prevFullA.due)
      h += '<div class="mtdrow"><span>'+esc(t.prevFull)+'</span><b>'+prevFullA.score+'%</b></div>';
    h += '</div></div>';
    if(delta !== null)
      h += '<p class="mtdnote">'+esc(t.mtdNote
            .split("{a}").join(monthLabel(curM))
            .split("{b}").join(monthLabel(prevM))
            .split("{d}").join(curDay))+'</p>';
    h += '</div></div>';

    h += '<div class="panel" style="margin:0"><h3><span>'+esc(t.pMonth)+'</span>'
      + '<span class="hint">'+esc(t.pMonthH)+'</span></h3><div class="pad"><div class="mtrend">'
      + '<div class="tline" style="bottom:'+(TARGET/100*120)+'px"></div>'
      + '<div class="tlineLab" style="bottom:'+(TARGET/100*120)+'px">'+esc(t.target)+' '+TARGET+'%</div>';
    (ms.indexOf(curM) === -1 ? ms.concat([curM]) : ms).forEach(function(k){
      var g = agg(instances({month:k, week:"all"})), cur = k===curM;
      h += '<div class="mcol"><span class="mval"'+(cur?' style="color:var(--accent)"':'')+'>'
        + (g.due ? (g.due<MIN_N ? '—' : g.score+'%') : '—')+'</span>'
        + '<div class="mbar" style="height:'+(g.due?Math.max(Math.round(g.score/100*120),3):3)
        + 'px;background:'+(g.due?scoreColour(g.score):'var(--surface-3)')+'"></div>'
        + '<span class="mlab"'+(cur?' style="color:var(--accent);font-weight:600"':'')+'>'
        + esc(monthLabel(k).split(" ")[0])+'</span><span class="mn">'+g.due+'</span></div>';
    });
    h += '</div></div></div></div>';

    /* ---------- cadences: one panel, one row, one number ---------- */
    h += '<div class="panel"><h3><span>'+esc(t.pLadder)+'</span><span class="hint">'
      + esc(month==="all" ? t.pLadderH : t.duePeriodNote.split("{m}").join(monthLabel(month)))
      + '</span></h3>';

    /* the drop-off, as a shape rather than a column of numbers */
    h += '<div class="pad decaywrap" style="border-bottom:1px solid var(--rule-2)"><div class="decay">';
    cad.forEach(function(x){
      var hgt = x.due ? Math.max(Math.round(x.score/100*104), 3) : 3;
      h += '<div class="dcol"><span class="dval">'+(x.due ? (x.due<MIN_N?'—':Math.round(x.score)+'%') : '—')+'</span>'
        + '<div class="dbar" style="height:'+hgt+'px;background:'+(x.due?scoreColour(x.score):'var(--surface-3)')+'"></div>'
        + '<span class="dlab">'+esc(x.label)+'</span></div>';
    });
    h += '</div></div>';

    cad.forEach(function(x){
      h += '<div class="tp"><div class="tphead">'
        + '<span class="tpname">'+esc(x.label)+'<span class="ph">'+esc(t.phase[x.idx])
        + (x.due ? ' · '+x.due+' '+esc(t.dueWord) : '')+'</span></span>'
        + '<div class="tptrack">';
      if(x.due){
        [['full',x.full,'var(--ok)'],['part',x.part,'var(--warn)'],['miss',x.miss,'var(--bad)']]
          .forEach(function(seg){
            var w = pct(seg[1], x.due);
            h += '<div class="tpseg" style="width:'+w+'%;background:'+seg[2]+'">'
              + (w >= 9 ? '<span>'+seg[1]+'</span>' : '')+'</div>';
          });
      }
      h += '</div><span class="tpnums">'
        + (x.due ? '<b style="color:'+(x.due<MIN_N?'var(--muted)':scoreColour(x.score))+'">'
                   + (x.due<MIN_N?'—':Math.round(x.score)+'%')+'</b>'
                 : '<span style="color:var(--muted)">'+esc(emptyWhy(x.idx))+'</span>')
        + '</span></div>';
      if(x.due){
        /* Content items differ by product, so each chip carries the
           number of cadences it applied to. */
        h += '<div class="cps">';
        x.cpOrder.forEach(function(k){
          var q = x.perCp[k];
          h += '<span class="cp'+(q.tag?' '+q.tag:'')+'">'+esc(t.cp[k]||k)
            + ' <span class="pcv">'+pct(q.got,q.n)+'%</span>'
            + (q.n !== x.due ? '<span class="pp">/'+q.n+'</span>' : '')+'</span>';
        });
        h += '</div>';
      }
      h += '</div>';
    });
    h += '<div class="legend3">'
      + '<span><i style="background:var(--ok)"></i>'+esc(t.thFull)+'</span>'
      + '<span><i style="background:var(--warn)"></i>'+esc(t.thPartial)+'</span>'
      + '<span><i style="background:var(--bad)"></i>'+esc(t.thMissed)+'</span></div></div>';

    /* ---------- by product ---------- */
    var byP = {};
    inst.forEach(function(p){ (byP[p[0][2]] = byP[p[0][2]] || []).push(p); });
    h += '<div class="panel"><h3><span>'+esc(t.pProd)+'</span><span class="hint">'+esc(t.pProdH)+'</span></h3>'
      + '<div class="tblwrap"><table><thead><tr><th>'+esc(t.thProd)+'</th>'
      + '<th class="n">'+esc(t.thScore)+'</th><th style="width:22%"></th>'
      + '<th class="n">'+esc(t.thDueN)+'</th><th class="n">'+esc(t.thCases)+'</th>'
      + '<th class="n">'+esc(t.thFull)+'</th><th class="n">'+esc(t.thPartial)+'</th><th class="n">'+esc(t.thMissed)+'</th>'
      + '<th style="width:16%"></th></tr></thead><tbody>';
    PRODUCTS.forEach(function(p){
      var g = byP[p] ? agg(byP[p]) : null;
      if(!g){
        h += '<tr class="click'+(product===p?' sel':'')+'" data-prod="'+esc(p)+'"><td><b>'+esc(prodLabel(p))+'</b></td>'
          + '<td class="n"><span class="lowN">—</span></td><td></td><td class="n"><span class="lowN">0</span></td>'
          + '<td class="n"><span class="lowN">0</span></td><td class="n"></td><td class="n"></td><td class="n"></td><td></td></tr>';
        return;
      }
      h += '<tr class="click'+(product===p?' sel':'')+'" data-prod="'+esc(p)+'"><td><b>'+esc(prodLabel(p))+'</b></td>'
        + '<td class="n" style="color:'+scoreColour(g.score)+'">'+(g.due<MIN_N?'<span class="lowN">—</span>':g.score+'%')+'</td>'
        + '<td><div class="barw"><div class="barf" style="width:'+Math.max(g.score,1)+'%;background:'
        + scoreColour(g.score)+'"></div><div class="bart" style="left:'+TARGET+'%"></div></div></td>'
        + '<td class="n">'+g.due+'</td><td class="n">'+g.n+'</td>'
        + '<td class="n">'+g.full+'</td><td class="n">'+g.part+'</td><td class="n">'+g.miss+'</td>'
        + '<td><div class="stack"><span style="width:'+pct(g.full,g.due)+'%;background:var(--ok)"></span>'
        + '<span style="width:'+pct(g.part,g.due)+'%;background:var(--warn)"></span>'
        + '<span style="width:'+pct(g.miss,g.due)+'%;background:var(--bad)"></span></div></td></tr>';
    });
    h += '<tr class="tot"><td>'+esc(t.thTot)+'</td><td class="n">'+a.score+'%</td><td></td>'
      + '<td class="n">'+a.due+'</td><td class="n">'+a.n+'</td>'
      + '<td class="n">'+a.full+'</td><td class="n">'+a.part+'</td><td class="n">'+a.miss+'</td><td></td></tr>'
      + '</tbody></table></div></div>';

    /* ---------- worklist ---------- */
    h += renderWorklist(inst);

    /* ---------- by clinic + by DA ---------- */
    var byC = {};
    inst.forEach(function(p){ (byC[p[0][0]] = byC[p[0][0]] || []).push(p); });
    var crows = Object.keys(byC).map(function(k){ var g = agg(byC[k]);
      var fl = flagTotal(flagCounts(flaggedCases({clinic:k,da:"all"})));
      return {k:k, score:g.score, n:g.n, due:g.due, flags:fl}; })
      .sort(function(x,y){ return y.score - x.score; });
    var med = (function(v){ v=v.slice().sort(function(p,q){return p-q;});
      return v.length ? v[Math.floor(v.length/2)] : 0; })(crows.map(function(x){return x.score;}));

    h += '<div class="grid2">';
    h += '<div class="panel" style="margin:0"><h3><span>'+esc(t.pClinic)+'</span>'
      + '<span class="hint">'+esc(t.pClinicH)+'</span></h3><div class="tblwrap"><table><thead><tr>'
      + '<th>'+esc(t.thClinic)+'</th><th class="n">'+esc(t.thScore)+'</th>'
      + '<th style="width:26%"></th><th class="n">'+esc(t.thDueN)+'</th><th class="n">'+esc(t.thCases)+'</th>'
      + (live ? '<th class="n">'+esc(t.thFlags)+'</th>' : '')+'</tr></thead><tbody>';
    crows.forEach(function(r){
      var outlier = r.due>=MIN_N && (med - r.score) >= 20;
      h += '<tr class="click'+(clinic===r.k?' sel':'')+'" data-clinic="'+esc(r.k)+'">'
        + '<td><b>'+esc(r.k)+'</b>'+(outlier?' <span class="pill p-bad">'+esc(t.outlier)+'</span>':'')+'</td>'
        + '<td class="n" style="color:'+scoreColour(r.score)+'">'
        + (r.due<MIN_N ? '<span class="lowN">—</span>' : r.score+'%')+'</td>'
        + '<td><div class="barw"><div class="barf" style="width:'+Math.max(r.score,1)+'%;background:'
        + scoreColour(r.score)+'"></div><div class="bart" style="left:'+TARGET+'%"></div></div></td>'
        + '<td class="n">'+r.due+'</td><td class="n">'+r.n+'</td>'
        + (live ? '<td class="n"><span class="pill '+(r.flags>20?'p-bad':r.flags?'p-warn':'p-ok')+'">'+r.flags+'</span></td>' : '')+'</tr>';
    });
    h += '<tr class="tot"><td>'+esc(t.thTot)+'</td><td class="n">'+a.score+'%</td>'
      + '<td></td><td class="n">'+a.due+'</td><td class="n">'+a.n+'</td>'
      + (live ? '<td class="n">'+crows.reduce(function(s,r){ return s+r.flags; },0)+'</td>' : '')+'</tr></tbody></table></div></div>';

    var byD = {};
    inst.forEach(function(p){ var k=daKey(p[0]); (byD[k] = byD[k] || []).push(p); });
    var drows = Object.keys(byD).map(function(k){ var g = agg(byD[k]);
      var fl = flagTotal(flagCounts(flaggedCases({clinic:daClinic(k),da:k})));
      return {k:k, name:daName(k), clinic:daClinic(k), score:g.score, n:g.n, due:g.due, flags:fl}; })
      .sort(function(x,y){ return y.score - x.score || y.due - x.due; });
    h += '<div class="panel" style="margin:0"><h3><span>'+esc(t.pReps)+'</span><span class="hint">'+esc(t.pRepsH)+'</span></h3>'
      + '<div class="tblwrap"><table><thead><tr><th>'+esc(t.thRep)+'</th><th>'+esc(t.thClinic)+'</th>'
      + '<th class="n">'+esc(t.thScore)+'</th><th style="width:22%"></th>'
      + '<th class="n">'+esc(t.thDueN)+'</th><th class="n">'+esc(t.thCases)+'</th>'
      + (live ? '<th class="n">'+esc(t.thFlags)+'</th>' : '')+'</tr></thead><tbody>';
    drows.forEach(function(r){
      h += '<tr class="click'+(da===r.k?' sel':'')+'" data-da="'+esc(r.k)+'">'
        + '<td>'+esc(r.name)+'</td><td style="color:var(--muted)">'+esc(r.clinic)+'</td>'
        + '<td class="n" style="color:'+scoreColour(r.score)+'">'
        + (r.due<MIN_N ? '<span class="lowN">—</span>' : r.score+'%')+'</td>'
        + '<td><div class="barw"><div class="barf" style="width:'+Math.max(r.score,1)+'%;background:'
        + scoreColour(r.score)+'"></div><div class="bart" style="left:'+TARGET+'%"></div></div></td>'
        + '<td class="n">'+r.due+'</td><td class="n">'+r.n+'</td>'
        + (live ? '<td class="n"><span class="pill '+(r.flags>20?'p-bad':r.flags?'p-warn':'p-ok')+'">'+r.flags+'</span></td>' : '')+'</tr>';
    });
    h += '</tbody></table></div></div></div>';

    document.getElementById("app").innerHTML = h;
    wireApp();
    renderWho();
  }

  /* ================= data flags ================= */
  function renderFlags(inst){
    var t = T();
    var flagged = flaggedCases(), counts = flagCounts(flagged), total = flagTotal(counts);
    var tracked = CASES.filter(function(c){ return inScope(c, scope()); }).length;
    /* flagged customers that also have a cadence due in the period: those
       flags are actively hiding work right now */
    var dueKeys = {}; inst.forEach(function(p){ dueKeys[caseKey(p[0])] = 1; });
    var blocking = flagged.filter(function(c){ return dueKeys[caseKey(c)]; }).length;

    var h = '<div class="panel"><h3><span>'+esc(t.pFlags)+'</span><span class="hint">'+esc(t.pFlagsH)+'</span></h3>'
      + '<div class="fgrid"><div class="fleft">'
      + '<div class="fnum">'+total+'</div><div class="flab">'+esc(t.flagsWord)+' &middot; '
      + esc(t.onCust.split("{n}").join(flagged.length).split("{p}").join(pct(flagged.length, tracked)))+'</div>'
      + '<p>'+esc(t.flagLede)+'</p><div style="margin-top:12px">';
    FLAGS.forEach(function(f){
      if(!counts[f]) return;
      h += '<div class="ftype'+(fw.type===f?' on':'')+'" data-ftype="'+f+'">'
        + '<span class="fk">'+esc(t.fl[f])+'</span><span class="fv">'+counts[f]+'</span>'
        + '<span class="fx">'+esc(t.fx[f])+'</span></div>';
    });
    if(!total) h += '<div class="ftype"><span class="fk" style="color:var(--ok)">0</span></div>';
    h += '</div></div><div class="fright">';

    /* by clinic / DA */
    var groups = {};
    flagged.forEach(function(c){ var k = daKey(c);
      if(!groups[k]) groups[k] = {clinic:c[0], da:c[1], cust:0, flags:0};
      groups[k].cust++; groups[k].flags += c[7].length; });
    var trackedBy = {};
    CASES.forEach(function(c){ if(inScope(c, scope())) trackedBy[daKey(c)] = (trackedBy[daKey(c)]||0)+1; });
    var grows = Object.keys(groups).map(function(k){ return groups[k]; })
      .sort(function(x,y){ return y.flags - x.flags; });
    h += '<div class="tblwrap"><table><thead><tr><th>'+esc(t.thClinic)+'</th><th>'+esc(t.thRep)+'</th>'
      + '<th class="n">'+esc(t.thFlags)+'</th><th class="n">'+esc(t.thFlagged)+' '+esc(t.thCust).toLowerCase()+'</th>'
      + '<th class="n">'+esc(t.thShare)+'</th></tr></thead><tbody>';
    grows.forEach(function(g){
      var k = g.clinic + "│" + g.da;
      h += '<tr><td><b>'+esc(g.clinic)+'</b></td><td>'+esc(g.da)+'</td><td class="n">'+g.flags+'</td>'
        + '<td class="n">'+g.cust+' <span style="color:var(--muted)">/ '+(trackedBy[k]||0)+'</span></td>'
        + '<td class="n">'+pct(g.cust, trackedBy[k]||0)+'%</td></tr>';
    });
    if(!grows.length) h += '<tr><td colspan="5" class="empty">'+esc(t.wlEmpty)+'</td></tr>';
    h += '</tbody></table></div>';

    h += '<div class="blocknote"><span style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--bad);font-weight:600">'
      + esc(t.blocking)+'</span><span>'+t.blockingTxt.split("{n}").join('<b>'+blocking+'</b>')+'</span></div>';

    /* flag worklist */
    var rows = flagged.filter(function(c){ return !fw.type || c[7].indexOf(fw.type) !== -1; })
      .map(function(c){ return c; })
      .sort(function(x,y){ return y[7].length - x[7].length || (x[6] < y[6] ? -1 : 1); });
    var pages = Math.max(1, Math.ceil(rows.length / PAGE));
    if(fw.page >= pages) fw.page = pages - 1;
    var view = rows.slice(fw.page*PAGE, fw.page*PAGE + PAGE);

    h += '<div class="chips"><button data-ftype="" aria-pressed="'+(fw.type==="")+'">'+esc(t.allTypes)+' <span class="cn">'+total+'</span></button>';
    FLAGS.forEach(function(f){
      if(!counts[f]) return;
      h += '<button data-ftype="'+f+'" aria-pressed="'+(fw.type===f)+'">'+esc(t.fl[f])+' <span class="cn">'+counts[f]+'</span></button>';
    });
    h += '<span class="wlcount">'+esc(t.wlShowing.split("{a}").join(rows.length).split("{b}").join(flagged.length))+'</span></div>';

    if(rows.length){
      h += '<div class="tblwrap"><table><thead><tr><th>'+esc(t.thPatient)+'</th><th>'+esc(t.thClinic)+'</th>'
        + '<th>'+esc(t.thRep)+'</th><th>'+esc(t.thProd)+'</th><th>'+esc(t.thFlag)+'</th><th>'+esc(t.thFix)+'</th></tr></thead><tbody>';
      view.forEach(function(c){
        h += '<tr><td class="tag">'+esc(c[6])+'</td><td class="nw">'+esc(c[0])+'</td><td class="nw">'+esc(c[1])+'</td>'
          + '<td>'+esc(prodLabel(c[2]))+'</td><td>'
          + c[7].map(function(f){ return '<span class="pill p-warn">'+esc(t.fl[f])+'</span>'; }).join(' ')
          + '</td><td class="fix">'+c[7].map(function(f){ return esc(t.fx[f]); }).join(' ')+'</td></tr>';
      });
      h += '</tbody></table></div>';
      if(pages > 1){
        h += '<div class="wlpager">'
          + '<button id="fwprev"'+(fw.page===0?" disabled":"")+'>'+esc(t.prev)+'</button>'
          + '<span class="pinfo">'+esc(t.pageOf.split("{a}").join(fw.page+1).split("{b}").join(pages))+'</span>'
          + '<button id="fwnext"'+(fw.page>=pages-1?" disabled":"")+'>'+esc(t.next)+'</button></div>';
      }
    } else {
      h += '<div class="empty">'+esc(t.wlEmpty)+'</div>';
    }
    return h + '</div></div></div>';
  }

  /* ================= worklist ================= */
  function renderWorklist(inst){
    var t = T();
    var all = buildWorklist(inst);
    var rows = wlSort(wlFilter(all));
    var pages = Math.max(1, Math.ceil(rows.length / PAGE));
    if(wl.page >= pages) wl.page = pages - 1;
    var view = rows.slice(wl.page*PAGE, wl.page*PAGE + PAGE);

    var clinics = {}, das = {}, prods = {};
    all.forEach(function(r){ clinics[r.clinic]=1; das[r.daK]=r.da; prods[r.prod]=1; });

    function opt(v, label, cur){
      return '<option value="'+esc(v)+'"'+(cur===v?' selected':'')+'>'+esc(label)+'</option>';
    }
    function sortable(key, label, cls){
      var on = wl.sort===key;
      return '<th class="sortable'+(cls?' '+cls:'')+'" data-sort="'+key+'">'+esc(label)
        + (on ? ' <span class="arrow">'+(wl.dir>0?'▲':'▼')+'</span>' : '')+'</th>';
    }

    var scopeNote = (month === "all")
      ? t.wlDueAll
      : t.wlDueIn.split("{m}").join(monthLabel(month) + (week!=="all" ? ", "+weekLabel(week) : ""));
    var h = '<div class="panel"><h3><span>'+esc(t.pWork)+'</span>'
      + '<span class="hint">'+esc(scopeNote)+'</span></h3>';

    h += '<div class="wlbar">'
      + '<input type="text" id="wlq" placeholder="'+esc(t.wlSearch)+'" value="'+esc(wl.q)+'">'
      + '<select id="wlclinic">'+opt("", t.wlAllClinics, wl.clinic)
        + Object.keys(clinics).sort().map(function(k){ return opt(k,k,wl.clinic); }).join("")+'</select>'
      + '<select id="wlda">'+opt("", t.wlAllDA, wl.da)
        + Object.keys(das).sort().map(function(k){ return opt(k, daName(k)+" · "+daClinic(k), wl.da); }).join("")+'</select>'
      + '<select id="wlprod">'+opt("", t.wlAllProd, wl.prod)
        + PRODUCTS.filter(function(p){ return prods[p]; }).map(function(p){ return opt(p, prodLabel(p), wl.prod); }).join("")+'</select>'
      + '<select id="wlcad">'+opt("", t.wlAllCad, wl.cad)
        + STAGES.map(function(s){ return opt(s, s, wl.cad); }).join("")+'</select>'
      + '<select id="wlstatus">'+opt("", t.wlAllStatus, wl.status)
        + opt("missed", t.wlMissed, wl.status) + opt("incomplete", t.wlIncomplete, wl.status)+'</select>'
      + '<label>'+esc(t.wlOdFrom)+' <input type="number" id="wlmin" value="'+esc(wl.minOd)+'"></label>'
      + '<label>'+esc(t.wlOdTo)+' <input type="number" id="wlmax" value="'+esc(wl.maxOd)+'"></label>'
      + '<button class="wlclear" id="wlclear">'+esc(t.wlClear)+'</button>'
      + '<span class="wlcount">'+esc(t.wlShowing.split("{a}").join(rows.length).split("{b}").join(all.length))+'</span>'
      + '</div>';

    if(!rows.length){
      h += '<div class="empty">'+esc(t.wlEmpty)+'</div></div>';
      return h;
    }

    h += '<div class="tblwrap"><table><thead><tr>'
      + sortable("patient", t.thPatient) + sortable("clinic", t.thClinic)
      + sortable("da", t.thRep) + sortable("prod", t.thProd) + sortable("cad", t.thCadence)
      + sortable("status", t.thStatus)
      + '<th>'+esc(t.thDetails)+'</th>'
      + sortable("due", t.thDue) + sortable("od", t.thOverdue, "n")
      + '</tr></thead><tbody>';
    view.forEach(function(r){
      h += '<tr><td class="tag">'+esc(r.patient)+'</td><td class="nw">'+esc(r.clinic)+'</td>'
        + '<td class="nw">'+esc(r.da)+'</td><td class="nw">'+esc(prodLabel(r.prod))+'</td><td class="num nw">'+esc(r.cad)+'</td>'
        + '<td><span class="pill '+(r.status==="missed"?"p-bad":"p-warn")+'">'
        + esc(r.status==="missed"?t.wlMissed:t.wlIncomplete)+'</span></td>'
        + '<td class="det">'+esc(detailText(r))+'</td>'
        + '<td class="num nw">'+esc(r.due)+'</td>'
        + '<td class="n">'+r.od+'</td></tr>';
    });
    h += '</tbody></table></div>';

    if(pages > 1){
      h += '<div class="wlpager">'
        + '<button id="wlprev"'+(wl.page===0?" disabled":"")+'>'+esc(t.prev)+'</button>'
        + '<span class="pinfo">'+esc(t.pageOf.split("{a}").join(wl.page+1).split("{b}").join(pages))+'</span>'
        + '<button id="wlnext"'+(wl.page>=pages-1?" disabled":"")+'>'+esc(t.next)+'</button></div>';
    }
    return h + '</div>';
  }

  function wireApp(){
    document.querySelectorAll("tr[data-clinic]").forEach(function(tr){
      tr.onclick = function(){
        var k = tr.dataset.clinic;
        clinic = (clinic === k) ? "all" : k;
        da = "all"; wl.page = 0; fw.page = 0; buildFilters(); render();
      };
    });
    document.querySelectorAll("tr[data-da]").forEach(function(tr){
      tr.onclick = function(){
        var k = tr.dataset.da;
        if(da === k){ da = "all"; }
        else { clinic = daClinic(k); da = k; }
        wl.page = 0; fw.page = 0; buildFilters(); render();
      };
    });
    document.querySelectorAll("tr[data-prod]").forEach(function(tr){
      tr.onclick = function(){
        var k = tr.dataset.prod;
        product = (product === k) ? "all" : k;
        wl.page = 0; fw.page = 0; buildFilters(); render();
      };
    });
    document.querySelectorAll("[data-ftype]").forEach(function(el){
      el.onclick = function(){
        var k = el.dataset.ftype;
        fw.type = (fw.type === k) ? "" : k; fw.page = 0; render();
      };
    });
    function on(id, ev, fn){ var e = document.getElementById(id); if(e) e[ev] = fn; }
    on("fwprev","onclick",function(){ if(fw.page>0){ fw.page--; render(); } });
    on("fwnext","onclick",function(){ fw.page++; render(); });
    on("wlq","oninput",function(e){ wl.q = e.target.value; wl.page = 0; render(); });
    on("wlclinic","onchange",function(e){ wl.clinic = e.target.value; wl.page = 0; render(); });
    on("wlda","onchange",function(e){ wl.da = e.target.value; wl.page = 0; render(); });
    on("wlprod","onchange",function(e){ wl.prod = e.target.value; wl.page = 0; render(); });
    on("wlcad","onchange",function(e){ wl.cad = e.target.value; wl.page = 0; render(); });
    on("wlstatus","onchange",function(e){ wl.status = e.target.value; wl.page = 0; render(); });
    on("wlmin","onchange",function(e){ wl.minOd = e.target.value; wl.page = 0; render(); });
    on("wlmax","onchange",function(e){ wl.maxOd = e.target.value; wl.page = 0; render(); });
    on("wlclear","onclick",function(){
      wl.q=""; wl.clinic=""; wl.da=""; wl.prod=""; wl.cad=""; wl.status="";
      wl.minOd=""; wl.maxOd=""; wl.page=0; render();
    });
    on("wlprev","onclick",function(){ if(wl.page>0){ wl.page--; render(); } });
    on("wlnext","onclick",function(){ wl.page++; render(); });
    document.querySelectorAll("th[data-sort]").forEach(function(th){
      th.onclick = function(){
        var k = th.dataset.sort;
        if(wl.sort === k) wl.dir = -wl.dir; else { wl.sort = k; wl.dir = (k==="od") ? -1 : 1; }
        render();
      };
    });
    var q = document.getElementById("wlq");
    if(q && document.activeElement !== q && wl.q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }

  /* ================= shell ================= */
  /* NOTE: the gate is a client-side deterrent, not a security control. On
     static hosting the page and its data are readable regardless. Real
     enforcement belongs in front of the site (e.g. Cloudflare Access). */
  function renderWho(){
    var el = document.getElementById("whoami");
    el.innerHTML = session ? '<button type="button" id="soBtn">'+esc(T().signout)+'</button>' : "";
    if(session) document.getElementById("soBtn").onclick = signOut;
  }
  function applyGateLang(){
    var t = T();
    document.getElementById("gateLede").textContent = t.glede;
    document.getElementById("lpass").textContent = t.lpass;
    var b = document.getElementById("gateBtn");
    if(!b.disabled) b.textContent = t.signin;
  }
  function saveSession(){ session={ok:1}; try{sessionStorage.setItem("zsop_session","1")}catch(e){} }
  function loadSession(){ try{ if(sessionStorage.getItem("zsop_session")==="1"){session={ok:1};return true;} }catch(e){} return false; }
  function signOut(){
    session=null; clinic="all"; da="all"; product="all"; month=TODAY.slice(0,7); week="all";
    try{sessionStorage.removeItem("zsop_session")}catch(e){}
    document.getElementById("wrap").hidden=true;
    document.getElementById("gate").classList.remove("gone");
    var g=document.getElementById("gp"); g.value=""; g.focus();
  }
  function enterApp(){
    document.getElementById("gate").classList.add("gone");
    document.getElementById("wrap").hidden=false;
    month = TODAY.slice(0,7);          /* open on the live month, not on All */
    buildFilters(); render(); renderFeed();
    loadLive().then(function(){ if(session){ buildFilters(); render(); renderFeed(); } });
  }
  document.getElementById("gateform").addEventListener("submit", function(ev){
    ev.preventDefault();
    var t=T(), btn=document.getElementById("gateBtn"), err=document.getElementById("gateErr");
    btn.disabled=true; btn.textContent=t.signingin; err.classList.remove("on");
    sha256(document.getElementById("gp").value).then(function(hh){
      btn.disabled=false; btn.textContent=t.signin;
      if(hh!==PW_HASH){ err.textContent=t.badlogin; err.classList.add("on");
        var g=document.getElementById("gp"); g.value=""; g.focus(); return; }
      saveSession(); enterApp();
    }).catch(function(){ btn.disabled=false; btn.textContent=t.signin;
      err.textContent=t.badlogin; err.classList.add("on"); });
  });
  document.getElementById("langseg").querySelectorAll("button").forEach(function(b){
    b.onclick=function(){ lang=b.dataset.l;
      document.getElementById("langseg").querySelectorAll("button").forEach(function(x){
        x.setAttribute("aria-pressed", String(x===b)); });
      applyGateLang(); if(session){ buildFilters(); render(); renderFeed(); } };
  });

  applyGateLang();
  if(loadSession()) enterApp();
  else document.getElementById("gp").focus();
})();
</script>
