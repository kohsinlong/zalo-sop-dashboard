<title>ZALO SOP Compliance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">

<style>
  :root{
    --ground:#FBFAF8; --surface:#FFFFFF; --surface-2:#F3F2EE; --surface-3:#E7E5DF;
    --ink:#14151C; --ink-2:#3B3E4C; --muted:#6A6F80;
    --rule:#DEDCD6; --rule-2:#EAE8E3;
    --accent:#2438B8; --accent-soft:#E7E9F8;
    --mark:#E6EE6B; --mark-ink:#2B2C0E;
    --ok:#17795E; --ok-soft:#E2F0EA;
    --warn:#A6690A; --warn-soft:#F7EEDC; --warn-mid:#EFDCBB;
    --bad:#AE2E48; --bad-soft:#F8E6EA;
    --h1c:#F6E4E8; --h2c:#EFC6CF; --h3c:#E29CAC; --h4c:#C9647C;
    --inert:#5A6072; --inert-soft:#EBECEF;
    --shadow:0 1px 2px rgba(20,21,28,.05), 0 8px 24px -18px rgba(20,21,28,.25);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0E0F14; --surface:#171922; --surface-2:#1E2029; --surface-3:#2A2D39;
      --ink:#E9EAF0; --ink-2:#BFC3D0; --muted:#8D93A5;
      --rule:#2B2E3A; --rule-2:#23262F;
      --accent:#8D99F7; --accent-soft:#1D2140;
      --mark:#C6CE55; --mark-ink:#14150A;
      --ok:#5FC7A4; --ok-soft:#12291F;
      --warn:#E0A83F; --warn-soft:#2C2211; --warn-mid:#453317;
      --bad:#F0819A; --bad-soft:#2E141B;
      --h1c:#26161B; --h2c:#3A1D26; --h3c:#552836; --h4c:#7C3A4C;
      --inert:#98A0B4; --inert-soft:#1F2129;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.85);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0E0F14; --surface:#171922; --surface-2:#1E2029; --surface-3:#2A2D39;
    --ink:#E9EAF0; --ink-2:#BFC3D0; --muted:#8D93A5;
    --rule:#2B2E3A; --rule-2:#23262F;
    --accent:#8D99F7; --accent-soft:#1D2140;
    --mark:#C6CE55; --mark-ink:#14150A;
    --ok:#5FC7A4; --ok-soft:#12291F;
    --warn:#E0A83F; --warn-soft:#2C2211; --warn-mid:#453317;
    --bad:#F0819A; --bad-soft:#2E141B;
    --h1c:#26161B; --h2c:#3A1D26; --h3c:#552836; --h4c:#7C3A4C;
    --inert:#98A0B4; --inert-soft:#1F2129;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.85);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body.lang-zh{font-family:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
  .wrap{max-width:1300px;margin:0 auto;padding:0 24px 90px}

  header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;padding:32px 0 16px}
  .titleblock h1{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:1.7rem;letter-spacing:-.015em;margin:0 0 5px}
  .titleblock .sub{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .seg{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--surface)}
  .seg button{background:none;border:0;padding:7px 12px;color:var(--muted);font-size:12.5px;font-weight:500;border-right:1px solid var(--rule)}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
  .weeknav{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:5px 8px}
  .weeknav .lbl{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;padding:0 4px}
  .weeknav button{background:none;border:0;color:var(--muted);padding:2px 6px;font-size:14px;line-height:1}

  .clinics{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 10px}
  .clinics button{background:var(--surface);border:1px solid var(--rule);border-radius:20px;
    padding:6px 15px;font-size:.85rem;color:var(--ink-2);display:flex;align-items:center;gap:8px}
  .clinics button .cn{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--bad)}
  .clinics button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
  .clinics button[aria-pressed="true"] .cn{color:var(--surface)}
  .scopebar{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin-bottom:20px;display:flex;align-items:center;gap:9px}
  .scopebar b{color:var(--accent);font-weight:600}

  .herorow{display:grid;grid-template-columns:1fr 300px;gap:16px;margin-bottom:18px;align-items:stretch}
  @media (max-width:940px){.herorow{grid-template-columns:1fr}}
  .hero{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--bad);
    border-radius:4px;box-shadow:var(--shadow);padding:24px 28px;
    display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center}
  @media (max-width:760px){.hero{grid-template-columns:1fr;gap:18px;padding:20px}}
  .hero .bignum{font-size:4.3rem;font-weight:600;letter-spacing:-.045em;line-height:.9;color:var(--bad);font-variant-numeric:tabular-nums}
  .hero .biglab{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:10px}
  .hero .sideline{font-size:.98rem;color:var(--ink-2);margin:0 0 14px;max-width:54ch}
  .hero .sideline b{color:var(--ink);font-weight:600}
  .sentbar{display:flex;height:32px;gap:3px;margin:0 0 8px}
  .sentbar .sg{border-radius:2px;min-width:3px;display:flex;align-items:center;justify-content:center;
    font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:#fff}
  .barlegend{display:flex;gap:18px;flex-wrap:wrap;font-size:.82rem}
  .barlegend span.i{display:flex;gap:7px;align-items:center}
  .barlegend .sw{width:10px;height:10px;border-radius:2px}

  .flagcard{background:var(--warn-soft);border:1px solid var(--warn);border-left:4px solid var(--warn);
    border-radius:4px;box-shadow:var(--shadow);padding:20px 22px;display:flex;flex-direction:column;gap:12px}
  .flagcard .fnum{font-size:2.6rem;font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--warn);font-variant-numeric:tabular-nums}
  .flagcard .flab{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--warn);font-weight:600}
  .flagcard p{margin:0;font-size:.83rem;color:var(--ink-2)}
  .flist{display:flex;flex-direction:column;margin-top:2px}
  .flist .fr{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;padding:5px 0;border-bottom:1px solid var(--warn-mid)}
  .flist .fr:last-child{border-bottom:0}
  .flist .fv{font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums}

  .panel{background:var(--surface);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);margin-bottom:18px}
  .panel > h3{margin:0;padding:14px 20px;border-bottom:1px solid var(--rule-2);font-size:.92rem;font-weight:600;
    display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
  .panel > h3 .hint{font-weight:400;font-size:.79rem;color:var(--muted)}
  .pad{padding:18px 20px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  @media (max-width:940px){.grid2{grid-template-columns:1fr}}

  .tblwrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:.875rem}
  th,td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--rule-2)}
  thead th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap;border-bottom:1px solid var(--rule)}
  tbody tr:last-child td{border-bottom:0}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  td.n{font-family:"IBM Plex Mono",monospace}
  tbody tr.tot td{background:var(--surface-2);font-weight:600;border-top:1px solid var(--rule)}
  tbody tr.worst td{background:var(--bad-soft)}
  .tagmono{font-family:"IBM Plex Mono",monospace;font-size:.78rem}
  .bar{display:inline-block;height:7px;border-radius:2px;background:var(--bad);vertical-align:middle;min-width:2px}
  .dim{color:var(--muted)}

  table.heat td.c{text-align:center;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
    font-weight:600;border-left:1px solid var(--rule-2)}
  table.heat th.c{text-align:center}
  table.heat td.v0{color:var(--muted);font-weight:400;background:transparent}
  table.heat td.v1{background:var(--h1c)}
  table.heat td.v2{background:var(--h2c)}
  table.heat td.v3{background:var(--h3c)}
  table.heat td.v4{background:var(--h4c);color:#fff}
  :root[data-theme="dark"] table.heat td.v4,
  :root:not([data-theme="light"]) table.heat td.v4{color:var(--ink)}
  table.heat td.tot,table.heat th.tot{background:var(--surface-2);font-weight:600}
  .heatkey{display:flex;gap:8px;align-items:center;padding:12px 20px;border-top:1px solid var(--rule-2);
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .heatkey i{width:22px;height:11px;border-radius:2px;display:inline-block}

  .pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.05em;
    padding:2px 7px;border-radius:3px;font-weight:600;white-space:nowrap}
  .p-ok{background:var(--ok-soft);color:var(--ok)}
  .p-bad{background:var(--bad-soft);color:var(--bad)}
  .p-warn{background:var(--warn-soft);color:var(--warn)}
  .p-real{background:var(--ok-soft);color:var(--ok)}
  .p-mock{background:var(--mark);color:var(--mark-ink)}

  .trend{display:flex;align-items:flex-end;gap:11px;height:130px;padding-top:6px}
  .tcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
  .tbar2{width:100%;max-width:44px;background:var(--h3c);border-radius:2px 2px 0 0}
  .tlab{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--muted)}
  .tval{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600}

  .evgrid{display:grid;grid-template-columns:288px 1fr}
  @media (max-width:860px){.evgrid{grid-template-columns:1fr}}
  .evleft{border-right:1px solid var(--rule-2)}
  @media (max-width:860px){.evleft{border-right:0;border-bottom:1px solid var(--rule-2)}}
  .case{text-align:left;background:none;border:0;border-bottom:1px solid var(--rule-2);
    padding:13px 18px;display:grid;grid-template-columns:1fr auto;gap:5px 10px;width:100%}
  .case:hover{background:var(--surface-2)}
  .case[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  .case .cname{font-weight:600;font-size:.86rem}
  .case .cmeta{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);grid-column:1/-1}
  .msg{padding:15px 20px;border-bottom:1px solid var(--rule-2)}
  .msghead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);margin-bottom:9px}
  .msghead .who{font-weight:600;color:var(--ink-2)}
  .lang{margin-bottom:10px}
  .lang:last-child{margin-bottom:0}
  .lang .tg{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}
  .lang p{margin:0;font-size:.89rem;line-height:1.6}
  .empty{padding:32px 20px;text-align:center;color:var(--muted)}
  .empty .big{font-family:"IBM Plex Mono",monospace;font-size:.95rem;color:var(--bad);font-weight:600;margin-bottom:6px}
  .verdict{padding:15px 20px;border-top:1px solid var(--rule-2);display:grid;gap:8px}
  .vrow{display:grid;grid-template-columns:120px 1fr;gap:12px;font-size:.85rem;align-items:baseline}
  .vrow .vk{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

  .note{background:var(--surface-2);border:1px solid var(--rule);border-radius:4px;padding:15px 18px;margin-bottom:20px;font-size:.87rem}
  .note p{margin:0}

  /* ---------- login gate ---------- */
  #gate{position:fixed;inset:0;z-index:100;background:var(--ground);
    display:flex;align-items:center;justify-content:center;padding:24px}
  #gate.gone{display:none}
  .gatecard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--rule);
    border-radius:6px;box-shadow:var(--shadow);padding:34px 32px}
  .gatecard .brand{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:14px}
  .gatecard h2{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:1.42rem;
    letter-spacing:-.015em;margin:0 0 7px;line-height:1.2}
  .gatecard .lede{font-size:.88rem;color:var(--muted);margin:0 0 24px}
  .field{margin-bottom:15px}
  .field label{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
    letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
  .field input{width:100%;padding:10px 12px;font-family:inherit;font-size:.92rem;
    background:var(--ground);color:var(--ink);border:1px solid var(--rule);border-radius:4px}
  .field input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  .gatebtn{width:100%;padding:11px;background:var(--accent);color:var(--surface);border:0;
    border-radius:4px;font-weight:600;font-size:.92rem;margin-top:6px}
  .gatebtn:disabled{opacity:.55;cursor:default}
  .gateerr{background:var(--bad-soft);color:var(--bad);border-radius:4px;padding:9px 12px;
    font-size:.84rem;margin-bottom:15px;display:none}
  .gateerr.on{display:block}
  .gatefoot{margin-top:22px;padding-top:16px;border-top:1px solid var(--rule-2);
    font-size:.79rem;color:var(--muted);line-height:1.5}
  .gatefoot summary{cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:10px;
    letter-spacing:.09em;text-transform:uppercase;font-weight:600}
  .gatefoot code{font-family:"IBM Plex Mono",monospace;background:var(--surface-2);
    padding:1px 5px;border-radius:3px;font-size:.95em}
  .gatefoot p{margin:9px 0 0}
  .who{display:flex;align-items:center;gap:9px;font-family:"IBM Plex Mono",monospace;
    font-size:10.5px;color:var(--muted)}
  .who button{background:none;border:1px solid var(--rule);border-radius:4px;padding:4px 10px;
    color:var(--muted);font-size:10.5px;font-family:inherit}
  .who button:hover{color:var(--ink);border-color:var(--muted)}
  .hidden{display:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media (max-width:640px){
    .wrap{padding:0 16px 60px}
    .titleblock h1{font-size:1.3rem}
    .hero .bignum{font-size:3.3rem}
    .vrow{grid-template-columns:1fr;gap:2px}
  }
</style>

<div id="gate">
  <form class="gatecard" id="gateform" autocomplete="on">
    <div class="brand">Bệnh viện Mắt Sài Gòn</div>
    <h2>ZALO SOP Compliance</h2>
    <p class="lede" id="gateLede">Sign in to view the weekly compliance report.</p>
    <div class="gateerr" id="gateErr"></div>
    <div class="field">
      <label for="gp" id="lpass">Password</label>
      <input type="password" id="gp" name="password" autocomplete="current-password" required autofocus>
    </div>
    <button type="submit" class="gatebtn" id="gateBtn">Sign in</button>
  </form>
</div>

<div class="wrap" id="wrap" hidden>
  <header class="top">
    <div class="titleblock">
      <h1 id="pgTitle">ZALO SOP Compliance</h1>
      <div class="sub"><span id="pgSub">Weekly snapshot</span> &middot; 24&ndash;30 Aug 2026</div>
    </div>
    <div class="controls">
      <div class="weeknav">
        <button aria-label="Previous week">&#8249;</button><span class="lbl">W35</span><button aria-label="Next week">&#8250;</button>
      </div>
      <span class="who" id="whoami"></span>
      <div class="seg" id="langseg" role="group" aria-label="Language">
        <button data-l="en" aria-pressed="true">EN</button>
        <button data-l="vi" aria-pressed="false">Tiếng Việt</button>
        <button data-l="zh" aria-pressed="false">中文</button>
      </div>
    </div>
  </header>

  <div class="clinics" id="clinicbar" role="group" aria-label="Clinic"></div>
  <div class="scopebar" id="scopebar"></div>
  <div id="app"></div>
</div>

    } else {

      var mx = Math.max.apply(null, v.staff.map(function(s){ return s[2]/s[1]; }));
      v.staff.forEach(function(s){
        var rate = s[2]/s[1]*100;

    /* stage panel */
    if(clinic === "all"){
      h += '<div class="panel"><h3><span>'+esc(t.pStageAll)+'</span><span class="hint">'+esc(t.pStageAllH)+'</span></h3>'

      CKEYS.forEach(function(k){ h += '<th class="c">'+esc(C[k].name)+'</th>'; });

      for(var si=STAGES.length-1; si>=0; si--){

        CKEYS.forEach(function(k){

      h += '<tr class="tot"><td>'+esc(t.thTot)+'</td>';
      CKEYS.forEach(function(k){ h += '<td class="c">'+sum(C[k].miss)+'</td>'; });

        + '<div class="heatkey"><span>'+esc(t.hk)+'</span>'
        + '<i style="background:var(--h1c)"></i><i style="background:var(--h2c)"></i>'
        + '<i style="background:var(--h3c)"></i><i style="background:var(--h4c)"></i><span>1 &rarr; 4+</span></div>'

      var maxMiss = Math.max.apply(null, v.miss.concat([1]));

        + '<div class="tblwrap"><table><thead><tr><th>'+esc(t.thStage)+'</th>'
        + '<th class="n">'+esc(t.thDue)+'</th><th class="n">'+esc(t.thMiss)+'</th>'
        + '<th class="n">'+esc(t.thRate)+'</th><th style="width:30%"></th></tr></thead><tbody>';
      for(var sj=STAGES.length-1; sj>=0; sj--){
        if(v.due[sj]===0) continue;
        var mm=v.miss[sj], dd=v.due[sj];
        h += '<tr><td>'+STAGES[sj]+'</td><td class="n">'+dd+'</td>'
          + '<td class="n">'+(mm||'<span class="dim">0</span>')+'</td>'
          + '<td class="n">'+(mm?((mm/dd*100).toFixed(0)+'%'):'<span class="dim">—</span>')+'</td>'
          + '<td>'+(mm?'<span class="bar" style="width:'+Math.round(mm/maxMiss*100)+'%"></span>':'')+'</td></tr>';
      }
      h += '<tr class="tot"><td>'+esc(t.thTot)+'</td><td class="n">'+due+'</td><td class="n">'+miss+'</td>'
        + '<td class="n">'+pct+'</td><td></td></tr></tbody></table></div>'
        + '<div class="pad" style="border-top:1px solid var(--rule-2);color:var(--ink-2)">'
        + '<p style="margin:0;font-size:.86rem">'+esc(clinic==="d5" ? t.stageNoteD5 : t.stageNote)+'</p></div></div>';
    }

    /* product + trend */
    h += '<div class="grid2"><div class="panel"><h3><span>'+esc(t.pProd)+'</span></h3>'
      + '<div class="tblwrap"><table><thead><tr><th>'+esc(t.thProd)+'</th>'
      + '<th class="n">'+esc(t.thDue)+'</th><th class="n">'+esc(t.thMiss)+'</th>'
      + '<th class="n">'+esc(t.thRate)+'</th></tr></thead><tbody>';
    PRODUCTS.forEach(function(p,i){
      var pd=v.prodDue[i], pm=v.prodMiss[i];
      if(pd===0){ h += '<tr><td>'+p+'</td><td class="n"><span class="dim">0</span></td>'
        + '<td class="n"><span class="dim">—</span></td><td class="n"><span class="dim">—</span></td></tr>'; return; }
      var r = pm/pd*100;
      h += '<tr><td>'+p+'</td><td class="n">'+pd+'</td><td class="n">'+pm+'</td>'
        + '<td class="n"><span class="pill '+(r>14?'p-bad':r>8?'p-warn':'p-ok')+'">'+r.toFixed(1)+'%</span></td></tr>';
    });
    h += '<tr class="tot"><td>'+esc(t.thTot)+'</td><td class="n">'+due+'</td><td class="n">'+miss+'</td>'
      + '<td class="n">'+pct+'</td></tr></tbody></table></div></div>';

    var wk = ["W28","W29","W30","W31","W32","W33","W34","W35"];
    var mxT = Math.max.apply(null, v.trend);
    h += '<div class="panel"><h3><span>'+esc(t.pTrend)+'</span><span class="hint">'
      + esc(clinic==="all" ? t.pTrendAllH : t.pTrendOneH)+'</span></h3><div class="pad"><div class="trend">';
    v.trend.forEach(function(val,i){
      var last = i === v.trend.length-1;
      h += '<div class="tcol"><span class="tval"'+(last?' style="color:var(--bad)"':'')+'>'+val+'</span>'
        + '<div class="tbar2" style="height:'+Math.round(val/mxT*104)+'px'+(last?';background:var(--bad)':'')+'"></div>'
        + '<span class="tlab"'+(last?' style="color:var(--bad);font-weight:600"':'')+'>'+wk[i]+'</span></div>';
    });
    h += '</div></div></div></div>';

    /* action list */
    var acts = clinic === "all"
      ? CKEYS.reduce(function(a,k){ return a.concat(ACTIONS[k]); }, [])
      : ACTIONS[clinic];
    h += '<div class="panel"><h3><span>'+esc(t.pAction)+'</span><span class="hint">'
      + esc(v.name) + ' &middot; ' + esc(t.pActionH)+'</span></h3><div class="tblwrap"><table><thead><tr>'
      + '<th>'+esc(t.thTag)+'</th><th>'+esc(t.thProd)+'</th><th>'+esc(t.thStage)+'</th>'
      + '<th>'+esc(t.thDueD)+'</th><th class="n">'+esc(t.thOver)+'</th>'
      + '<th>'+esc(t.thStaff)+'</th><th>'+esc(t.thLast)+'</th></tr></thead><tbody>';
    acts.forEach(function(r){
      h += '<tr><td class="tagmono">'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td>'
        + '<td>'+esc(r[3])+'</td><td class="n">'+esc(r[4])+'</td><td>'+esc(nameOf(r[5]))+'</td>'
        + '<td class="num">'+esc(r[6])+'</td></tr>';
    });
    h += '</tbody></table></div><div class="pad" style="border-top:1px solid var(--rule-2);color:var(--muted);font-size:.84rem">'
      + '<p style="margin:0">'+esc(t.showing(acts.length, miss))+'</p></div></div>';

    /* evidence */
    var who = clinic === "all" ? nameOf(C.d5.staff[0][0]) : nameOf(v.staff[0][0]);
    h += '<div class="panel"><h3><span>'+esc(t.pEv)+'</span><span class="hint">'+esc(t.pEvH)+'</span></h3>'
      + '<div class="evgrid"><div class="evleft">';
    var pills = [["p-ok",t.sent],["p-bad",t.notsentS],["p-warn",t.lateS]];
    var metas = ["MC · CD+14 · 24 Aug","Kính · CD+7 · 27 Aug","Ortho-K · D6-7 · 22 Aug"];
    for(var ci=0; ci<3; ci++){
      h += '<button class="case" data-case="'+(ci+1)+'" aria-pressed="'+(evCase===ci+1)+'">'
        + '<span class="cname">'+esc(t.cn[ci])+'</span>'
        + '<span class="pill '+pills[ci][0]+'">'+esc(pills[ci][1])+'</span>'
        + '<span class="cmeta">'+metas[ci]+'</span></button>';
    }
    h += '</div><div>';

    function msgBlock(sender, when, vnKey, extra){
      var s = '<div class="msg"><div class="msghead"><span class="who">'+esc(sender)+'</span><span>'+when+(extra||'')+'</span></div>';
      s += '<div class="lang"><span class="tg">Tiếng Việt</span><p>'+esc(VN_MSG[vnKey])+'</p></div>';
      if(lang === "en")
        s += '<div class="lang"><span class="tg">English</span><p>'+esc(L.en[vnKey])+'</p></div>';
      if(lang === "zh")
        s += '<div class="lang"><span class="tg">中文</span><p>'+esc(L.zh[vnKey])+'</p></div>';
      return s + '</div>';
    }
    function vrow(k, val){ return '<div class="vrow"><span class="vk">'+esc(k)+'</span><span>'+val+'</span></div>'; }

    if(evCase === 1){
      h += msgBlock(who, "24 Aug 2026 · 09:12", "m1")
        + '<div class="verdict">'
        + vrow(t.vres, '<span class="pill p-ok">'+esc(t.sent)+'</span>')
        + vrow(t.vwin, esc(t.v1))
        + vrow(t.vwhy, '<span style="color:var(--muted)">'+esc(t.v2)+'</span>') + '</div>';
    } else if(evCase === 2){
      h += msgBlock(t.cust, "27 Aug 2026 · 14:31", "m2")
        + msgBlock(who, "27 Aug 2026 · 14:36", "m3")
        + '<div class="verdict">'
        + vrow(t.vres, '<span class="pill p-bad">'+esc(t.notsentS)+'</span>')
        + vrow(t.vwin, esc(t.v3))
        + vrow(t.vwhy, '<span style="color:var(--muted)">'+esc(t.v4)+'</span>') + '</div>';
    } else {
      h += '<div class="empty"><div class="big">'+esc(t.e1)+'</div><div>'+esc(t.e2)+'</div></div>'
        + msgBlock(who, "27 Aug 2026 · 10:15", "m4", ' · <span style="color:var(--warn)">+3d</span>')
        + '<div class="verdict">'
        + vrow(t.vres, '<span class="pill p-warn">'+esc(t.lateS)+'</span>')
        + vrow(t.vwin, esc(t.v5))
        + vrow(t.vwhy, '<span style="color:var(--muted)">'+esc(t.v6)+'</span>') + '</div>';
    }
    h += '</div></div></div>';

    document.getElementById("app").innerHTML = h;
    renderWho();
    document.querySelectorAll(".case").forEach(function(b){
      b.onclick = function(){ evCase = +b.dataset.case; render(); };
    });
  }


  /* =====================================================================
     ACCESS GATE
     NOTE: this is a client-side deterrent, NOT a security control. On
     static hosting the page and its data are readable regardless of this
     form. Real enforcement belongs in front of the site (e.g. Cloudflare
     Access) or behind a server that only returns data to an authenticated
     session. Swap authenticate() for a real API call when that exists.
     ===================================================================== */
  var PW_HASH = "d53942c8e49f95569651edc09e700cc036cc347754caa01dfa482574a51dae6e";
  var session = null;

  /* SHA-256. Uses crypto.subtle where available (HTTPS / localhost) and
     falls back to a pure-JS implementation otherwise, so the form still
     works when the file is opened directly from disk. */
  function utf8(str){
    var out = "", i, c;
    for(i = 0; i < str.length; i++){
      c = str.charCodeAt(i);
      if(c < 128){ out += String.fromCharCode(c); }
      else if(c < 2048){
        out += String.fromCharCode(192 | (c >> 6), 128 | (c & 63));
      } else {
        out += String.fromCharCode(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63));
      }
    }
    return out;
  }
  function sha256sync(ascii){
    function rr(v, a){ return (v >>> a) | (v << (32 - a)); }
    var mm = Math.pow, mp = mm(2, 32), i, j, result = "";
    var words = [], bitLen = ascii.length * 8;
    var hash = sha256sync.h, k = sha256sync.k;
    if(!hash){
      hash = sha256sync.h = []; k = sha256sync.k = [];
      var n = 0, isComp = {};
      for(var cand = 2; n < 64; cand++){
        if(!isComp[cand]){
          for(i = 0; i < 313; i += cand) isComp[i] = cand;
          hash[n] = (mm(cand, .5) * mp) | 0;
          k[n++] = (mm(cand, 1 / 3) * mp) | 0;
        }
      }
      hash = hash.slice(0, 8);
      sha256sync.h = hash;
    }
    ascii += "\x80";
    while(ascii.length % 64 - 56) ascii += "\x00";
    for(i = 0; i < ascii.length; i++){
      j = ascii.charCodeAt(i);
      if(j >> 8) return null;
      words[i >> 2] |= j << ((3 - i) % 4) * 8;
    }
    words[words.length] = (bitLen / mp) | 0;
    words[words.length] = bitLen;
    var h = hash.slice(0);
    for(j = 0; j < words.length;){
      var w = words.slice(j, j += 16), old = h.slice(0);
      for(i = 0; i < 64; i++){
        var w15 = w[i - 15], w2 = w[i - 2], a = h[0], e = h[4];
        var t1 = h[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & h[5]) ^ ((~e) & h[6])) + k[i]
          + (w[i] = (i < 16) ? w[i]
            : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7]
               + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22))
               + ((a & h[1]) ^ (a & h[2]) ^ (h[1] & h[2]));
        h = [(t1 + t2) | 0].concat(h);
        h[4] = (h[4] + t1) | 0;
        h.length = 8;
      }
      for(i = 0; i < 8; i++) h[i] = (h[i] + old[i]) | 0;
    }
    for(i = 0; i < 8; i++)
      for(j = 3; j + 1; j--){
        var b = (h[i] >> (j * 8)) & 255;
        result += ((b < 16) ? "0" : "") + b.toString(16);
      }
    return result;
  }
  function sha256(txt){
    if(window.crypto && crypto.subtle && window.isSecureContext){
      try{
        return crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt))
          .then(function(buf){
            return Array.prototype.map.call(new Uint8Array(buf), function(b){
              return b.toString(16).padStart(2, "0"); }).join("");
          })
          .catch(function(){ return sha256sync(utf8(txt)); });
      }catch(e){ /* fall through */ }
    }
    return Promise.resolve(sha256sync(utf8(txt)));
  }
  function authenticate(pass){
    return sha256(pass).then(function(h){ return h === PW_HASH; });
  }
  function saveSession(){
    session = {ok:true};
    try{ sessionStorage.setItem("zsop_session", "1"); }catch(e){}
  }
  function loadSession(){
    try{
      if(sessionStorage.getItem("zsop_session") === "1"){ session = {ok:true}; return true; }
    }catch(e){}
    return false;
  }
  function signOut(){
    session = null;
    try{ sessionStorage.removeItem("zsop_session"); }catch(e){}
    clinic = "all";
    document.getElementById("wrap").hidden = true;
    document.getElementById("gate").classList.remove("gone");
    var gp = document.getElementById("gp");
    gp.value = ""; gp.focus();
  }
  function enterApp(){
    document.getElementById("gate").classList.add("gone");
    document.getElementById("wrap").hidden = false;
    buildClinicBar(); render();
  }
  function renderWho(){
    var t = T(), el = document.getElementById("whoami");
    if(!el) return;
    if(!session){ el.innerHTML = ""; return; }
    el.innerHTML = '<button type="button" id="soBtn">' + esc(t.signout) + "</button>";
    document.getElementById("soBtn").onclick = signOut;
  }
  function applyGateLang(){
    var t = T();
    document.getElementById("gateLede").textContent = t.glede;
    document.getElementById("lpass").textContent = t.lpass;
    var b = document.getElementById("gateBtn");
    if(!b.disabled) b.textContent = t.signin;
  }

  document.getElementById("gateform").addEventListener("submit", function(ev){
    ev.preventDefault();
    var t = T(), btn = document.getElementById("gateBtn"), err = document.getElementById("gateErr");
    var pass = document.getElementById("gp").value;
    btn.disabled = true; btn.textContent = t.signingin; err.classList.remove("on");
    authenticate(pass).then(function(ok){
      btn.disabled = false; btn.textContent = t.signin;
      if(!ok){
        err.textContent = t.badlogin; err.classList.add("on");
        document.getElementById("gp").value = "";
        document.getElementById("gp").focus();
        return;
      }
      saveSession();
      enterApp();
    }).catch(function(){
      btn.disabled = false; btn.textContent = t.signin;
      err.textContent = t.badlogin; err.classList.add("on");
    });
  });

  function buildClinicBar(){
    var t = T(), h = '';
    var totMiss = CKEYS.reduce(function(s,k){ return s+sum(C[k].miss); },0);
    h += '<button data-c="all" aria-pressed="'+(clinic==="all")+'">'+esc(t.allc)+' <span class="cn">'+totMiss+'</span></button>';
    CKEYS.forEach(function(k){
      h += '<button data-c="'+k+'" aria-pressed="'+(clinic===k)+'">'+esc(C[k].name)+' <span class="cn">'+sum(C[k].miss)+'</span></button>';
    });
    var bar = document.getElementById("clinicbar");
    bar.innerHTML = h;
    bar.querySelectorAll("button").forEach(function(b){
      b.onclick = function(){ clinic = b.dataset.c; evCase = 1; buildClinicBar(); render(); };
    });
  }

  document.getElementById("langseg").querySelectorAll("button").forEach(function(b){
    b.onclick = function(){
      lang = b.dataset.l;
      document.getElementById("langseg").querySelectorAll("button").forEach(function(x){
        x.setAttribute("aria-pressed", String(x === b));
      });
      applyGateLang();
      if(session){ buildClinicBar(); render(); }
    };
  });

  applyGateLang();
  if(loadSession()) enterApp();
  else document.getElementById("gp").focus();
})();
</script>
