<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zalo Audit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">

<style>
  :root{
    --ground:#FBFAF8; --surface:#FFFFFF; --surface-2:#F3F2EE; --surface-3:#E7E5DF;
    --ink:#14151C; --ink-2:#3B3E4C; --muted:#6A6F80;
    --rule:#DEDCD6; --rule-2:#EAE8E3;
    --accent:#2438B8; --accent-soft:#E7E9F8;
    --mark:#E6EE6B; --mark-ink:#2B2C0E;
    --ok:#17795E; --ok-soft:#E2F0EA;
    --warn:#A6690A; --warn-soft:#F7EEDC; --warn-mid:#EFDCBB;
    --bad:#AE2E48; --bad-soft:#F8E6EA;
    --inert:#5A6072; --inert-soft:#EBECEF;
    --shadow:0 1px 2px rgba(20,21,28,.05), 0 8px 24px -18px rgba(20,21,28,.25);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0E0F14; --surface:#171922; --surface-2:#1E2029; --surface-3:#2A2D39;
      --ink:#E9EAF0; --ink-2:#BFC3D0; --muted:#8D93A5;
      --rule:#2B2E3A; --rule-2:#23262F;
      --accent:#8D99F7; --accent-soft:#1D2140;
      --mark:#C6CE55; --mark-ink:#14150A;
      --ok:#5FC7A4; --ok-soft:#12291F;
      --warn:#E0A83F; --warn-soft:#2C2211; --warn-mid:#453317;
      --bad:#F0819A; --bad-soft:#2E141B;
      --inert:#98A0B4; --inert-soft:#1F2129;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.85);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0E0F14; --surface:#171922; --surface-2:#1E2029; --surface-3:#2A2D39;
    --ink:#E9EAF0; --ink-2:#BFC3D0; --muted:#8D93A5;
    --rule:#2B2E3A; --rule-2:#23262F;
    --accent:#8D99F7; --accent-soft:#1D2140;
    --mark:#C6CE55; --mark-ink:#14150A;
    --ok:#5FC7A4; --ok-soft:#12291F;
    --warn:#E0A83F; --warn-soft:#2C2211; --warn-mid:#453317;
    --bad:#F0819A; --bad-soft:#2E141B;
    --inert:#98A0B4; --inert-soft:#1F2129;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.85);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body.lang-zh{font-family:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
  .wrap{max-width:1400px;margin:0 auto;padding:0 24px 90px}
  .mono{font-family:"IBM Plex Mono",monospace}

  #gate{position:fixed;inset:0;z-index:100;background:var(--ground);
    display:flex;align-items:center;justify-content:center;padding:24px}
  #gate.gone{display:none}
  .gatecard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--rule);
    border-radius:6px;box-shadow:var(--shadow);padding:34px 32px}
  .gatecard .brand{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:14px}
  .gatecard h2{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:1.42rem;
    letter-spacing:-.015em;margin:0 0 7px;line-height:1.2}
  .gatecard .lede{font-size:.88rem;color:var(--muted);margin:0 0 24px}
  .field{margin-bottom:15px}
  .field label{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
    letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
  .field input{width:100%;padding:10px 12px;font-family:inherit;font-size:.92rem;
    background:var(--ground);color:var(--ink);border:1px solid var(--rule);border-radius:4px}
  .gatebtn{width:100%;padding:11px;background:var(--accent);color:var(--surface);border:0;
    border-radius:4px;font-weight:600;font-size:.92rem;margin-top:6px}
  .gatebtn:disabled{opacity:.55;cursor:default}
  .gateerr{background:var(--bad-soft);color:var(--bad);border-radius:4px;padding:9px 12px;
    font-size:.84rem;margin-bottom:15px;display:none}
  .gateerr.on{display:block}
  .who{display:flex;align-items:center;gap:9px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted)}
  .who button{background:none;border:1px solid var(--rule);border-radius:4px;padding:4px 10px;
    color:var(--muted);font-size:10.5px;font-family:inherit}
  .who button:hover{color:var(--ink);border-color:var(--muted)}

  header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;padding:32px 0 14px}
  .titleblock h1{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:1.7rem;letter-spacing:-.015em;margin:0 0 5px}
  .titleblock .sub{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .seg{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--surface)}
  .seg button{background:none;border:0;padding:7px 12px;color:var(--muted);font-size:12.5px;font-weight:500;border-right:1px solid var(--rule)}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}

  .filters{display:grid;gap:6px;margin:8px 0 4px}
  .frow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .frow > .flab{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);min-width:58px}
  .frow button{background:var(--surface);border:1px solid var(--rule);border-radius:20px;
    padding:5px 13px;font-size:.83rem;color:var(--ink-2);display:flex;align-items:center;gap:7px}
  .frow button .cn{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;color:var(--accent)}
  .frow button .cs{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;color:var(--ok)}
  .frow button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
  .frow button[aria-pressed="true"] .cn,.frow button[aria-pressed="true"] .cs{color:var(--surface)}
  .frow button[disabled]{opacity:.32;cursor:default}
  .frow.sub button{border-style:dashed}
  .frow.sub button[aria-pressed="true"]{border-style:solid}
  .mtdtag{font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.08em;
    background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:3px;font-weight:600}
  .frow button[aria-pressed="true"] .mtdtag{background:rgba(255,255,255,.22);color:var(--surface)}
  .scopebar{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);margin:10px 0 20px}
  .scopebar b{color:var(--accent);font-weight:600}

  .herorow{display:grid;grid-template-columns:1fr 380px;gap:16px;margin-bottom:18px;align-items:stretch}
  @media (max-width:980px){.herorow{grid-template-columns:1fr}}
  .hero{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--accent);
    border-radius:4px;box-shadow:var(--shadow);padding:24px 28px}
  .heroTop{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center}
  @media (max-width:700px){.heroTop{grid-template-columns:1fr;gap:16px}}
  .bignum{font-size:4rem;font-weight:600;letter-spacing:-.045em;line-height:.9;font-variant-numeric:tabular-nums}
  .bigof{font-size:1.3rem;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:3px}
  .biglab{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--muted);margin-top:10px}
  .sideline{font-size:.96rem;color:var(--ink-2);margin:0 0 14px;max-width:62ch}
  .sideline b{color:var(--ink);font-weight:600}
  .stack{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--surface-3);min-width:80px}
  .stack span{display:block;height:100%}
  .glegend{display:flex;gap:18px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:9px}
  .glegend b{font-family:"IBM Plex Mono",monospace;color:var(--ink)}
  .glegend .sw{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:-1px}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule-2)}
  @media (max-width:700px){.kpis{grid-template-columns:1fr 1fr}}
  .kpi .kv{font-family:"IBM Plex Mono",monospace;font-size:1.3rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
  .kpi .kv small{font-size:.72rem;font-weight:500;color:var(--muted);letter-spacing:0}
  .kpi .kl{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-top:4px}
  .cover{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .cover .cv{font-size:.78rem;display:flex;align-items:center;gap:6px;background:var(--surface-2);
    border:1px solid var(--rule-2);border-radius:3px;padding:3px 9px}
  .cover .cv b{font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums}
  .cover .cv.gap{border-color:var(--warn);background:var(--warn-soft)}
  .cover .cvlab{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:4px}

  .fbcard{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--mark);
    border-radius:4px;box-shadow:var(--shadow);padding:20px 22px;display:flex;flex-direction:column;gap:10px;min-width:0}
  .fbcard .flab{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
  .fbcard textarea{width:100%;min-height:150px;resize:vertical;font-family:inherit;font-size:.86rem;line-height:1.5;
    padding:9px 11px;background:var(--ground);color:var(--ink);border:1px solid var(--rule);border-radius:4px}
  .fbcard .fbrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .fbcard .legacy{font-size:.82rem;color:var(--ink-2);white-space:pre-wrap;background:var(--surface-2);border-radius:4px;padding:10px 12px;max-height:220px;overflow:auto}

  .panel{background:var(--surface);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);margin-bottom:18px}
  .panel > h3{margin:0;padding:14px 20px;border-bottom:1px solid var(--rule-2);font-size:.92rem;font-weight:600;
    display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
  .panel > h3 .hint{font-weight:400;font-size:.79rem;color:var(--muted)}
  .pad{padding:18px 20px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  .grid2 > *,.herorow > *{min-width:0}
  @media (max-width:980px){.grid2{grid-template-columns:1fr}}

  .tblwrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:.875rem}
  th,td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--rule-2);vertical-align:top}
  thead th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap;border-bottom:1px solid var(--rule)}
  tbody tr:last-child td{border-bottom:0}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  td.n{font-family:"IBM Plex Mono",monospace}
  tbody tr.tot td{background:var(--surface-2);font-weight:600;border-top:1px solid var(--rule)}
  td.det{font-size:.82rem;color:var(--ink-2);max-width:320px}
  .empty{padding:34px 20px;text-align:center;color:var(--muted)}
  .pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.05em;
    padding:2px 7px;border-radius:3px;font-weight:600;white-space:nowrap}
  .p-ok{background:var(--ok-soft);color:var(--ok)}
  .p-bad{background:var(--bad-soft);color:var(--bad)}
  .p-warn{background:var(--warn-soft);color:var(--warn)}
  .p-inert{background:var(--inert-soft);color:var(--inert)}
  .p-accent{background:var(--accent-soft);color:var(--accent)}
  .lowN{color:var(--muted)}
  .tagc{font-family:"IBM Plex Mono",monospace;font-size:.8rem}
  .flagnote{font-size:.76rem;color:var(--warn)}

  /* toolbars */
  .wlbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:13px 20px;border-bottom:1px solid var(--rule-2);background:var(--surface-2)}
  .wlbar input[type=text],.wlbar select,.wlbar input[type=number]{
    font-family:inherit;font-size:.83rem;padding:5px 9px;background:var(--surface);
    color:var(--ink);border:1px solid var(--rule);border-radius:4px}
  .wlbar input[type=text]{min-width:150px}
  .wlbar input[type=number]{width:70px}
  .wlbar label{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
  .wltoggle{display:flex;align-items:center;gap:7px;font-size:.83rem;color:var(--ink-2)}
  .btn{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:5px 12px;font-size:.83rem;color:var(--ink-2)}
  .btn:hover{border-color:var(--muted);color:var(--ink)}
  .btn[disabled]{opacity:.4;cursor:default}
  .btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:600}
  .btn.danger{color:var(--bad)}
  .wlcount{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
  .wlpager{display:flex;gap:9px;align-items:center;justify-content:center;padding:13px 20px;border-top:1px solid var(--rule-2)}
  .wlpager .pinfo{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
  .stat{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);white-space:nowrap}
  .stat.ok{color:var(--ok)} .stat.warn{color:var(--warn)} .stat.bad{color:var(--bad)}

  /* audit cards */
  .acard{border-bottom:1px solid var(--rule-2);padding:16px 20px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
  .acard:last-child{border-bottom:0}
  @media (max-width:900px){.acard{grid-template-columns:1fr}}
  .acard .ahead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin-bottom:10px}
  .acard .ahead .nm{font-weight:600}
  .acard .ahead .meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted)}
  .acard .cadbox{border:1px solid var(--rule-2);border-radius:4px;padding:10px 12px;margin-bottom:8px;background:var(--ground)}
  .acard .cadbox .cadname{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
  .acard .cadbox .cadname b{font-family:"IBM Plex Mono",monospace;font-size:.84rem}
  .acard .cadbox .cadname small{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted)}
  .ticks{display:flex;flex-direction:column;gap:4px}
  .tick{display:flex;align-items:flex-start;gap:9px;font-size:.86rem;cursor:pointer;padding:4px 6px;border-radius:3px}
  .tick:hover{background:var(--surface-2)}
  .tick input{margin:4px 0 0;width:16px;height:16px;flex:0 0 auto;accent-color:var(--ok)}
  .tick.on{color:var(--ink)} .tick.off{color:var(--ink-2)}
  .acard .side{display:flex;flex-direction:column;gap:8px}
  .acard textarea{width:100%;min-height:84px;resize:vertical;font-family:inherit;font-size:.85rem;line-height:1.5;
    padding:8px 10px;background:var(--ground);color:var(--ink);border:1px solid var(--rule);border-radius:4px}
  .acard .arow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .acard .legacy{font-size:.82rem;color:var(--ink-2);white-space:pre-wrap;background:var(--surface-2);border-radius:4px;padding:8px 10px}
  .acard .legacy .ll{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}
  .shots{display:flex;flex-wrap:wrap;gap:8px}
  .shot{position:relative;width:84px;height:84px;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .shot a{display:block;width:100%;height:100%}
  .shot .del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:3px;font-size:11px;line-height:1;padding:3px 5px}
  .shot .lnk{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--accent);padding:6px;text-align:center;overflow-wrap:anywhere}
  .upl{display:inline-flex;align-items:center;gap:6px}
  .upl input{display:none}
  .chk{display:flex;align-items:center;gap:7px;font-size:.83rem;color:var(--ink-2)}
  .chk input{accent-color:var(--warn)}

  /* trend */
  .mtrend{display:flex;align-items:flex-end;gap:9px;height:150px;position:relative;overflow-x:auto;padding-top:18px}
  .mcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:34px;justify-content:flex-end;height:100%}
  .mbar{width:100%;max-width:46px;border-radius:2px 2px 0 0}
  .mval{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600}
  .mlab{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--muted);white-space:nowrap}
  .mn{font-family:"IBM Plex Mono",monospace;font-size:8.5px;color:var(--muted);opacity:.75}
  .mcol.sel .mlab{color:var(--accent);font-weight:600}
  .mcol button{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;justify-content:flex-end;height:100%}
  .heat{font-family:"IBM Plex Mono",monospace;font-size:.8rem;text-align:center;border-radius:3px;padding:3px 4px;min-width:46px;display:inline-block}

  .note{font-size:.82rem;color:var(--muted);line-height:1.55}
  .note p{margin:0 0 8px}
  .note b{color:var(--ink-2)}
  .feed{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .feed i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
  .feed.live{color:var(--ok)} .feed.live i{background:var(--ok)}
  .feed.loading i{background:var(--warn)}
  .feed.stale{color:var(--warn)} .feed.stale i{background:var(--warn)}
  .feed.failed{color:var(--bad)} .feed.failed i{background:var(--bad)}
  .hidden{display:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media (max-width:640px){
    .wrap{padding:0 16px 60px}
    .titleblock h1{font-size:1.3rem}
    .bignum{font-size:3.1rem}
  }
</style>
</head>
<body>

<div id="gate">
  <form class="gatecard" id="gateform" autocomplete="on">
    <div class="brand">Bệnh viện Mắt Sài Gòn</div>
    <h2>Zalo Audit Tracker</h2>
    <p class="lede" id="gateLede">Sign in to open the weekly audit.</p>
    <div class="gateerr" id="gateErr"></div>
    <div class="field">
      <label for="gp" id="lpass">Password</label>
      <input type="password" id="gp" name="password" autocomplete="current-password" required autofocus>
    </div>
    <button type="submit" class="gatebtn" id="gateBtn">Sign in</button>
  </form>
</div>

<div class="wrap" id="wrap" hidden>
  <header class="top">
    <div class="titleblock">
      <h1 id="pgTitle">Zalo Audit Tracker</h1>
      <div class="sub"><span id="pgSub">Weekly chat audit</span> &middot; <span id="asOf"></span></div>
    </div>
    <div class="controls">
      <span class="feed" id="feed"></span>
      <span class="who" id="whoami"></span>

  /* ---------------- storage: the feed ---------------- */
  function feedUrl(){
    var q = /[?&]feed=([^&]+)/.exec(location.search);

  }
  function post(body){
    var url = feedUrl();
    if(!url) return Promise.resolve({local:true});
    body.token = LIVE.token; body.app = "cz";
    /* text/plain keeps the request "simple": Apps Script answers it without a preflight */
    return fetch(url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body)})
      .then(function(res){ if(!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
      .then(function(j){ if(j.error) throw new Error(j.error); if(!j.cz) throw new Error("not the CZ feed"); return j; });
  }

  function touch(r, mark){ r.at = new Date().toISOString(); r.by = by; r.sync = false; r.embedded = false; if(mark) r.rv = 1; persistLocal(); }
  function stripped(r){
    return {key:r.key, week:r.week, clinic:r.clinic, tag:r.tag, name:r.name, prod:r.prod, cads:r.cads, data:r.data ? 1 : 0, rv:r.rv ? 1 : 0,
            remark:r.remark || "", added:r.added || "", shots:(r.shots||[]).map(function(s){ return {id:s.id, name:s.name, url:s.url || ""}; }),
            by:r.by, at:r.at, removed:r.removed ? 1 : 0, legacy:r.legacy || null};

  function save(r){
    clearTimeout(timers[r.key]);

    timers[r.key] = setTimeout(function(){
      post({action:"audit", audit:stripped(r)}).then(function(j){
        if(j.local) return;
        r.sync = true; persistLocal(); status[r.key] = "saved"; render();

    }, 600);
  }
  function saveFeedback(w, text){
    var k = fKey(w, clinic === "all" ? CLINIC : clinic), rec = FEEDBACK[k] || {week:w, clinic:clinic === "all" ? CLINIC : clinic};
    rec.text = text; rec.by = by; rec.at = new Date().toISOString(); rec.sync = false; rec.embedded = false;
    FEEDBACK[k] = rec; persistLocal();
    status[k] = feedUrl() ? "saving" : "local"; render();
    post({action:"feedback", feedback:{week:rec.week, clinic:rec.clinic, text:rec.text, by:rec.by, at:rec.at}})
      .then(function(j){ if(j.local) return; rec.sync = true; persistLocal(); status[k] = "saved"; render(); })

    (j.audits || []).forEach(function(r){
      if(!r || !r.key) return;
      var cur = AUDITS[r.key];
      if(cur && cur.sync === false && (cur.at || "") > (r.at || "")) return;
      r.sync = true; r.embedded = false; r.rv = r.rv ? 1 : 0; r.tk = r.tk || r.key.split("│")[2]; r.added = r.added || r.at;
      AUDITS[r.key] = r;
    });
    (j.feedback || []).forEach(function(f){
      if(!f || !f.week) return;
      var k = fKey(f.week, f.clinic || CLINIC), cur = FEEDBACK[k];
      if(cur && cur.sync === false && (cur.at || "") > (f.at || "")) return;
      FEEDBACK[k] = {week:f.week, clinic:f.clinic || CLINIC, text:f.text || "", by:f.by || "", at:f.at || "", sync:true, embedded:false};

  function loadLive(){
    var url = feedUrl();
    if(!url) return Promise.resolve(false);
    var u = url + (url.indexOf("?") === -1 ? "?" : "&") + "app=cz&token=" + encodeURIComponent(LIVE.token) + "&t=" + Date.now();
    feedState = { mode:"loading", at:"", error:"" }; renderFeed();
    return fetch(u).then(function(res){ if(!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
      .then(function(j){
        if(j.error) throw new Error(j.error);
        if(!j.cz){ var e = new Error("feed has no CZ data yet"); e.stale = true; throw e; }
        if(j.cases && j.cases.length){ CASES = j.cases; reindex(); }
        mergeRemote(j);
        feedState = { mode:"live", at:j.generated || new Date().toISOString(), error:"" };
        syncPending();
        return true;
      })
      .catch(function(err){
        CASES = SNAPSHOT; reindex();
        feedState = { mode: err && err.stale ? "stale" : "failed", at:DATA.generated || DATA.asof || "", error:String(err && err.message || err) };
        return false;

  }
  function renderFeed(){
    var t = T(), el = document.getElementById("feed"), m = feedState.mode;
    if(!el) return;
    if(!feedUrl() && m !== "live"){ el.className = "feed"; el.innerHTML = '<i></i>' + esc(t.feedSnap) + ' ' + esc(fmtWhen(feedState.at)); el.title = t.feedSnapH; return; }
    el.className = "feed " + m;

      : m === "loading" ? t.feedLoading
      : (m === "stale" ? t.feedStale : t.feedFailed) + " " + fmtWhen(feedState.at));

  }

  function addToSample(c, w){
    var cl = caseClinic(c), tk = tagKey(c[1]), k = aKey(w, cl, tk), r = AUDITS[k];
    if(r && !r.removed) return r;
    var cads = {};
    dueIn(c, w).forEach(function(ms){ cads[ms] = new Array(nItems(c[4], ms) + 1).join("0"); });
    r = r || {key:k, week:w, clinic:cl, tag:c[1], tk:tk, shots:[], added:new Date().toISOString()};
    r.added = r.added || new Date().toISOString();
    r.name = c[2]; r.prod = c[4]; r.cads = cads; r.data = 0; r.remark = r.remark || ""; r.removed = 0; r.rv = 0;
    r.at = new Date().toISOString(); r.by = by; r.sync = false; r.embedded = false;
    AUDITS[k] = r; persistLocal(); save(r);
    return r;
  }
  function removeFromSample(r){

  }
  /* Draw n customers spread across the cadences and products due this week:
     round-robin over the cadence groups, alternating product inside each,
     from a shuffled pool of customers not yet in the sample. */
  function draw(w, n){
    var have = {}; recsOf(w).forEach(function(r){ if(!r.removed) have[r.tk] = 1; });
    var groups = {}, seen = {};
    instances(w).forEach(function(i){
      var tk = tagKey(i.c[1]);
      if(have[tk] || seen[tk + "|" + i.ms]) return;
      seen[tk + "|" + i.ms] = 1;
      (groups[i.ms] = groups[i.ms] || []).push(i.c);
    });
    var order = Object.keys(groups).sort(msSort);
    order.forEach(function(ms){
      var list = groups[ms];
      for(var i = list.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = list[i]; list[i] = list[j]; list[j] = t; }
      var byP = {}; list.forEach(function(c){ (byP[c[4] || "?"] = byP[c[4] || "?"] || []).push(c); });
      var ps = Object.keys(byP), mixed = [], left = true;
      while(left){ left = false; ps.forEach(function(p){ if(byP[p].length){ mixed.push(byP[p].shift()); left = true; } }); }
      groups[ms] = mixed;
    });
    var picked = [], taken = {};
    while(picked.length < n){
      var progress = false;
      for(var g = 0; g < order.length && picked.length < n; g++){
        var pool = groups[order[g]];
        while(pool.length){
          var c = pool.shift(), tk = tagKey(c[1]);
          if(taken[tk]) continue;
          taken[tk] = 1; picked.push(c); progress = true; break;
        }
      }
      if(!progress) break;
    }
    picked.forEach(function(c){ addToSample(c, w); });
    return picked.length;
  }

        (w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0),
        t2=(rr(A,2)^rr(A,13)^rr(A,22))+((A&H[1])^(A&H[2])^(H[1]&H[2]));

  function prodLabel(p){ return T().prod[p] || p || "—"; }

  /* ---------------- filters ---------------- */
  function bar(id, items, active, onPick){
    var el = document.getElementById(id), h = "";
    items.forEach(function(it){
      h += '<button data-k="'+esc(it.k)+'" aria-pressed="'+(active===it.k)+'"'
        + (it.n===0 && it.k!==active && !it.keep ? " disabled" : "") + '>' + it.label
        + (it.n===null || it.n===undefined ? "" : ' <span class="cn">'+it.n+'</span>')
        + (it.s ? ' <span class="cs">'+it.s+'</span>' : "") + '</button>';
    });
    el.innerHTML = h;
    el.querySelectorAll("button").forEach(function(b){ b.onclick = function(){ onPick(b.dataset.k); }; });
  }
  function weekList(){
    var first = THIS_WEEK;
    (DATA.weeks || []).forEach(function(w){ if(w.k < first) first = w.k; });
    Object.keys(AUDITS).forEach(function(k){ if(AUDITS[k].week < first) first = AUDITS[k].week; });
    var out = [], k = first, guard = 0;
    while(k <= THIS_WEEK && guard++ < 80){ out.push(k); k = addDays(k, 7); }
    return out;
  }
  function buildFilters(){
    var t = T(), clinics = {}; CASES.forEach(function(c){ clinics[caseClinic(c)] = 1; });
    var cl = Object.keys(clinics).sort();
    bar("clinicbar",
      (cl.length > 1 ? [{k:"all", label:esc(t.allc), n:null}] : []).concat(cl.map(function(x){ return {k:x, label:esc(x), n:null}; })),
      clinic, function(k){ clinic = k; instCache = {}; dl.page = 0; buildFilters(); render(); });
    bar("weekbar", weekList().map(function(k){
      var n = recsOf(k).filter(function(r){ return !r.removed; }).length, due = instances(k).length;
      return {k:k, keep:true, n:due, s:n || "",
              label:esc(wTag(k)) + ' <span style="opacity:.75">'+esc(weekLabel(k))+'</span>'
                + (k === THIS_WEEK ? ' <span class="mtdtag">'+esc(t.thisWeek)+'</span>' : k === LAST_WEEK ? ' <span class="mtdtag">'+esc(t.lastWeek)+'</span>' : "")};
    }), week, function(k){ week = k; dl.page = 0; loadShotURLs(k).then(function(){ buildFilters(); render(); }); });
  }
  function scopeText(){
    var t = T();
    return esc(t.viewing) + " <b>" + esc(clinic === "all" ? t.allc : clinic) + "</b> &middot; <b>" + esc(wTag(week)) + "</b> " + esc(weekLabel(week)) + " " + week.slice(0,4);
  }

  /* ---------------- render ---------------- */
  function pill(v){
    var t = T(), m = {pass:["p-ok",t.vPass], partial:["p-warn",t.vPartial], fail:["p-bad",t.vFail], data:["p-inert",t.vData], open:["p-accent",t.vOpen], note:["p-inert",t.vNote]}[v] || ["p-inert", v];
    return '<span class="pill '+m[0]+'">'+esc(m[1])+'</span>';
  }
  function statusText(k){
    var t = T(), s = status[k];
    if(!s) return "";
    var cls = s === "saved" || s === "local" ? "ok" : s === "failed" ? "bad" : "warn";
    return '<span class="stat '+cls+'">'+esc(s === "saving" ? t.stSaving : s === "saved" ? t.stSaved : s === "local" ? t.stLocal : t.stFailed)+'</span>';
  }
  function render(){
    var t = T();
    document.getElementById("pgTitle").textContent = t.title;
    document.getElementById("pgSub").textContent = fmt(t.sub, {c: clinic === "all" ? t.allc : clinic});
    document.getElementById("asOf").textContent = t.asOf + " " + TODAY;
    document.body.className = lang === "zh" ? "lang-zh" : "";
    document.getElementById("scopebar").innerHTML = scopeText();
    renderFeed();

    var inst = instances(week), recs = recsOf(week).filter(function(r){ return !r.removed; }), a = agg(recs), h = "";
    var custDue = {}; inst.forEach(function(i){ custDue[tagKey(i.c[1])] = 1; });
    var nCust = Object.keys(custDue).length;

    /* hero + feedback */
    var dueMs = {}, dueP = {}, samMs = {}, samP = {};
    inst.forEach(function(i){ dueMs[i.ms] = (dueMs[i.ms]||0)+1; dueP[i.c[4]||"?"] = (dueP[i.c[4]||"?"]||0)+1; });
    recs.forEach(function(r){
      var ms = Object.keys(r.cads || {}); if(!ms.length && r.legacy) ms = r.legacy.ms || [];
      ms.forEach(function(m){ samMs[m] = (samMs[m]||0)+1; });
      samP[r.prod||"?"] = (samP[r.prod||"?"]||0)+1;
    });
    var cover = function(label, due, sam, lab){
      var keys = Object.keys(due); Object.keys(sam).forEach(function(k){ if(keys.indexOf(k) === -1) keys.push(k); });
      if(!keys.length) return "";
      keys.sort(label === "ms" ? msSort : function(x,y){ return PRODS.indexOf(x) - PRODS.indexOf(y); });
      return '<div class="cover"><span class="cvlab">'+esc(lab)+'</span>' + keys.map(function(k){
        var s = sam[k]||0, d = due[k]||0;
        return '<span class="cv'+(d && !s ? ' gap' : '')+'">'+esc(label === "ms" ? k : prodLabel(k))+' <b>'+s+'</b><span style="color:var(--muted)">/'+d+'</span></span>';
      }).join("") + '</div>';
    };
    var big = a.score === null
      ? '<div class="bignum" style="color:var(--muted)">—</div><div class="biglab">'+esc(t.scoreNone)+'</div>'
      : '<div class="bignum" style="color:'+scoreColour(a.score)+'">'+a.score+'<span class="bigof">%</span></div><div class="biglab">'+esc(t.score)+'</div>';
    var tot = a.pass + a.partial + a.fail, stack = tot
      ? '<div class="stack"><span style="width:'+pct(a.pass,tot)+'%;background:var(--ok)"></span><span style="width:'+pct(a.partial,tot)+'%;background:var(--warn)"></span><span style="width:'+pct(a.fail,tot)+'%;background:var(--bad)"></span></div>' : '';
    h += '<div class="herorow"><div class="hero"><div class="heroTop"><div>'+big+'</div><div>'
      + '<p class="sideline">'+(a.rv ? fmt(t.heroLine, {rv:a.rv, t:TARGET_N, cad:a.cad}) : esc(t.heroOpen))+'</p>'
      + stack
      + '<div class="glegend"><span><i class="sw" style="background:var(--ok)"></i>'+esc(t.kPass)+' <b>'+a.pass+'</b></span>'
      + '<span><i class="sw" style="background:var(--warn)"></i>'+esc(t.kPartial)+' <b>'+a.partial+'</b></span>'
      + '<span><i class="sw" style="background:var(--bad)"></i>'+esc(t.kFail)+' <b>'+a.fail+'</b></span>'
      + '<span><i class="sw" style="background:var(--inert)"></i>'+esc(t.kData)+' <b>'+a.data+'</b></span>'
      + (a.open ? '<span><i class="sw" style="background:var(--accent)"></i>'+esc(t.kOpen)+' <b>'+a.open+'</b></span>' : '')+'</div>'
      + '<div class="kpis">'
      + '<div class="kpi"><div class="kv">'+a.rv+'<small>/'+TARGET_N+'</small></div><div class="kl">'+esc(t.kSampled)+' · '+esc(t.kTarget)+'</div></div>'
      + '<div class="kpi"><div class="kv">'+nCust+'</div><div class="kl">'+esc(t.kDueC)+'</div></div>'
      + '<div class="kpi"><div class="kv">'+inst.length+'</div><div class="kl">'+esc(t.kDueM)+'</div></div>'
      + '<div class="kpi"><div class="kv">'+a.cad+'</div><div class="kl">'+esc(t.coverH)+'</div></div>'
      + '</div>'
      + cover("ms", dueMs, samMs, t.coverCad) + cover("p", dueP, samP, t.coverProd)
      + '</div></div></div>';

    var fk = fKey(week, clinic === "all" ? CLINIC : clinic), fb = FEEDBACK[fk];
    h += '<div class="fbcard"><div class="flab">'+esc(fmt(t.fbTitle, {w:wTag(week)}))+'</div>'
      + '<div style="font-size:.82rem;color:var(--muted)">'+esc(t.fbLede)+'</div>'
      + (fb && fb.embedded ? '<div class="legacy"><span class="stat" style="display:block;margin-bottom:4px">'+esc(t.fbLegacy)+'</span>'+esc(fb.text)+'</div>'
         : '<textarea id="fbText" placeholder="'+esc(t.fbPh)+'">'+esc(fb ? fb.text : "")+'</textarea>')
      + (fb && fb.embedded ? '<textarea id="fbText" placeholder="'+esc(t.fbPh)+'" style="min-height:70px"></textarea>' : '')
      + '<div class="fbrow"><button type="button" class="btn primary" id="fbSave">'+esc(t.fbSave)+'</button>'
      + '<label class="stat" style="display:flex;gap:6px;align-items:center">'+esc(t.fbBy)+' <input type="text" id="byName" value="'+esc(by)+'" style="width:90px;font:inherit;padding:3px 6px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);color:var(--ink)"></label>'
      + statusText(fk) + (fb && fb.at && !status[fk] ? '<span class="stat">'+esc(fb.by || "")+' · '+esc(fmtWhen(fb.at))+'</span>' : '')
      + '</div></div></div>';

    h += renderSample(recs, inst);
    h += renderDue(inst, recs);
    h += renderTrend();
    h += '<div class="panel"><h3>'+esc(t.noteTitle)+'</h3><div class="pad note">'
      + '<p>'+fmt(t.note1, {t:TARGET_N})+'</p><p>'+t.note2+'</p>'
      + '<p>'+fmt(t.note3, {where: esc(feedUrl() ? t.whereLive : t.whereLocal)})+'</p><p>'+t.note4+'</p></div></div>';

    document.getElementById("app").innerHTML = h;
    wireApp(); renderWho();
  }

  function renderSample(recs, inst){
    var t = T(), h = "", left = {};
    recs.forEach(function(r){ left[r.tk] = 1; });
    var pool = {}; inst.forEach(function(i){ var k = tagKey(i.c[1]); if(!left[k]) pool[k] = 1; });
    var canDraw = Object.keys(pool).length, want = Math.max(TARGET_N - recs.length, 0), nDraw = Math.min(want || 5, canDraw);
    h += '<div class="panel" id="samplePanel"><h3>'+esc(t.pSample)+' <span class="hint">'+esc(fmt(t.pSampleH, {n:recs.length}))+'</span></h3>';
    h += '<div class="wlbar"><button type="button" class="btn primary" id="drawBtn" title="'+esc(t.drawH)+'"'+(canDraw ? '' : ' disabled')+'>'+esc(fmt(t.draw, {n:nDraw}))+'</button>'
      + '<label>'+esc(t.drawTo)+' <input type="number" id="drawN" min="1" max="50" value="'+nDraw+'"></label>'
      + (canDraw ? '' : '<span class="stat">'+esc(t.drawNone)+'</span>')
      + '<span class="wlcount">'+recs.length+' / '+TARGET_N+'</span></div>';
    if(!recs.length){
      h += '<div class="empty"><div style="font-size:1.05rem;color:var(--ink-2);margin-bottom:8px">'+esc(t.sampleEmpty)+'</div><div>'+esc(t.sampleEmptyHint)+'</div></div></div>';
      return h;
    }
    /* in the order they were added, so a card never moves while it is being marked */
    recs.sort(function(x, y){ var a = x.added || x.at || "", b = y.added || y.at || ""; return a < b ? -1 : a > b ? 1 : 0; });
    recs.forEach(function(r, idx){
      var c = CASE_BY_KEY[r.tk], v = verdict(r);
      var ms = Object.keys(r.cads || {}).sort(msSort);
      var dueNow = c ? dueIn(c, week) : [];
      dueNow.forEach(function(m){ if(ms.indexOf(m) === -1 && !r.legacy) { r.cads[m] = new Array(nItems(r.prod, m) + 1).join("0"); ms.push(m); } });
      ms.sort(msSort);
      h += '<div class="acard" data-key="'+esc(r.key)+'"><div>'
        + '<div class="ahead"><span class="mono" style="color:var(--muted)">'+(idx+1)+'</span><span class="nm">'+esc(r.name || (c ? c[2] : "") || "—")+'</span>'
        + '<span class="tagc">'+esc(r.tag)+'</span><span class="pill p-accent">'+esc(prodLabel(r.prod))+'</span>'
        + (c && c[10] ? '<span class="flagnote" title="'+esc(c[10])+'">⚑ '+esc(c[10].split("(")[0].trim())+'</span>' : '')
        + (c && c[5] ? '<span class="meta">CD '+esc(c[5])+'</span>' : '')
        + '<span style="margin-left:auto">'+pill(v)+'</span></div>';
      if(ms.length){
        ms.forEach(function(m){
          var items = itemsOf(r.prod, m), bits = r.cads[m] || "";
          if(!items.length) items = [t.genericItem];
          while(bits.length < items.length) bits += "0";
          h += '<div class="cadbox"><div class="cadname"><b>'+esc(m)+'</b><small>'+esc(dueNow.indexOf(m) >= 0 ? t.dueNow : "")+' · '+bitsScore(bits.slice(0, items.length))+'</small></div><div class="ticks">';
          items.forEach(function(it, i){
            var on = bits.charAt(i) === "1";
            h += '<label class="tick '+(on ? "on" : "off")+'"><input type="checkbox" data-ms="'+esc(m)+'" data-i="'+i+'"'+(on ? " checked" : "")+(r.legacy && r.embedded ? "" : "")+'> <span>'+esc(it)+'</span></label>';
          });
          h += '</div></div>';
        });
        h += '<div class="arow"><button type="button" class="btn" data-all="1">'+esc(t.allSent)+'</button><button type="button" class="btn" data-all="0">'+esc(t.nothingSent)+'</button></div>';
      } else if(!r.legacy){
        h += '<div class="stat">'+esc(t.notDue)+'</div>';
      }
      if(r.legacy){
        h += '<div class="legacy" style="margin-top:8px"><span class="ll">'+esc(t.legacyTag)+(r.legacy.ms && r.legacy.ms.length ? ' · '+esc(r.legacy.ms.join(" ")) : '')+'</span>'
          + (r.legacy.missing ? '<span class="ll">'+esc(t.legMissing)+'</span>'+esc(r.legacy.missing) : '')
          + (r.legacy.fb ? '<span class="ll" style="margin-top:6px">'+esc(t.legFb)+'</span>'+esc(r.legacy.fb) : '')+'</div>';
      }
      h += '</div><div class="side">'
        + '<textarea data-rem="1" placeholder="'+esc(t.remPh)+'">'+esc(r.remark || "")+'</textarea>'
        + '<label class="chk"><input type="checkbox" data-flag="1"'+(r.data ? " checked" : "")+'> '+esc(t.dataIssue)+'</label>'
        + '<div class="shots">' + (r.shots || []).map(function(s){
            var src = s.url && /^https?:/.test(s.url) ? s.url : (shotURL[s.id] || "");
            return '<div class="shot">' + (shotURL[s.id] ? '<a href="'+esc(shotURL[s.id])+'" target="_blank" rel="noopener"><img src="'+esc(shotURL[s.id])+'" alt="'+esc(s.name||"")+'"></a>'
              : src ? '<a href="'+esc(src)+'" target="_blank" rel="noopener" class="lnk">'+esc(s.name || "screenshot")+'</a>' : '<span class="lnk">'+esc(s.name||"")+'</span>')
              + '<button type="button" class="del" data-shot="'+esc(s.id)+'" title="'+esc(t.remove)+'">×</button></div>';
          }).join("")
        + '<label class="btn upl">'+esc(t.addShot)+'<input type="file" accept="image/*" multiple data-upl="1"></label></div>'
        + '<div class="arow">'+statusText(r.key)+(r.at && !status[r.key] ? '<span class="stat">'+esc(r.by||"")+' · '+esc(fmtWhen(r.at))+'</span>' : '')
        + '<button type="button" class="btn danger" data-remove="1" style="margin-left:auto">'+esc(t.remove)+'</button></div>'
        + '</div></div>';
    });
    h += '</div>';
    return h;
  }

  function renderDue(inst, recs){
    var t = T(), h = "", inS = {}; recs.forEach(function(r){ inS[r.tk] = 1; });
    var rows = [];
    if(dl.all){
      CASES.forEach(function(c){ if(inClinic(c)) rows.push({c:c, ms:dueIn(c, week)}); });
    } else {
      var seen = {};
      inst.forEach(function(i){ var k = tagKey(i.c[1]); if(seen[k]){ seen[k].ms.push(i.ms); return; } seen[k] = {c:i.c, ms:[i.ms]}; rows.push(seen[k]); });
    }
    var msSet = {}; inst.forEach(function(i){ msSet[i.ms] = 1; });
    var q = dl.q.trim().toLowerCase();
    rows = rows.filter(function(r){
      if(dl.ms && r.ms.indexOf(dl.ms) === -1) return false;
      if(dl.prod && r.c[4] !== dl.prod) return false;
      if(q && (r.c[1]+" "+r.c[2]).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    rows.sort(function(x, y){ return (x.ms[0] ? MS_ORDER.indexOf(x.ms[0]) : 99) - (y.ms[0] ? MS_ORDER.indexOf(y.ms[0]) : 99) || (x.c[5] < y.c[5] ? -1 : 1); });
    var n = rows.length, pages = Math.max(Math.ceil(n / PAGE), 1);
    if(dl.page >= pages) dl.page = pages - 1;
    var page = rows.slice(dl.page*PAGE, dl.page*PAGE + PAGE);
    h += '<div class="panel"><h3>'+esc(t.pDue)+' <span class="hint">'+esc(t.pDueH)+'</span></h3>';
    h += '<div class="wlbar"><input type="text" id="dlq" placeholder="'+esc(t.search)+'" value="'+esc(dl.q)+'">'
      + '<select id="dlms"><option value="">'+esc(t.allMs)+'</option>'+Object.keys(msSet).sort(msSort).map(function(m){ return '<option value="'+esc(m)+'"'+(dl.ms===m?' selected':'')+'>'+esc(m)+'</option>'; }).join("")+'</select>'
      + '<select id="dlp"><option value="">'+esc(t.allP)+'</option>'+PRODS.map(function(p){ return '<option value="'+esc(p)+'"'+(dl.prod===p?' selected':'')+'>'+esc(prodLabel(p))+'</option>'; }).join("")+'</select>'
      + '<label class="wltoggle"><input type="checkbox" id="dlall"'+(dl.all?' checked':'')+'> '+esc(t.allCust)+'</label>'
      + '<span class="wlcount">'+n+'</span></div>';
    if(!n){
      h += '<div class="empty"><div style="font-size:1.05rem;color:var(--ink-2);margin-bottom:8px">'+esc(t.dueEmpty)+'</div><div>'+esc(t.dueEmptyHint)+'</div></div></div>';
      return h;
    }
    h += '<div class="tblwrap"><table><thead><tr><th>'+esc(t.thTag)+'</th><th>'+esc(t.thName)+'</th><th>'+esc(t.thProd)+'</th><th>'+esc(t.thDue)+'</th><th>'+esc(t.thTodo)+'</th><th>'+esc(t.thFlag)+'</th><th></th></tr></thead><tbody>';
    page.forEach(function(r){
      var c = r.c, k = tagKey(c[1]);
      h += '<tr><td class="tagc">'+esc(c[1])+'</td><td>'+esc(c[2])+'</td><td>'+esc(prodLabel(c[4]))+'</td>'
        + '<td class="mono" style="font-size:.8rem;white-space:nowrap">'+(r.ms.length ? r.ms.map(esc).join("<br>") : '<span class="lowN">—</span>')+'</td>'
        + '<td class="det">'+r.ms.map(function(m){ return esc(itemsOf(c[4], m).join("; ")); }).join("<br>")+'</td>'
        + '<td class="flagnote">'+(c[10] ? esc(c[10].split("(")[0].trim()) : '')+'</td>'
        + '<td>'+(inS[k] ? '<span class="pill p-ok">'+esc(t.inSample)+'</span>' : '<button type="button" class="btn" data-add="'+esc(k)+'">'+esc(t.add)+'</button>')+'</td></tr>';
    });
    h += '</tbody></table></div>';
    h += '<div class="wlpager"><button type="button" class="btn" id="dlprev"'+(dl.page?'':' disabled')+'>'+esc(t.prev)+'</button>'
      + '<span class="pinfo">'+esc(fmt(t.pageOf, {a:dl.page*PAGE+1, b:Math.min(n, dl.page*PAGE+PAGE), n:n}))+'</span>'
      + '<button type="button" class="btn" id="dlnext"'+(dl.page+1<pages?'':' disabled')+'>'+esc(t.next)+'</button></div></div>';
    return h;
  }

  function renderTrend(){
    var t = T(), weeks = weekList(), rows = weeks.map(function(k){
      var recs = recsOf(k).filter(function(r){ return !r.removed; }), a = agg(recs);
      return {k:k, a:a, due:instances(k).length};
    });
    var h = '<div class="panel"><h3>'+esc(t.pTrend)+' <span class="hint">'+esc(t.pTrendH)+'</span></h3><div class="pad">';
    h += '<div class="mtrend">' + rows.map(function(r){
      var s = r.a.score, hgt = s === null ? 2 : Math.max(s, 2);
      return '<div class="mcol'+(r.k===week?' sel':'')+'"><button type="button" data-week="'+esc(r.k)+'" title="'+esc(weekLabel(r.k))+'">'
        + '<span class="mval" style="color:'+scoreColour(s)+'">'+(s===null?'—':s+'%')+'</span>'
        + '<span class="mbar" style="height:'+hgt+'%;background:'+(s===null?'var(--surface-3)':scoreColour(s))+'"></span>'
        + '<span class="mlab">'+esc(wTag(r.k))+'</span><span class="mn">'+(r.a.rv||'')+'</span></button></div>';
    }).join("") + '</div>';
    h += '<div class="tblwrap" style="margin-top:16px"><table><thead><tr><th>'+esc(t.thWeek)+'</th><th class="n">'+esc(t.thDue)+'</th><th class="n">'+esc(t.thAudited)+'</th><th class="n">'+esc(t.thScore)+'</th><th class="n">'+esc(t.thPass)+'</th><th class="n">'+esc(t.thPartial)+'</th><th class="n">'+esc(t.thFail)+'</th><th class="n">'+esc(t.thData)+'</th></tr></thead><tbody>';
    rows.forEach(function(r){
      var a = r.a;
      h += '<tr'+(r.k===week?' style="background:var(--accent-soft)"':'')+'><td class="mono" style="font-size:.82rem">'+esc(wTag(r.k))+' <span style="color:var(--muted)">'+esc(weekLabel(r.k))+'</span></td>'
        + '<td class="n">'+r.due+'</td><td class="n">'+a.rv+'</td><td class="n" style="color:'+scoreColour(a.score)+';font-weight:600">'+(a.score===null?'—':a.score+'%')+'</td>'
        + '<td class="n">'+a.pass+'</td><td class="n">'+a.partial+'</td><td class="n">'+a.fail+'</td><td class="n">'+a.data+'</td></tr>';
    });
    h += '</tbody></table></div>';

    /* cadence × week and product × week */
    var wk = rows.filter(function(r){ return r.a.cad > 0; });
    if(wk.length){
      var msAll = {}, pAll = {};
      wk.forEach(function(r){ Object.keys(r.a.byMs).forEach(function(m){ msAll[m] = 1; }); Object.keys(r.a.byProd).forEach(function(p){ pAll[p] = 1; }); });
      var heat = function(cell){ if(!cell || !cell.n) return '<span class="lowN">—</span>';
        var s = Math.round(cell.pts / cell.n * 100);
        return '<span class="heat" style="background:'+(s>=80?'var(--ok-soft)':s>=50?'var(--warn-soft)':'var(--bad-soft)')+';color:'+scoreColour(s)+'">'+s+'% <small style="color:var(--muted)">('+cell.n+')</small></span>'; };
      h += '<h3 style="padding:14px 0 10px;margin:16px 0 0;border-top:1px solid var(--rule-2);font-size:.92rem">'+esc(t.pMatrix)+' <span class="hint" style="font-weight:400;color:var(--muted);font-size:.79rem">'+esc(t.pMatrixH)+'</span></h3>';
      h += '<div class="tblwrap"><table><thead><tr><th></th>'+wk.map(function(r){ return '<th class="n">'+esc(wTag(r.k))+'</th>'; }).join("")+'</tr></thead><tbody>';
      Object.keys(msAll).sort(msSort).forEach(function(m){
        h += '<tr><td class="mono" style="font-size:.82rem">'+esc(m)+'</td>'+wk.map(function(r){ return '<td class="n">'+heat(r.a.byMs[m])+'</td>'; }).join("")+'</tr>';
      });
      Object.keys(pAll).sort(function(x,y){ return PRODS.indexOf(x) - PRODS.indexOf(y); }).forEach(function(p){
        h += '<tr><td style="font-size:.84rem">'+esc(prodLabel(p))+'</td>'+wk.map(function(r){ return '<td class="n">'+heat(r.a.byProd[p])+'</td>'; }).join("")+'</tr>';
      });
      h += '</tbody></table></div>';
    }
    h += '</div></div>';
    return h;
  }

  /* ---------------- wiring ---------------- */
  function wireApp(){
    function on(id, ev, fn){ var e = document.getElementById(id); if(e) e[ev] = fn; }
    on("fbSave","onclick",function(){ var ta = document.getElementById("fbText"); if(ta) saveFeedback(week, ta.value); });
    on("byName","onchange",function(e){ by = e.target.value.trim() || by; persistLocal(); });
    on("drawBtn","onclick",function(){
      var n = +(document.getElementById("drawN").value) || 1;
      draw(week, n); buildFilters(); render();
    });
    on("dlq","oninput",function(e){ dl.q = e.target.value; dl.page = 0; render(); keepFocus("dlq"); });
    on("dlms","onchange",function(e){ dl.ms = e.target.value; dl.page = 0; render(); });
    on("dlp","onchange",function(e){ dl.prod = e.target.value; dl.page = 0; render(); });
    on("dlall","onchange",function(e){ dl.all = e.target.checked; dl.page = 0; render(); });
    on("dlprev","onclick",function(){ if(dl.page > 0){ dl.page--; render(); } });
    on("dlnext","onclick",function(){ dl.page++; render(); });
    document.querySelectorAll("button[data-add]").forEach(function(b){
      b.onclick = function(){ var c = CASE_BY_KEY[b.dataset.add]; if(c){ addToSample(c, week); buildFilters(); render(); } };
    });
    document.querySelectorAll("button[data-week]").forEach(function(b){
      b.onclick = function(){ week = b.dataset.week; dl.page = 0; loadShotURLs(week).then(function(){ buildFilters(); render(); window.scrollTo({top:0, behavior:"smooth"}); }); };
    });
    document.querySelectorAll(".acard").forEach(function(card){
      var r = AUDITS[card.dataset.key]; if(!r) return;
      card.querySelectorAll("input[data-ms]").forEach(function(cb){
        cb.onchange = function(){
          var m = cb.dataset.ms, i = +cb.dataset.i, bits = r.cads[m] || "";
          while(bits.length <= i) bits += "0";
          r.cads[m] = bits.slice(0, i) + (cb.checked ? "1" : "0") + bits.slice(i+1);
          touch(r, true); save(r);
        };
      });
      card.querySelectorAll("button[data-all]").forEach(function(b){
        b.onclick = function(){
          Object.keys(r.cads).forEach(function(m){ var n = Math.max(nItems(r.prod, m), 1); r.cads[m] = new Array(n + 1).join(b.dataset.all); });
          touch(r, true); save(r);
        };
      });
      var ta = card.querySelector("textarea[data-rem]");
      if(ta){ ta.oninput = function(){ r.remark = ta.value; touch(r); clearTimeout(timers["t"+r.key]); timers["t"+r.key] = setTimeout(function(){ save(r); keepFocusEl(card, "textarea[data-rem]"); }, 900); }; }
      var fl = card.querySelector("input[data-flag]");
      if(fl){ fl.onchange = function(){ r.data = fl.checked ? 1 : 0; touch(r, true); save(r); }; }
      var up = card.querySelector("input[data-upl]");
      if(up){ up.onchange = function(){ addShots(r, up.files); }; }
      card.querySelectorAll("button[data-shot]").forEach(function(b){ b.onclick = function(){ removeShot(r, b.dataset.shot); }; });
      var rm = card.querySelector("button[data-remove]");
      if(rm){ rm.onclick = function(){ removeFromSample(r); buildFilters(); render(); }; }
    });
  }
  var focusKey = null;
  function keepFocus(id){ var q = document.getElementById(id); if(q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
  function keepFocusEl(card, sel){
    var el = document.querySelector('.acard[data-key="'+card.dataset.key.replace(/"/g,'\\"')+'"] '+sel);
    if(el && document.activeElement !== el && document.activeElement && document.activeElement.tagName !== "TEXTAREA"){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }

  /* ---------------- shell ---------------- */
  function renderWho(){
    var el = document.getElementById("whoami");
    el.innerHTML = session ? '<button type="button" id="soBtn">'+esc(T().signout)+'</button>' : "";
    if(session) document.getElementById("soBtn").onclick = signOut;
  }
  function applyGateLang(){
    var t = T();
    document.getElementById("gateLede").textContent = t.glede;
    document.getElementById("lpass").textContent = t.lpass;
    var b = document.getElementById("gateBtn");
    if(!b.disabled) b.textContent = t.signin;
  }
  function saveSession(){ session={ok:1}; try{sessionStorage.setItem("cz_session","1")}catch(e){} }
  function loadSession(){ try{ if(sessionStorage.getItem("cz_session")==="1"){session={ok:1};return true;} }catch(e){} return false; }
  function signOut(){
    session=null; clinic=CLINIC; week=LAST_WEEK;
    try{sessionStorage.removeItem("cz_session")}catch(e){}
    document.getElementById("wrap").hidden=true;
    document.getElementById("gate").classList.remove("gone");
    var g=document.getElementById("gp"); g.value=""; g.focus();
  }
  function enterApp(){
    document.getElementById("gate").classList.add("gone");
    document.getElementById("wrap").hidden=false;
    var q = /[?&]week=(\d{4}-\d{2}-\d{2})/.exec(location.search);
    week = q ? mondayOf(q[1]) : LAST_WEEK;          /* open on last week: the one just closed */
    loadEmbedded(); loadLocal();
    openDB().then(function(){ return loadShotURLs(week); }).then(function(){
      buildFilters(); render();
      return loadLive();
    }).then(function(changed){
      if(!session) return;
      if(changed){ loadShotURLs(week).then(function(){ buildFilters(); render(); }); } else renderFeed();
    });
  }
  document.getElementById("gateform").addEventListener("submit", function(ev){
    ev.preventDefault();
    var t=T(), btn=document.getElementById("gateBtn"), err=document.getElementById("gateErr");
    btn.disabled=true; btn.textContent=t.signingin; err.classList.remove("on");
    sha256(document.getElementById("gp").value).then(function(hh){
      btn.disabled=false; btn.textContent=t.signin;
      if(PW_HASHES.indexOf(hh) === -1){ err.textContent=t.badlogin; err.classList.add("on");
        var g=document.getElementById("gp"); g.value=""; g.focus(); return; }
      saveSession(); enterApp();
    }).catch(function(){ btn.disabled=false; btn.textContent=t.signin;
      err.textContent=t.badlogin; err.classList.add("on"); });
  });
  document.getElementById("langseg").querySelectorAll("button").forEach(function(b){
    b.onclick=function(){ lang=b.dataset.l;
      document.getElementById("langseg").querySelectorAll("button").forEach(function(x){
        x.setAttribute("aria-pressed", String(x===b)); });
      applyGateLang(); if(session){ buildFilters(); render(); } };
  });

  applyGateLang();
  if(loadSession()) enterApp();
  else document.getElementById("gp").focus();
})();
</script>
